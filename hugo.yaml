
# -----------------------------------------------------------------------------
# Hugo configuration — Microsoft 365 & Security Copilot Blog
# Theme: PaperMod (https://github.com/adityatelange/hugo-PaperMod)
# -----------------------------------------------------------------------------

baseURL: "https://thecybersec.gr/"   # <-- change after creating the GitHub repo
locale: "en-us"
title: "Microsoft 365 Security Insights"
# theme: "PaperMod"
defaultContentLanguage: "en"
description: "Practical, hands-on content on Microsoft 365 and Microsoft Security Copilot from a Senior Cloud Architect."
enableGitInfo: false
googleAnalytics: G-XL1JKVTRG9

# Pagination & build
pagination:
  pagerSize: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# Better URLs
canonifyURLs: true

# -----------------------------------------------------------------------------
# Outputs (RSS + JSON for built-in search)
# -----------------------------------------------------------------------------
outputs:
  home:
    - HTML
    - RSS
    - JSON

# -----------------------------------------------------------------------------
# Taxonomies — categories, tags, and series (great for multi-part deep dives)
# -----------------------------------------------------------------------------
taxonomies:
  category: categories
  tag: tags
  series: series
  release: releases        # νέα taxonomy για Preview/GA status

# -----------------------------------------------------------------------------
# Markdown rendering
# -----------------------------------------------------------------------------
markup:
  highlight:
    # style: dracula   # Default github-dark το αλλάζω σε dracula  
    lineNos: false
    codeFences: true
    guessSyntax: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: true   # allows raw HTML in markdown (needed for callouts, embeds)
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

# -----------------------------------------------------------------------------
# PaperMod site parameters
# -----------------------------------------------------------------------------
sitemap:
  changefreq: "weekly"
  priority: 0.5
  filename: "sitemap.xml"

# -----------------------------------------------------------------------------
# PaperMod theme parameters
# -----------------------------------------------------------------------------
params:
  env: production
  title: "Microsoft 365 Security Insights"
  description: "Practical, hands-on content on Microsoft 365 and Microsoft Security Copilot from a Senior Cloud Architect."
  keywords:
    - Microsoft 365
    - Microsoft Security Copilot
    - Microsoft Defender
    - Microsoft Sentinel
    - Microsoft Entra
    - Security Architecture
    - Cloud Security
  author: "Dimosthenis Atteia"   # <-- change to your public name/handle
  authorURL: "https://thecybersec.gr/about/"
  authorJobTitle: "CIO/CISO"
  DateFormat: "January 2, 2006"
  defaultTheme: auto       # auto | dark | light
  indexNowKey: "672fb3b80a6e41eaa27168efc280b584"
  disableThemeToggle: false
  ShowLastMod: true
  
  # UI behaviour
  ShowReadingTime: true
  ShowShareButtons: true
  ShareButtons: ["linkedin", "x", "reddit"]
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  comments: false           # set true if you wire up Giscus/Utterances later
  hideMeta: false
  disableScrollToTop: false

  # Search (Fuse.js, built into PaperMod)
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "contents", "summary", "permalink"]

  # Profile-style homepage (use this OR homeInfoParams below, not both)
  # ---------------------------------------------------------------------------
  # profileMode:
  #   enabled: false
  #   title: "Dimosthenis | Senior Cloud Architect"
  #   subtitle: "Microsoft 365 & Microsoft Security Copilot"
  #   imageUrl: "/images/avatar.jpg"
  #   imageWidth: 160
  #   imageHeight: 160
  #   buttons:
  #     - name: Blog
  #       url: posts
  #     - name: About
  #       url: about

  # Standard homepage banner
  homeInfoParams:
    Title: "Γειά σας 👋, Είμαι ο Δημοσθένης και δεν είμαι bot..."
    Content: |
      <img src="/images/Dimos_BannerNew.webp" alt="Dimosthenis" width="774" height="192" fetchpriority="high" style="max-width:100%;height:auto;">
      
      Είμαι **CIO/CISO** στον δεύτερο μεγαλύτερο όμιλο αλευροβιομηχανίας και παραγωγής τροφίμων στην Ελλάδα. Σχεδιάζω και υλοποιώ τη στρατηγική ασφάλειας του οργανισμού πάνω στο **Microsoft Security** stack, με **Microsoft Defender XDR**, **Entra ID**, **Intune**, **Azure security services** και **Purview**, προστατεύοντας ένα πραγματικό IT/OT περιβάλλον παραγωγής υψηλής κρισιμότητας.<br>

      Γράφω τεχνικό περιεχόμενο σε βάθος, δοκιμασμένο σε production, για security architects, IT professionals και administrators που διαχειρίζονται αυτές τις πλατφόρμες καθημερινά. Περιλαμβάνει hardening guides, αναλυτικές οδηγίες παραμετροποίησης, real-world detections και τα διδάγματα που φαίνονται μόνο όταν κάτι βγει σε παραγωγή. Στόχος μου είναι να μετατρέπω όσα μαθαίνω προστατεύοντας ένα πραγματικό περιβάλλον σε πρακτική, επαναχρησιμοποιήσιμη γνώση για την ευρύτερη **Ελληνική** κοινότητα **Microsoft Security** και μέσα από αναλυτικά άρθρα, hands-on walkthroughs και ανοιχτό διάλογο με συναδέλφους που αντιμετωπίζουν τις ίδιες προκλήσεις.<br>

      **🆕 New:** Admin Center Portal Status<br>

      **🆕 New Features** vs **🚧 Preview** vs **✅ Generally Available**. Δείτε με μια ματιά ποια features είναι ασφαλή για deployment σε περιβάλλοντα με κανονιστικές απαιτήσεις συμμόρφωσης.<br>

      Επιλέξτε θέμα από το παραπάνω μενού ή ξεκινήστε από τα πιο πρόσφατα άρθρα παρακάτω.<br>

  # Social links — show as icons in the header
  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/dimosthenisatteia/"
    - name: github
      url: "https://github.com/dimosatteia"

  # Edit on GitHub (great for community contributions)
  editPost:
    URL: "https://github.com/dimosatteia/dimosatteia.github.io/edit/main/content"
    Text: "Suggest an edit"
    appendFilePath: true
    
  # Cover images per post (default behaviour)
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
    responsiveImages: true

  # Assets / favicons
  assets:
    disableHLJS: true        # we use Hugo Chroma for highlighting
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-96x96.png"
    favicon32x32: "/favicon-96x96.png"
    apple_touch_icon: "/apple-touch-icon.png"

# -----------------------------------------------------------------------------
# Top navigation menu
# -----------------------------------------------------------------------------
menu:
  main:
    - identifier: posts
      name: Blog
      url: /posts/
      weight: 10
    - identifier: series
      name: Series
      url: /series/
      weight: 20
    - identifier: releases
      name: Release Status
      url: /releases/
      weight: 25
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
    - identifier: search
      name: 🔍
      url: /search/
      weight: 60
   
# -----------------------------------------------------------------------------
# Privacy
# -----------------------------------------------------------------------------
privacy:
  googleAnalytics:
    disable: false
  x:
    enableDNT: true
  vimeo:
    enableDNT: true
  youtube:
    privacyEnhanced: true
 