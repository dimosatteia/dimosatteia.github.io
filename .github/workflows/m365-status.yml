name: Update M365 status

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # για να ξεκινήσει το deploy: ένα push από το GITHUB_TOKEN δεν ενεργοποιεί το hugo.yml

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Οι ίδιες δημόσιες πηγές που φορτώνει η σελίδα https://status.cloud.microsoft/m365/
      #   mac   -> κάρτα «Microsoft 365 (Business or Enterprise)»  -> data/m365status.json
      #   azure -> κάρτα «Azure»                                    -> data/azurestatus.json
      # Αν μια κλήση αποτύχει, κρατάμε το προηγούμενο αρχείο.
      - name: Fetch Microsoft 365 (Business or Enterprise) and Azure status
        id: fetch
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          def fetch(card):
              req = urllib.request.Request("https://status.cloud.microsoft/api/posts/" + card,
                                           headers={"User-Agent": "thecybersec.gr status widget"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.load(r)
              if isinstance(d, list):
                  d = d[0] if d else {}
              return {"status": d.get("Status") or "Unknown",
                      "updated": d.get("LastUpdatedTime") or "",
                      "title": d.get("Title") or ""}

          changed = False
          for card, path in (("mac", "data/m365status.json"), ("azure", "data/azurestatus.json")):
              try:
                  new = fetch(card)
              except Exception as e:
                  print(card, "status fetch failed:", e)
                  continue
              try:
                  old = json.load(open(path, encoding="utf-8"))
              except Exception:
                  old = {}
              if (old.get("status"), old.get("title")) != (new["status"], new["title"]):
                  changed = True
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(new, f, indent=2, ensure_ascii=False)
                  f.write("\n")
              print(card, "->", new["status"], "|", new["title"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("status_changed=%s\n" % ("true" if changed else "false"))
          EOF

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/m365status.json data/azurestatus.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update Microsoft 365 and Azure status"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Νέο deploy μόνο όταν αλλάζει η κατάσταση (όχι για κάθε αλλαγή ώρας),
      # ώστε το widget να γίνεται κόκκινο ή πράσινο χωρίς να περιμένει το επόμενο deploy.
      - name: Deploy the site
        if: steps.commit.outputs.pushed == 'true' && steps.fetch.outputs.status_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yml --ref main
