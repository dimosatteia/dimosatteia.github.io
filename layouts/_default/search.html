{{ partial "header.html" . }}

<main class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
    <h1 class="text-3xl font-bold text-slate-100 mb-6">Αποτελέσματα αναζήτησης</h1>
    
    <div class="mb-8">
        <input 
            type="text" 
            id="customSearchInput" 
            placeholder="Αναζήτηση άρθρων, λέξεων-κλειδιών..." 
            class="w-full max-w-2xl bg-slate-950 border border-slate-800 focus:border-blue-500 rounded-lg py-3 px-4 text-base text-slate-200 placeholder:text-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
            autofocus
        >
    </div>

    <div id="searchResults" class="space-y-4 max-w-4xl">
        <p class="text-slate-400 text-sm">Πληκτρολογήστε έναν όρο παραπάνω (π.χ. MC1422060)...</p>
    </div>
</main>

{{ partial "footer.html" . }}

<script>
    let searchData = [];

    // Φόρτωση του index.json στη μνήμη κατά την είσοδο στη σελίδα
    fetch('/index.json')
        .then(response => response.json())
        .then(data => {
            searchData = data;
            // Έλεγχος αν υπάρχει ήδη όρος στο URL (π.χ. από την πάνω μπάρα)
            const urlParams = new URLSearchParams(window.location.search);
            const q = urlParams.get('q');
            if (q) {
                document.getElementById('customSearchInput').value = q;
                performSearch(q);
            }
        });

    const input = document.getElementById('customSearchInput');
    const resultsContainer = document.getElementById('searchResults');

    input.addEventListener('input', function(e) {
        performSearch(e.target.value);
    });

    const LOOK = { 'α': 'a', 'β': 'b', 'ε': 'e', 'ζ': 'z', 'η': 'h', 'ι': 'i', 'κ': 'k', 'μ': 'm', 'ν': 'n', 'ο': 'o', 'ρ': 'p', 'τ': 't', 'υ': 'y', 'χ': 'x' };
    function norm(s) {
        return Array.from(String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')).map(c => LOOK[c] || c).join('');
    }
    function esc(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }
    // Από πού είναι το αποτέλεσμα: άρθρο, KQL query ή οδηγός (ΚΥΑ 1689/2025, NIS2, ISO 27001, GDPR)
    function badge(item) {
        if (item.type === 'kql') return '<span class="text-emerald-400 border border-emerald-500/40 rounded px-1.5">KQL</span>';
        if (item.type === 'guide') return '<span class="text-amber-300 border border-amber-500/40 rounded px-1.5">' + esc(item.source) + '</span>';
        return '<span>📅 ' + esc(item.date) + '</span>';
    }

    function performSearch(query) {
        resultsContainer.innerHTML = '';
        if (!query || query.trim() === '') {
            resultsContainer.innerHTML = '<p class="text-slate-400 text-sm">Πληκτρολογήστε έναν όρο παραπάνω...</p>';
            return;
        }

        // Ίδια σύγκριση με το πλαίσιο του header (static/js/search-live.js): χωρίς τόνους, πεζά/κεφαλαία,
        // και τα Ελληνικά γράμματα που μοιάζουν με Λατινικά ως ίδια (π.χ. «Α.6» βρίσκει το A.6 του ISO).
        const term = norm(query);
        const scored = [];
        searchData.forEach(item => {
            const at = norm(item.title).indexOf(term);
            const score = at === 0 ? 0 : at > 0 ? 1 : (norm(item.summary) + ' ' + norm(item.contents)).includes(term) ? 2 : -1;
            if (score >= 0) scored.push({ item, score });
        });
        scored.sort((a, b) => a.score - b.score || String(b.item.date).localeCompare(String(a.item.date)));
        const filtered = scored.map(s => s.item);

        if (filtered.length === 0) {
            resultsContainer.innerHTML = '<p class="text-slate-400">Δεν βρέθηκαν αποτελέσματα για "' + esc(query) + '".</p>';
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'glass-card p-5 rounded-lg border border-slate-800 hover:border-blue-500/50 transition-colors bg-slate-900/60 backdrop-blur-md';
            card.innerHTML = `
                <div class="flex items-center gap-4 text-xs text-slate-400 mb-2">
                    ${badge(item)}
                </div>
                <h2 class="text-xl font-bold text-slate-100 mb-2">
                    <a href="${item.permalink}" class="hover:text-blue-400 transition-colors">${esc(item.title)}</a>
                </h2>
                <p class="text-slate-300 text-sm mb-3">${esc(item.summary)}</p>
                <a href="${item.permalink}" class="text-blue-400 text-sm font-medium hover:underline">Διαβάστε περισσότερα →</a>
            `;
            resultsContainer.appendChild(card);
        });
    }
</script>
