{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="flex items-center justify-center gap-2 mt-8 font-mono text-sm">
    {{ if $paginator.HasPrev }}
    <a href="{{ $paginator.First.URL }}" class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded text-slate-400 hover:text-white hover:border-blue-500 transition-colors">««</a>
    <a href="{{ $paginator.Prev.URL }}" class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded text-slate-400 hover:text-white hover:border-blue-500 transition-colors">«</a>
    {{ end }}

    {{ range $paginator.Pagers }}
        {{ if eq . $paginator }}
        <span class="px-3 py-1.5 bg-blue-500/20 border border-blue-500 rounded text-blue-400">{{ .PageNumber }}</span>
        {{ else }}
        <a href="{{ .URL }}" class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded text-slate-400 hover:text-white hover:border-blue-500 transition-colors">{{ .PageNumber }}</a>
        {{ end }}
    {{ end }}

    {{ if $paginator.HasNext }}
    <a href="{{ $paginator.Next.URL }}" class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded text-slate-400 hover:text-white hover:border-blue-500 transition-colors">»</a>
    <a href="{{ $paginator.Last.URL }}" class="px-3 py-1.5 bg-slate-900 border border-slate-800 rounded text-slate-400 hover:text-white hover:border-blue-500 transition-colors">»»</a>
    {{ end }}
</nav>
{{ end }}
