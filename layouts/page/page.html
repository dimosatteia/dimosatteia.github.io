{{ define "main" }}
<main class="flex-grow max-w-[1400px] mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-6">
    <div class="glass-card p-8 rounded-xl flex flex-col gap-6 prose prose-invert prose-slate max-w-none prose-headings:font-semibold prose-headings:tracking-tight prose-a:text-blue-400 hover:prose-a:text-blue-300">
        <h1 class="text-3xl font-bold tracking-tight text-slate-100 m-0">{{ .Title }}</h1>
        {{ .Content }}
        {{ with .Params.tags }}
        <div class="not-prose flex flex-wrap items-center gap-2 mt-2">
            <span class="text-xs font-mono text-slate-500 mr-2 uppercase">Tags:</span>
            {{ range . }}
            <a href="{{ "tags/" | relLangURL }}{{ . | urlize }}" class="px-2 py-1 bg-slate-900 border border-slate-700 text-slate-300 hover:text-white hover:border-blue-500 text-[10px] font-mono rounded transition-colors">{{ . }}</a>
            {{ end }}
        </div>
        {{ end }}
        {{ partial "mitre-chips.html" . }}
    </div>
</main>
{{ end }}
