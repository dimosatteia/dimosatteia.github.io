# Εργαλείο «Αξιολόγηση προμηθευτή» (/axiologisi-promitheyti/)
# Η σελίδα διαβάζει αυτό το αρχείο. Κάθε ερώτηση:
#   lvl:   από ποια κρισιμότητα και πάνω μπαίνει (1 χαμηλή, 2 μέση, 3 υψηλή)
#   types: σε ποιους τύπους προμηθευτή (all ή λίστα)
#   if:    μπαίνει μόνο αν ισχύει το χαρακτηριστικό (personal, remote, subcontract, hosting)
#   key:   από ποια κρισιμότητα και πάνω η ερώτηση είναι «κρίσιμη» (αρνητική απάντηση = κόκκινη σημαία)
#   map:   αντιστοίχιση στα κωδικά των data/nis2.yaml (kya), data/nis2directive.yaml (nis2), data/iso27001.yaml (iso), data/gdpr.yaml (gdpr)
# Οι συμβατικοί όροι (terms): show = από ποια κρισιμότητα εμφανίζονται, need = από ποια κρισιμότητα είναι απαραίτητοι.
# Πηγή για τους όρους: Εκτελεστικός Κανονισμός (ΕΕ) 2024/2690, Παράρτημα, σημείο 5.1.4.
updated: '2026-10-25'

types:
- key: msp
  icon: "🖥️"
  name: MSP ή υποστήριξη IT
  hint: Διαχειρίζεται ή υποστηρίζει τα συστήματα, το δίκτυο ή τους χρήστες σου (managed services, IT support, helpdesk).
  defaults: [remote]
- key: cloud
  icon: "☁️"
  name: Cloud ή SaaS
  hint: Σου παρέχει εφαρμογή ή υποδομή ως υπηρεσία, φιλοξενία ή backup στο cloud.
  defaults: [hosting, personal]
- key: ot
  icon: "🏭"
  name: Integrator OT ή αυτοματισμών
  hint: Εγκαθιστά, προγραμματίζει ή συντηρεί PLC, SCADA, HMI και γραμμές παραγωγής.
  defaults: [remote]
- key: software
  icon: "🧩"
  name: Προμηθευτής λογισμικού
  hint: Σου πουλά ή αναπτύσσει λογισμικό που εγκαθίσταται στα δικά σου συστήματα (ERP, εξειδικευμένες εφαρμογές, ανάπτυξη κατά παραγγελία).
  defaults: []
- key: physical
  icon: "🔑"
  name: Φυσικές υπηρεσίες
  hint: Το προσωπικό του μπαίνει στους χώρους σου (φύλαξη, καθαρισμός, συντήρηση εγκαταστάσεων, μεταφορές, καταστροφή εγγράφων).
  defaults: []

flags:
- key: personal
  name: Επεξεργάζεται προσωπικά δεδομένα για λογαριασμό σου
  hint: Είναι εκτελών την επεξεργασία κατά το άρθρο 28 του GDPR, π.χ. μισθοδοσία, CRM, IT support με πρόσβαση σε mailboxes.
- key: remote
  name: Έχει απομακρυσμένη πρόσβαση στα συστήματα ή στο δίκτυό σου
  hint: VPN, εργαλεία απομακρυσμένης υποστήριξης, 4G router σε εγκατάσταση OT.
- key: hosting
  name: Φιλοξενεί ή αποθηκεύει δεδομένα σου
  hint: Τα δεδομένα σου βρίσκονται σε δικές του υποδομές ή σε υποδομές που διαχειρίζεται.
- key: subcontract
  name: Χρησιμοποιεί υπεργολάβους για την υπηρεσία
  hint: Αν δεν ξέρεις, τσέκαρέ το. Η ερώτηση θα του ζητήσει να το δηλώσει.

levels:
- key: 1
  name: Χαμηλή
  hint: Η διακοπή του δεν επηρεάζει κρίσιμη λειτουργία και δεν έχει πρόσβαση σε συστήματα ή ευαίσθητα δεδομένα.
  review: Επανεξέταση κάθε δύο ή τρία χρόνια ή όταν αλλάξει η υπηρεσία.
  evidence: Αρκούν οι απαντήσεις του προμηθευτή.
- key: 2
  name: Μέση
  hint: Έχει πρόσβαση σε συστήματα ή δεδομένα σου, ή η διακοπή του επηρεάζει λειτουργία σου, αλλά αντικαθίσταται χωρίς μεγάλη δυσκολία.
  review: Επανεξέταση κάθε χρόνο.
  evidence: Ζήτα τεκμήρια για τις κρίσιμες ερωτήσεις (★).
- key: 3
  name: Υψηλή (κρίσιμος προμηθευτής)
  hint: Η διακοπή του σταματά κρίσιμη λειτουργία σου, έχει προνομιακή ή απομακρυσμένη πρόσβαση, ή δύσκολα αντικαθίσταται.
  review: Επανεξέταση κάθε χρόνο και μετά από κάθε σοβαρό περιστατικό ή ουσιώδη αλλαγή. Για βασικές οντότητες ισχύουν και οι ενισχυμένες απαιτήσεις του άρθρου 12.2 της ΚΥΑ.
  evidence: Ζήτα τεκμήριο για κάθε απάντηση και, όπου γίνεται, έκθεση ανεξάρτητου ελέγχου ή επιτόπιο έλεγχο.

# Βοηθητικές ερωτήσεις για την πρόταση κρισιμότητας: άθροισμα βαρών, 0 = χαμηλή, 1-2 = μέση, 3+ = υψηλή
crit:
- key: disrupt
  w: 2
  text: Αν σταματήσει η υπηρεσία του, σταματά ή διαταράσσεται σοβαρά κρίσιμη λειτουργία σου (παραγωγή, πωλήσεις, εξυπηρέτηση);
- key: access
  w: 2
  text: Έχει προνομιακή ή απομακρυσμένη πρόσβαση στα συστήματα ή στο δίκτυό σου, IT ή OT;
- key: data
  w: 1
  text: Επεξεργάζεται ή φιλοξενεί εμπιστευτικά ή προσωπικά δεδομένα σου;
- key: replace
  w: 1
  text: Είναι δύσκολο να τον αντικαταστήσεις μέσα σε λίγες εβδομάδες;

domains:
