  name: Διακυβέρνηση και πιστοποιήσεις
- key: hr
  name: Προσωπικό
- key: access
  name: Έλεγχος πρόσβασης
- key: data
  name: Προστασία δεδομένων
- key: dev
  name: Ασφάλεια προϊόντος και ανάπτυξης
- key: vuln
  name: Ευπάθειες και ενημερώσεις
- key: ot
  name: Συστήματα OT
- key: phys
  name: Φυσική ασφάλεια
- key: inc
  name: Περιστατικά ασφάλειας
- key: bcp
  name: Επιχειρησιακή συνέχεια
- key: sub
  name: Υπεργολάβοι
- key: exit
  name: Λήξη συνεργασίας

questions:
# Διακυβέρνηση
- id: G1
  domain: gov
  lvl: 1
  types: all
  text: Διαθέτετε γραπτή πολιτική ασφάλειας πληροφοριών, εγκεκριμένη από τη διοίκησή σας;
  evidence: Αντίγραφο ή περίληψη της πολιτικής, με ημερομηνία έγκρισης.
  map: {kya: ['6.α'], nis2: [21.2.α], iso: [A.5.1]}
- id: G2
  domain: gov
  lvl: 1
  types: all
  text: Έχετε ορίσει υπεύθυνο ή σημείο επαφής για θέματα ασφάλειας πληροφοριών; Δώστε τον ρόλο και τα στοιχεία επικοινωνίας.
  evidence: Ρόλος, email και τηλέφωνο που απαντά και εκτός ωραρίου.
  map: {kya: ['7.α'], iso: [A.5.2]}
- id: G3
  domain: gov
  lvl: 2
  types: [msp, cloud, ot, software]
  key: 3
  text: Είστε πιστοποιημένοι κατά ISO/IEC 27001 ή διαθέτετε έκθεση SOC 2 Type II; Ποιο είναι το πεδίο εφαρμογής και πότε λήγει;
  evidence: Πιστοποιητικό με το πεδίο εφαρμογής ή η πιο πρόσφατη έκθεση SOC 2.
  map: {kya: [12.1.γ], nis2: ['21.3'], iso: [A.5.19, A.5.22]}
- id: G4
  domain: gov
  lvl: 2
  types: [cloud]
  text: Περιλαμβάνεται η υπηρεσία που μας παρέχετε στο πεδίο εφαρμογής της πιστοποίησης ή της έκθεσης ελέγχου;
  evidence: Απόσπασμα του πεδίου εφαρμογής.
  map: {kya: [12.1.γ], nis2: ['21.3'], iso: [A.5.23]}
- id: G5
  domain: gov
  lvl: 3
  types: [msp, cloud, ot, software]
  text: Κάνετε ανεξάρτητους ελέγχους ασφάλειας (εσωτερικό έλεγχο, penetration test) τουλάχιστον μία φορά τον χρόνο; Πότε έγινε ο τελευταίος;
  evidence: Περίληψη αποτελεσμάτων ή επιστολή του ελεγκτή (attestation letter).
  map: {kya: ['8.α'], nis2: [21.2.στ], iso: [A.5.35]}
- id: G6
  domain: gov
  lvl: 2
  types: [msp, cloud, ot, software]
  key: 2
  text: Δέχεστε να ελέγξουμε, εμείς ή ανεξάρτητος ελεγκτής, τα μέτρα ασφάλειας που αφορούν την υπηρεσία μας, ή να μας δίνετε τις εκθέσεις των δικών σας ελέγχων;
  evidence: Ρήτρα ελέγχου στη σύμβαση ή δέσμευση για παροχή εκθέσεων.
  map: {kya: [12.1.δ], nis2: [21.2.δ], iso: [A.5.20, A.5.22], gdpr: ['28.3']}
- id: G7
  domain: gov
  lvl: 2
  types: all
  text: Υπάγεστε οι ίδιοι στον ν. 5160/2024 ως βασική ή σημαντική οντότητα;
  evidence: Ναι ή όχι, και η κατηγορία.
  map: {kya: [12.1.β], nis2: ['21.3']}

# Προσωπικό
- id: H1
  domain: hr
  lvl: 2
  types: all
  text: Ελέγχετε την καταλληλότητα (background check) του προσωπικού που θα έχει πρόσβαση στα συστήματα, στα δεδομένα ή στους χώρους μας, στο μέτρο που το επιτρέπει η νομοθεσία;
  evidence: Περιγραφή της διαδικασίας ελέγχου.
  map: {kya: ['10.1.α'], nis2: [21.2.θ], iso: [A.6.1]}
- id: H2
  domain: hr
  lvl: 1
  types: all
  text: Υπογράφει το προσωπικό σας συμφωνία εμπιστευτικότητας που καλύπτει και τις πληροφορίες των πελατών σας;
  evidence: Υπόδειγμα της συμφωνίας ή η σχετική ρήτρα της σύμβασης εργασίας.
  map: {kya: ['10.1.β'], nis2: [21.2.θ], iso: [A.6.6]}
- id: H3
  domain: hr
  lvl: 1
  types: all
  text: Εκπαιδεύεται το προσωπικό σας σε θέματα κυβερνοασφάλειας τουλάχιστον μία φορά τον χρόνο;
  evidence: Θεματολογία και ποσοστό ολοκλήρωσης της τελευταίας εκπαίδευσης.
  map: {kya: ['21.α'], nis2: [21.2.ζ], iso: [A.6.3]}
- id: H4
  domain: hr
  lvl: 2
  types: [msp, cloud, ot, software]
  text: Έχουν οι τεχνικοί που θα εργαστούν για εμάς την εκπαίδευση ή τις πιστοποιήσεις που χρειάζονται τα συστήματα που θα διαχειρίζονται;
  evidence: Κατάλογος πιστοποιήσεων ανά ρόλο, χωρίς ονόματα.
  map: {kya: ['21.β'], nis2: [21.2.ζ], iso: [A.6.3]}
- id: H5
  domain: hr
  lvl: 2
  types: all
  text: Όταν κάποιος από το προσωπικό σας αποχωρεί ή αλλάζει ρόλο, ανακαλείτε αμέσως την πρόσβασή του στα συστήματα και στους χώρους μας και μας ενημερώνετε;
  evidence: Διαδικασία αποχώρησης και χρόνος ανάκλησης.
  map: {kya: ['13.ε'], nis2: [21.2.θ], iso: [A.5.18, A.6.5]}
- id: H6
  domain: hr
  lvl: 1
  types: [physical]
  text: Φέρει το προσωπικό σας κάρτα ταυτοποίησης, και μπορείτε να μας δίνετε εκ των προτέρων κατάσταση με όσους θα έρχονται στους χώρους μας;
  evidence: Υπόδειγμα κάρτας και διαδικασία ενημέρωσης για αλλαγές προσωπικού.
  map: {kya: ['23.γ'], iso: [A.7.2]}

# Έλεγχος πρόσβασης
- id: A1
  domain: access
  lvl: 1
  types: [msp, ot, software]
  if: remote
  text: Χρησιμοποιεί κάθε τεχνικός σας προσωπικό λογαριασμό για την πρόσβαση στα συστήματά μας, χωρίς κοινόχρηστους λογαριασμούς;
  evidence: Περιγραφή του τρόπου διαχείρισης των λογαριασμών.
  map: {kya: ['13.β'], nis2: [21.2.θ], iso: [A.5.16]}
- id: A2
  domain: access
  lvl: 1
  types: [msp, cloud, ot, software]
  key: 1
  text: Απαιτείτε πολυπαραγοντική αυθεντικοποίηση (MFA) για κάθε πρόσβαση του προσωπικού σας στα συστήματά μας και στα δικά σας εργαλεία διαχείρισης;
  evidence: Πολιτική αυθεντικοποίησης ή στιγμιότυπο της ρύθμισης.
  map: {kya: ['13.ζ', '19.ζ'], nis2: [21.2.ι], iso: [A.8.5]}
- id: A3
  domain: access
  lvl: 2
  types: [msp, ot, software]
  if: remote
  text: Με ποιον τρόπο συνδέεστε απομακρυσμένα στα συστήματά μας (VPN, εργαλείο απομακρυσμένης υποστήριξης, jump server); Χρησιμοποιείτε μόνο τα κανάλια που εγκρίνουμε εμείς;
  evidence: Κατάλογος εργαλείων απομακρυσμένης πρόσβασης (π.χ. RMM, TeamViewer, AnyDesk) και πώς προστατεύονται.
  map: {kya: ['19.ζ'], nis2: [21.2.ι], iso: [A.5.15, A.8.20]}
- id: A4
  domain: access
  lvl: 2
  types: [msp, ot, software]
  if: remote
  key: 2
  text: Ενεργοποιείται η απομακρυσμένη πρόσβασή σας μόνο όταν τη χρειάζεστε και την εγκρίνουμε εμείς, αντί να είναι μόνιμα ανοικτή;
  evidence: Περιγραφή της διαδικασίας έγκρισης.
  map: {kya: ['19.ζ', '13.γ'], nis2: [21.2.ι], iso: [A.5.15, A.8.2]}
- id: A5
  domain: access
  lvl: 2
  types: [msp, cloud, ot, software]
  text: Καταγράφονται οι ενέργειες του προσωπικού σας στα συστήματα ή στα δεδομένα μας, και μπορείτε να μας δώσετε τις καταγραφές αν τις ζητήσουμε;
  evidence: Τι καταγράφεται και για πόσο χρόνο τηρείται.
  map: {kya: ['24.γ', '24.δ'], nis2: [21.2.β], iso: [A.8.15]}
- id: A6
  domain: access
  lvl: 3
  types: [msp, ot]
  text: Χρησιμοποιείτε λύση διαχείρισης προνομιακής πρόσβασης (PAM) ή διαχειριστή συνθηματικών για τους λογαριασμούς διαχείρισης των συστημάτων μας;
  evidence: Όνομα της λύσης και ποιοι λογαριασμοί καλύπτονται.
  map: {kya: ['13.δ'], nis2: [21.2.θ], iso: [A.8.2, A.5.17]}
- id: A7
  domain: access
  lvl: 2
  types: [msp, cloud]
  text: Πόσο συχνά ελέγχετε ποιοι από το προσωπικό σας έχουν πρόσβαση στα συστήματα ή στα δεδομένα μας;
  evidence: Συχνότητα και ημερομηνία του τελευταίου ελέγχου.
  map: {kya: ['13.η'], nis2: [21.2.θ], iso: [A.5.18]}
- id: A8
  domain: access
  lvl: 2
  types: [msp]
  text: Προστατεύονται οι σταθμοί εργασίας από τους οποίους διαχειρίζεστε τα συστήματά μας με EDR, κρυπτογράφηση δίσκου και τακτικές ενημερώσεις;
  evidence: Λύση EDR και πολιτική κρυπτογράφησης.
  map: {kya: ['20.α', '22.β'], nis2: [21.2.ζ], iso: [A.8.1, A.8.7]}
- id: A9
  domain: access
  lvl: 2
  types: [cloud]
  text: Υποστηρίζει η υπηρεσία σας ενιαία σύνδεση (SSO) με τον δικό μας πάροχο ταυτότητας, π.χ. το Microsoft Entra ID, μέσω SAML ή OpenID Connect, ώστε να ισχύουν οι δικές μας πολιτικές Conditional Access και MFA;
  evidence: Τεκμηρίωση της υποστήριξης SSO και αν περιλαμβάνεται στο πακέτο μας.
  map: {kya: ['13.στ', '13.ζ'], nis2: [21.2.ι], iso: [A.8.5]}

# Προστασία δεδομένων
- id: D1
  domain: data
  lvl: 1
  types: [cloud, msp, software]
  if: hosting
  key: 2
  text: Κρυπτογραφούνται τα δεδομένα μας κατά τη μεταφορά (TLS 1.2 ή νεότερο) και στην αποθήκευση;
  evidence: Αλγόριθμοι και ποιος διαχειρίζεται τα κλειδιά.
  map: {kya: ['22.β', '22.γ'], nis2: [21.2.η], iso: [A.8.24], gdpr: [32.1.α]}
- id: D2
  domain: data
  lvl: 1
  types: [cloud, msp, software]
  if: hosting
  key: 1
  text: Σε ποιες χώρες αποθηκεύονται και από ποιες χώρες υποστηρίζονται τα δεδομένα μας; Γίνεται διαβίβαση εκτός Ευρωπαϊκού Οικονομικού Χώρου (ΕΟΧ);
  evidence: Τοποθεσίες των data centers και, αν υπάρχει διαβίβαση, ο μηχανισμός (π.χ. τυποποιημένες συμβατικές ρήτρες).
  map: {iso: [A.5.23, A.5.34], gdpr: ['44', 46.2.γ]}
- id: D3
  domain: data
  lvl: 2
  types: [cloud]
  text: Διαχωρίζονται λογικά τα δεδομένα μας από τα δεδομένα των άλλων πελατών σας;
  evidence: Περιγραφή της αρχιτεκτονικής (tenant isolation).
  map: {iso: [A.5.23, A.8.3]}
- id: D4
  domain: data
  lvl: 1
  types: all
  if: personal
  key: 1
  text: Θα επεξεργάζεστε προσωπικά δεδομένα για λογαριασμό μας; Αν ναι, υπογράφετε σύμβαση επεξεργασίας (DPA) κατά το άρθρο 28 του GDPR;
  evidence: Το DPA σας ή αποδοχή του δικού μας.
  map: {iso: [A.5.34], gdpr: ['28.1', '28.3']}
- id: D5
  domain: data
  lvl: 2
  types: all
  if: personal
  text: Ποια τεχνικά και οργανωτικά μέτρα εφαρμόζετε για τα προσωπικά δεδομένα που επεξεργάζεστε για εμάς;
  evidence: Κατάλογος μέτρων (TOMs), π.χ. το παράρτημα του DPA.
  map: {iso: [A.5.34], gdpr: ['28.1', 32.1.β]}
- id: D6
  domain: data
  lvl: 1
  types: all
  if: personal
  key: 2
  text: Θα μας ενημερώνετε χωρίς αδικαιολόγητη καθυστέρηση για κάθε παραβίαση που αφορά τα προσωπικά δεδομένα που επεξεργάζεστε για εμάς;
  evidence: Ρήτρα του DPA με τον μέγιστο χρόνο ενημέρωσης.
  map: {iso: [A.5.24], gdpr: ['33.2']}
- id: D7
  domain: data
  lvl: 1
  types: [physical]
  text: Πώς διασφαλίζετε ότι το προσωπικό σας δεν αφαιρεί, φωτογραφίζει ή αντιγράφει έγγραφα, μέσα αποθήκευσης ή εξοπλισμό από τους χώρους μας;
  evidence: Κανόνες συμπεριφοράς του προσωπικού και πώς ελέγχονται.
  map: {kya: ['23.α'], iso: [A.7.7, A.7.10]}
- id: D8
  domain: data
  lvl: 2
  types: [physical]
  text: Αν η υπηρεσία σας περιλαμβάνει μεταφορά ή καταστροφή εγγράφων ή μέσων αποθήκευσης, πώς γίνεται και τι πιστοποιητικό καταστροφής εκδίδετε;
  evidence: Διαδικασία και υπόδειγμα πιστοποιητικού καταστροφής.
  map: {iso: [A.7.10, A.7.14, A.8.10], gdpr: [32.1.β]}

# Ασφάλεια προϊόντος και ανάπτυξης
- id: S1
  domain: dev
  lvl: 2
  types: [software, cloud]
  key: 3
  text: Ακολουθείτε τεκμηριωμένη διαδικασία ασφαλούς ανάπτυξης (π.χ. NIST SSDF, OWASP SAMM, Microsoft SDL), με έλεγχο κώδικα και δοκιμές ασφάλειας πριν από κάθε έκδοση;
  evidence: Περιγραφή της διαδικασίας και των εργαλείων ελέγχου.
  map: {kya: ['15.β', '15.δ'], nis2: [21.2.ε, '21.3'], iso: [A.8.25, A.8.29]}
- id: S2
  domain: dev
  lvl: 2
  types: [software, cloud]
  text: Χωρίζονται τα περιβάλλοντα ανάπτυξης, δοκιμών και παραγωγής; Χρησιμοποιούνται πραγματικά δεδομένα μας στις δοκιμές;
  evidence: Περιγραφή των περιβαλλόντων και της πολιτικής για δεδομένα δοκιμών.
  map: {kya: ['15.γ'], nis2: [21.2.ε], iso: [A.8.31, A.8.33]}
- id: S3
  domain: dev
  lvl: 3
  types: [software, ot]
  text: Μπορείτε να μας δώσετε κατάλογο των εξαρτημάτων του λογισμικού (SBOM); Πώς παρακολουθείτε τις ευπάθειες των βιβλιοθηκών τρίτων που χρησιμοποιείτε;
  evidence: SBOM (π.χ. SPDX ή CycloneDX) και διαδικασία παρακολούθησης.
  map: {kya: ['17.β'], nis2: [21.2.ε, '21.3'], iso: [A.5.21, A.8.28]}
- id: S4
  domain: dev
  lvl: 1
  types: [software, ot]
  key: 1
  text: Παραδίδεται το προϊόν με ασφαλείς προεπιλεγμένες ρυθμίσεις, χωρίς προεπιλεγμένα ή ενσωματωμένα συνθηματικά (hardcoded credentials);
  evidence: Οδηγός ασφαλούς εγκατάστασης (hardening guide).
  map: {kya: ['14.β', '14.γ'], nis2: [21.2.ε], iso: [A.8.9]}
- id: S5
  domain: dev
  lvl: 2
  types: [software, ot]
  text: Υπογράφονται ψηφιακά οι ενημερώσεις και τα αρχεία εγκατάστασης, ώστε να μπορούμε να επαληθεύσουμε την προέλευση και την ακεραιότητά τους;
  evidence: Τρόπος επαλήθευσης (υπογραφή, hash).
  map: {kya: ['17.δ'], nis2: [21.2.ε], iso: [A.8.19]}
- id: S6
  domain: dev
  lvl: 2
  types: [software, cloud, ot]
  text: Για πόσο χρόνο υποστηρίζεται με ενημερώσεις ασφάλειας η έκδοση που μας παρέχετε; Μας ενημερώνετε εγκαίρως για το τέλος της υποστήριξης (end of life);
  evidence: Πολιτική κύκλου ζωής του προϊόντος.
  map: {kya: ['17.γ'], nis2: [21.2.ε], iso: [A.5.21]}
- id: S7
  domain: dev
  lvl: 3
  types: [software]
  text: Αν αναπτύσσετε λογισμικό κατά παραγγελία μας, σε ποιον ανήκει ο πηγαίος κώδικας, και υπάρχει συμφωνία διασφάλισης (escrow) για την περίπτωση που σταματήσετε την υποστήριξη;
  evidence: Σχετικοί όροι της σύμβασης.
  map: {kya: ['15.α'], nis2: [21.2.ε], iso: [A.8.30]}
- id: S8
  domain: dev
  lvl: 2
  types: [cloud]
  text: Ποια εργαλεία ασφάλειας δίνει η υπηρεσία στους διαχειριστές μας (αρχεία καταγραφής ελέγχου, ρόλοι πρόσβασης, ειδοποιήσεις); Μπορούμε να στέλνουμε τις καταγραφές στο δικό μας SIEM, π.χ. στο Microsoft Sentinel;
  evidence: Τεκμηρίωση των audit logs και του τρόπου εξαγωγής τους (API, connector).
  map: {kya: ['24.γ', '24.ε'], nis2: [21.2.β], iso: [A.8.15]}

# Ευπάθειες και ενημερώσεις
- id: V1
  domain: vuln
  lvl: 1
  types: [msp, cloud, software, ot]
  key: 1
  text: Εγκαθιστάτε τις ενημερώσεις ασφάλειας, στα συστήματα που διαχειρίζεστε για εμάς ή στην υπηρεσία σας, μέσα σε συγκεκριμένους χρόνους ανάλογα με τη σοβαρότητα; Ποιοι είναι αυτοί οι χρόνοι;
  evidence: Πολιτική διαχείρισης ενημερώσεων με χρόνους ανά σοβαρότητα.
  map: {kya: ['17.γ', '17.στ'], nis2: [21.2.ε], iso: [A.8.8]}
- id: V2
  domain: vuln
  lvl: 2
  types: [software, cloud, ot]
  text: Έχετε διαδικασία μέσω της οποίας τρίτοι σας αναφέρουν ευπάθειες (vulnerability disclosure policy); Μας ενημερώνετε για ευπάθειες που επηρεάζουν όσα μας παρέχετε;
  evidence: Link στην πολιτική και κανάλι ενημέρωσης πελατών (π.χ. security advisories).
  map: {kya: ['17.β', '17.ζ'], nis2: [21.2.ε], iso: [A.8.8]}
- id: V3
  domain: vuln
  lvl: 2
  types: [msp, cloud]
  text: Κάνετε τακτικές σαρώσεις ευπαθειών στις δικές σας υποδομές που χρησιμοποιούνται για την υπηρεσία μας;
  evidence: Συχνότητα και εργαλείο σάρωσης.
  map: {kya: ['17.ε'], nis2: [21.2.ε], iso: [A.8.8]}
- id: V4
  domain: vuln
  lvl: 2
  types: [ot]
  text: Ελέγχετε ότι οι ενημερώσεις firmware και λογισμικού είναι εγκεκριμένες από τον κατασκευαστή του συστήματος OT, και τις δοκιμάζετε πριν από την εγκατάσταση στην παραγωγή μας;
  evidence: Διαδικασία ελέγχου και δοκιμής ενημερώσεων.
  map: {kya: ['17.δ'], nis2: [21.2.ε], iso: [A.8.32]}
- id: V5
  domain: vuln
  lvl: 2
  types: [msp]
  text: Προστατεύονται τα συστήματα που διαχειρίζεστε για εμάς με λύση προστασίας από κακόβουλο λογισμικό (EDR), την οποία παρακολουθεί κάποιος ενεργά;
  evidence: Λύση EDR και ποιος απαντά στις ειδοποιήσεις.
  map: {kya: ['20.α'], nis2: [21.2.ζ], iso: [A.8.7]}

# OT
- id: O1
  domain: ot
  lvl: 1
  types: [ot]
  text: Ακολουθείτε κάποιο πρότυπο για την ασφάλεια των συστημάτων OT, όπως το IEC 62443; Είστε πιστοποιημένοι, π.χ. κατά IEC 62443-2-4 για παρόχους υπηρεσιών;
  evidence: Πιστοποιητικό ή περιγραφή της πρακτικής σας.
  map: {kya: [12.1.γ], nis2: ['21.3'], iso: [A.5.19]}
- id: O2
  domain: ot
  lvl: 2
  types: [ot]
  key: 2
  text: Σέβονται οι λύσεις σας τον διαχωρισμό IT και OT (ζώνες και αγωγοί), χωρίς απευθείας συνδέσεις από το διαδίκτυο ή από το δίκτυο γραφείου προς τα PLC;
  evidence: Αρχιτεκτονικό διάγραμμα της λύσης.
  map: {kya: ['19.ε', '19.στ'], nis2: [21.2.ε], iso: [A.8.22]}
- id: O3
  domain: ot
  lvl: 1
  types: [ot]
  key: 1
  text: Εγκαθιστάτε ή αφήνετε μόνιμα modem, 4G router ή άλλες συσκευές απομακρυσμένης πρόσβασης στις εγκαταστάσεις μας;
  evidence: Κατάλογος τέτοιων συσκευών, αν υπάρχουν, και πώς απενεργοποιούνται.
  map: {kya: ['19.δ', '19.ζ'], nis2: [21.2.ι], iso: [A.8.20]}
- id: O4
  domain: ot
  lvl: 3
  types: [ot]
  text: 'Μας παραδίδετε ενημερωμένη τεκμηρίωση, δηλαδή δικτυακά διαγράμματα, κατάλογο συσκευών με εκδόσεις firmware, θύρες και πρωτόκολλα που χρησιμοποιούνται;'
  evidence: Υπόδειγμα της τεκμηρίωσης που παραδίδετε.
  map: {kya: ['11.α'], nis2: [21.2.θ], iso: [A.5.9]}
- id: O5
  domain: ot
  lvl: 1
  types: [ot]
  text: Αλλάζετε τα προεπιλεγμένα συνθηματικά των PLC, των HMI και των δικτυακών συσκευών, και μας παραδίδετε τα διαπιστευτήρια με ασφαλή τρόπο;
  evidence: Διαδικασία παράδοσης διαπιστευτηρίων.
  map: {kya: ['14.γ'], nis2: [21.2.θ], iso: [A.5.17]}
- id: O6
  domain: ot
  lvl: 1
  types: [ot]
  key: 2
  text: Συνδέουν οι τεχνικοί σας φορητούς υπολογιστές ή USB στο δίκτυο OT ή στα PLC μας; Αν ναι, πώς ελέγχονται για κακόβουλο λογισμικό πριν από τη σύνδεση;
  evidence: Διαδικασία ελέγχου εξοπλισμού συντήρησης.
  map: {kya: ['11.δ', '20.α'], nis2: [21.2.ζ], iso: [A.7.10, A.8.7]}
- id: O7
  domain: ot
  lvl: 2
  types: [ot]
  text: Ακολουθούν οι τεχνικοί σας τη διαδικασία μας για εργασίες στην παραγωγή (άδεια εργασίας, ενημέρωση της βάρδιας, καταγραφή των αλλαγών);
  evidence: Αποδοχή της διαδικασίας.
  map: {kya: ['16.α'], nis2: [21.2.ε], iso: [A.8.32, A.7.6]}

# Φυσική ασφάλεια
- id: P1
  domain: phys
  lvl: 1
  types: [physical]
  key: 1
  text: Ακολουθεί το προσωπικό σας τους κανόνες πρόσβασης των χώρων μας (καταγραφή εισόδου, συνοδεία σε ζώνες περιορισμένης πρόσβασης, επιστροφή κλειδιών και καρτών);
  evidence: Αποδοχή των κανόνων.
  map: {kya: ['23.γ'], iso: [A.7.2, A.7.3]}
- id: P2
  domain: phys
  lvl: 2
  types: [physical]
  text: Πώς φυλάσσονται και επιστρέφονται τα κλειδιά, οι κάρτες ή οι κωδικοί συναγερμού που σας δίνουμε; Τι κάνετε αν χαθούν;
  evidence: Διαδικασία διαχείρισης κλειδιών.
  map: {kya: ['23.β'], iso: [A.7.2, A.5.11]}
- id: P3
  domain: phys
  lvl: 2
  types: [physical]
  text: Μπαίνει το προσωπικό σας σε αίθουσες server, ηλεκτρικούς πίνακες ή χώρους με συστήματα παραγωγής; Αν ναι, με συνοδεία και καταγραφή;
  evidence: Περιγραφή των εργασιών σε τέτοιους χώρους.
  map: {kya: ['23.γ'], iso: [A.7.6]}
- id: P4
  domain: phys
  lvl: 3
  types: [physical]
  text: Αν συντηρείτε εγκαταστάσεις (ηλεκτρολογικά, κλιματισμό, UPS), πώς διασφαλίζετε ότι μια εργασία σας δεν θα διακόψει κρίσιμα συστήματά μας χωρίς προηγούμενη ειδοποίηση;
  evidence: Διαδικασία προγραμματισμού και ειδοποίησης.
  map: {kya: ['23.ε'], iso: [A.7.11, A.7.13]}

# Περιστατικά
- id: I1
  domain: inc
  lvl: 1
  types: all
  key: 1
  text: Θα μας ενημερώνετε χωρίς αδικαιολόγητη καθυστέρηση για κάθε περιστατικό ασφάλειας που μπορεί να επηρεάσει τα συστήματα, τα δεδομένα ή τις υπηρεσίες μας; Σε πόσες ώρες το πολύ, και από ποιο κανάλι;
  evidence: Ρήτρα της σύμβασης ή διαδικασία, με μέγιστο χρόνο και κανάλι ενημέρωσης.
  map: {kya: [12.1.δ, '24.α'], nis2: [21.2.β, 21.2.δ], iso: [A.5.20, A.5.24]}
- id: I2
  domain: inc
  lvl: 2
  types: [msp, cloud, ot, software]
  text: Διαθέτετε γραπτό σχέδιο απόκρισης σε περιστατικά και ομάδα ή εξωτερικό συνεργάτη που το εφαρμόζει;
  evidence: Περίληψη του σχεδίου.
  map: {kya: ['24.α', '24.β'], nis2: [21.2.β], iso: [A.5.24, A.5.26]}
- id: I3
  domain: inc
  lvl: 3
  types: [msp, cloud, ot, software]
  key: 3
  text: Θα συνεργαστείτε στη διερεύνηση περιστατικού που μας αφορά, δίνοντας καταγραφές και στοιχεία, ώστε να το αναφέρουμε στην Εθνική Αρχή Κυβερνοασφάλειας μέσα στις προθεσμίες;
  evidence: Δέσμευση στη σύμβαση.
  map: {kya: ['24.α'], nis2: ['23.1', 21.2.β], iso: [A.5.26, A.5.28]}
- id: I4
  domain: inc
  lvl: 2
  types: all
  text: Είχατε τους τελευταίους 24 μήνες σοβαρό περιστατικό ασφάλειας ή παραβίαση δεδομένων; Αν ναι, τι αλλάξατε μετά;
  evidence: Σύντομη περιγραφή και διορθωτικές ενέργειες.
  map: {nis2: ['21.3'], iso: [A.5.27]}
- id: I5
  domain: inc
  lvl: 1
  types: [physical]
  text: Πώς ενημερώνει αμέσως το προσωπικό σας για κάτι ύποπτο που βλέπει στους χώρους μας, π.χ. ανοικτή πόρτα, άγνωστο άτομο ή συσκευή που λείπει;
  evidence: Οδηγίες προς το προσωπικό και σημείο επαφής.
  map: {kya: ['23.β'], iso: [A.6.8]}

# Επιχειρησιακή συνέχεια
- id: B1
  domain: bcp
  lvl: 2
  types: [msp, cloud, software, ot]
  key: 3
  text: Διαθέτετε σχέδιο επιχειρησιακής συνέχειας και ανάκαμψης για την υπηρεσία που μας παρέχετε; Πότε δοκιμάστηκε τελευταία φορά;
  evidence: Περίληψη του σχεδίου και ημερομηνία της τελευταίας δοκιμής.
  map: {kya: ['25.1.α', '25.1.γ'], nis2: [21.2.γ], iso: [A.5.30]}
- id: B2
  domain: bcp
  lvl: 1
  types: [cloud, msp]
  if: hosting
  key: 1
  text: Κρατάτε αντίγραφα ασφαλείας των δεδομένων μας, απομονωμένα ή αμετάβλητα (immutable), και δοκιμάζετε την επαναφορά τους;
  evidence: Συχνότητα, διάρκεια τήρησης και ημερομηνία της τελευταίας δοκιμής επαναφοράς.
  map: {kya: ['25.1.ε', '25.1.ζ'], nis2: [21.2.γ], iso: [A.8.13], gdpr: [32.1.γ]}
- id: B3
  domain: bcp
  lvl: 2
  types: [cloud, msp]
  text: Ποια διαθεσιμότητα εγγυάται η υπηρεσία (SLA), και ποιοι είναι οι στόχοι RTO και RPO;
  evidence: Το SLA.
  map: {kya: ['25.1.β'], nis2: [21.2.γ], iso: [A.5.30]}
- id: B4
  domain: bcp
  lvl: 3
  types: [ot, msp]
  text: Μπορείτε να ανταποκριθείτε, επί τόπου ή απομακρυσμένα, μέσα σε συμφωνημένο χρόνο και όλο το 24ωρο, αν σταματήσει κρίσιμο σύστημα ή η παραγωγή;
  evidence: Χρόνοι απόκρισης ανά προτεραιότητα.
  map: {kya: ['25.1.α'], nis2: [21.2.γ], iso: [A.5.30]}
- id: B5
  domain: bcp
  lvl: 1
  types: [ot]
  key: 2
  text: Κρατάτε ενημερωμένα αντίγραφα των προγραμμάτων των PLC, των ρυθμίσεων SCADA και της τεκμηρίωσης, και μας τα παραδίδετε μετά από κάθε αλλαγή;
  evidence: Πρακτική παράδοσης αντιγράφων.
  map: {kya: ['25.1.ε', '16.α'], nis2: [21.2.γ], iso: [A.8.13, A.8.32]}

# Υπεργολάβοι
- id: U1
  domain: sub
  lvl: 1
  types: all
  if: subcontract
  key: 2
  text: Χρησιμοποιείτε υπεργολάβους για την υπηρεσία που μας παρέχετε; Δώστε κατάλογο με το τι κάνει ο καθένας και πού βρίσκεται.
  evidence: Κατάλογος υπεργολάβων.
  map: {kya: [12.2.β], nis2: [21.2.δ], iso: [A.5.21], gdpr: ['28.2']}
- id: U2
  domain: sub
  lvl: 2
  types: all
  if: subcontract
  text: Επιβάλλετε στους υπεργολάβους σας τις ίδιες απαιτήσεις ασφάλειας με αυτές που αναλαμβάνετε απέναντί μας;
  evidence: Σχετική ρήτρα στις συμβάσεις με τους υπεργολάβους.
  map: {kya: [12.2.β], nis2: [21.2.δ], iso: [A.5.21], gdpr: ['28.2']}
- id: U3
  domain: sub
  lvl: 2
  types: all
  if: subcontract
  text: Θα μας ενημερώνετε εκ των προτέρων για νέο ή διαφορετικό υπεργολάβο, ώστε να μπορούμε να αντιταχθούμε;
  evidence: Δέσμευση στη σύμβαση.
  map: {kya: [12.2.β], iso: [A.5.22], gdpr: ['28.2']}

# Λήξη συνεργασίας
- id: E1
  domain: exit
  lvl: 1
  types: all
  key: 2
  text: Με τη λήξη της συνεργασίας, επιστρέφετε ή διαγράφετε με ασφάλεια όλα τα δεδομένα μας και μας δίνετε γραπτή βεβαίωση;
  evidence: Διαδικασία και υπόδειγμα βεβαίωσης διαγραφής.
  map: {kya: [12.1.δ], nis2: [21.2.δ], iso: [A.5.20, A.8.10], gdpr: ['28.3']}
- id: E2
  domain: exit
  lvl: 1
  types: [msp, ot, software, cloud]
  text: Με τη λήξη, ανακαλείτε όλους τους λογαριασμούς και τις απομακρυσμένες προσβάσεις σας και μας παραδίδετε όλα τα διαπιστευτήρια;
  evidence: Διαδικασία αποχώρησης από τον πελάτη (offboarding).
  map: {kya: [12.1.δ, '13.ε'], iso: [A.5.11, A.5.18]}
- id: E3
  domain: exit
  lvl: 2
  types: [cloud, msp, software]
  text: Μπορούμε να εξάγουμε όλα τα δεδομένα μας σε ανοικτή, αναγνώσιμη μορφή πριν από τη λήξη, χωρίς επιπλέον χρέωση;
  evidence: Μορφές εξαγωγής και διαδικασία.
  map: {kya: [12.1.δ], iso: [A.5.23]}
- id: E4
  domain: exit
  lvl: 2
  types: [msp, ot]
  text: Θα μας υποστηρίξετε στη μετάβαση σε νέο προμηθευτή (τεκμηρίωση, ρυθμίσεις, μεταφορά γνώσης) για συμφωνημένο διάστημα;
  evidence: Όροι υποστήριξης μετάβασης.
  map: {kya: [12.1.δ], iso: [A.5.22]}

# Checklist συμβατικών όρων για την οντότητα
terms:
- id: T1
  name: Απαιτήσεις κυβερνοασφάλειας
  text: Η σύμβαση ορίζει τις απαιτήσεις κυβερνοασφάλειας που τηρεί ο προμηθευτής, π.χ. ως παράρτημα με τα μέτρα αυτού του ερωτηματολογίου.
  src: Κανονισμός 2024/2690, 5.1.4 (α)
  show: 1
  need: 1
  types: all
  map: {kya: [12.1.δ], nis2: [21.2.δ], iso: [A.5.20]}
- id: T2
  name: Συστήματα, δεδομένα και χώροι
  text: Καταγράφει σε ποια συστήματα, δεδομένα και χώρους αποκτά πρόσβαση ο προμηθευτής, και με ποιον ρόλο.
  src: ΚΥΑ 1689/2025, 12.1.δ
  show: 1
  need: 1
  types: all
  map: {kya: [12.1.δ], iso: [A.5.20]}
- id: T3
  name: Γνωστοποίηση περιστατικών
  text: Υποχρέωση ενημέρωσης χωρίς αδικαιολόγητη καθυστέρηση για κάθε περιστατικό που επηρεάζει την ασφάλεια των συστημάτων ή των δεδομένων σου, με μέγιστο χρόνο, κανάλι και σημείο επαφής. Αν το περιστατικό είναι σημαντικό, η δική σου έγκαιρη προειδοποίηση προς την ΕΑΚ λήγει 24 ώρες αφού το αντιληφθείς, οπότε ζήτα χρόνο που σου αφήνει περιθώριο.
  src: Κανονισμός 2024/2690, 5.1.4 (δ)
  show: 1
  need: 1
