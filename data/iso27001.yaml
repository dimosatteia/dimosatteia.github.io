# Αντιστοίχιση ISO/IEC 27001:2022 Annex A (93 controls) -> Microsoft -> ΚΥΑ 1689/2025 -> άρθρα thecybersec.gr
# Παράγεται από script. Η σελίδα /iso-27001/ διαβάζει αυτό το αρχείο. requirement: επίσημος τίτλος του Table A.1. desc: δική μας περιγραφή.
source:
  act: ISO/IEC 27001:2022
  title: Information security management systems — Requirements
  fek: Annex A, Table A.1
  url: https://www.iso.org/standard/27001
  of: του Annex A
  items: controls
  item: control
  groups: ενότητες
  disclaimer: Η αντιστοίχιση είναι επαγγελματική ερμηνεία. Μια ρύθμιση υποστηρίζει ένα control, δεν αποδεικνύει από μόνη της συμμόρφωση. Οι τίτλοι είναι οι επίσημοι του προτύπου και οι περιγραφές είναι δικές μας· το κείμενο των controls δεν αναπαράγεται. Για τη διατύπωση κάθε control ισχύει το [ISO/IEC 27001:2022](https://www.iso.org/standard/27001).
updated: '2026-10-02'
types:
- key: tech
  label: Τεχνικό
  hint: Υλοποιείται κυρίως με ρύθμιση
- key: mixed
  label: Μικτό
  hint: Έγγραφο ή διαδικασία, με τεχνική επιβολή ή τεκμήριο από τη Microsoft
- key: org
  label: Οργανωτικό ή εκτός Microsoft 365
  hint: Δεν υπάρχει ρύθμιση που να το καλύπτει
