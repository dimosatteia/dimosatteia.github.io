# Εργαλείο «Μητρώο υποχρεωτικών πολιτικών της ΚΥΑ 1689/2025» (/mitroo-politikon/).
# Το shortcode policy-register διαβάζει αυτό το αρχείο. Όλος ο υπολογισμός γίνεται στον browser.
#
# Πεδία ανά έγγραφο:
#   id:       κωδικός εγγράφου στο μητρώο (σταθερός: με αυτόν διαβάζεται πίσω ένα .xlsx που κατέβηκε παλιότερα)
#   group:    κλειδί από το groups. Η ομάδα με core: true είναι ο πυρήνας (άρθρο 6), οι άλλες η λοιπή τεκμηρίωση.
#   kind:     policy | procedure | plan | register | decision | scheme
#   title:    τίτλος του εγγράφου
#   kya:      η διάταξη της ΚΥΑ που το ζητά (κείμενο)
#   board:    true όταν η ΚΥΑ ζητά ρητά έγκριση ή αξιολόγηση από το ανώτατο όργανο διοίκησης (άρθρα 4 περ. βα, 6 περ. α και β, 7 περ. γ)
#   scope:    all = βασικές και σημαντικές, essential = μόνο βασικές
#   priority: critical | high | medium, όταν το έγγραφο λείπει. Ένα σχέδιο πέφτει μία βαθμίδα.
#   cycle:    μήνες ανάμεσα σε δύο αναθεωρήσεις. Η ΚΥΑ λέει «σε προγραμματισμένα χρονικά διαστήματα»: οι 12 μήνες είναι η συνήθης πρακτική, όχι κείμενο της ΚΥΑ.
#   what:     τι πρέπει να περιέχει, με βάση την ΚΥΑ (δική μας σύντομη απόδοση)
#   evidence: τι θα ζητήσει ο ελεγκτής (άρθρο 3 παρ. 3 περ. α: πολιτικές, πρακτικά ΔΣ, συμβάσεις, αναφορές ελέγχων)
#   map:      κωδικοί ακριβώς όπως στα data/nis2.yaml (kya), data/nis2directive.yaml (nis2), data/iso27001.yaml (iso), data/gdpr.yaml (gdpr)
#   clause:   ρήτρα του ISO/IEC 27001 (4 έως 10), όταν το έγγραφο το ζητά το κυρίως σώμα του προτύπου και όχι το Annex A. Κείμενο, χωρίς σύνδεσμο.
#   tool:     προαιρετικά, εσωτερικό εργαλείο {url, label}
#   mitre:    προαιρετικά, MITRE ATT&CK mitigations (M) που διέπει η πολιτική, ή techniques (T) από τις οποίες προστατεύει. Τα IDs πρέπει να υπάρχουν στο data/mitre.yaml.

updated: 2026-10-29

statuses:
  - { key: approved, label: "Εγκεκριμένο", hint: "Υπάρχει, είναι εγκεκριμένο και σε ισχύ" }
  - { key: draft,    label: "Σε σχέδιο",   hint: "Γράφεται ή περιμένει έγκριση" }
  - { key: none,     label: "Δεν υπάρχει", hint: "" }
  - { key: unknown,  label: "Δεν ξέρω",    hint: "Μετράει ως κενό" }

kinds:
  policy: Πολιτική
  procedure: Διαδικασία
  plan: Πλάνο
  register: Μητρώο
  decision: Απόφαση
  scheme: Σχήμα

roles: [ΥΑΣΠΕ, CISO, CIO, CTO, CEO, CFO, COO, DPO, HR, Legal, IT, Facilities]

groups:
  # core: true = τα έγγραφα που η ΚΥΑ απαριθμεί ρητά (άρθρο 6). Μετρούν στην κύρια κάλυψη.
  # Οι υπόλοιπες ομάδες είναι η λοιπή τεκμηρίωση των άρθρων 4 έως 25: υποχρεώσεις της ΚΥΑ που δεν διατυπώνονται ως λίστα εγγράφων.
  - key: art6
    core: true
    name: Οι 12 πολιτικές του άρθρου 6
    hint: Άρθρο 6 περ. α και β. Η γενική πολιτική και οι 11 ελάχιστες θεματικές. Είναι τα μόνα έγγραφα που η ΚΥΑ απαριθμεί ρητά, και όλα εγκρίνονται από το ανώτατο όργανο διοίκησης.
  - key: gov
    name: Διακυβέρνηση και ρόλοι
    hint: Άρθρα 4, 7, 8 και 9. Το πρόγραμμα, ο ΥΑΣΠΕ και η παρακολούθηση της συμμόρφωσης. Ο ελεγκτής τα ζητά μαζί με τη γενική πολιτική.
  - key: risk
    name: Διαχείριση κινδύνων
    hint: Άρθρο 5. Όλα τα υπόλοιπα στηρίζονται στην εκτίμηση κινδύνων.
  - key: proc
    name: Διαδικασίες που συνοδεύουν τις πολιτικές
    hint: Άρθρα 10 έως 24. Όπου η ΚΥΑ ζητά «πολιτική και διαδικασίες», η διαδικασία είναι χωριστό τεκμήριο. Μπορεί να είναι ενότητα της πολιτικής, αρκεί να φαίνεται.
  - key: cont
    name: Επιχειρησιακή συνέχεια
    hint: Άρθρο 25. Το πλάνο, η BIA στην οποία βασίζεται, τα αντίγραφα ασφαλείας και, για τις βασικές, η διαχείριση κρίσεων.
  - key: reg
    name: Μητρώα και τεκμήρια
    hint: Οι κατάλογοι, το σχήμα ταξινόμησης και οι καταγραφές που ζητά η ΚΥΑ.

items:

  # ---------- Οι 12 πολιτικές του άρθρου 6 (πυρήνας) ----------
  - id: POL-00
    group: art6
    kind: policy
    title: Γενική πολιτική ασφάλειας πληροφοριών
    kya: Άρθρο 6 περ. α και γ
    board: true
    scope: all
    priority: critical
    cycle: 12
    what: Γραπτή γενική πολιτική με τους στόχους και τη δέσμευση της διοίκησης για την ασφάλεια των συστημάτων δικτύου και πληροφοριών. Αξιολογείται σε προγραμματισμένα διαστήματα και μετά από σοβαρό περιστατικό ή σημαντική αλλαγή.
    evidence: Η υπογεγραμμένη πολιτική με έκδοση και ημερομηνία, και το πρακτικό ή η απόφαση του ανώτατου οργάνου διοίκησης που την εγκρίνει.
    map:
      kya: ["6.α", "6.γ"]
      nis2: ["21.2.α", "20.1"]
      iso: ["A.5.1"]
      gdpr: ["24.1"]
    clause: Ρήτρα 5.2

  - id: POL-01
    group: art6
    kind: policy
    title: Πολιτική ελέγχου πρόσβασης
    kya: Άρθρο 6 περ. βα · άρθρο 13
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Λογικός έλεγχος πρόσβασης για προσωπικό και τρίτους, μοναδική ταυτότητα, least privilege, περιορισμός των προνομιούχων λογαριασμών, προσαρμογή όταν αλλάζει η απασχόληση, MFA ανάλογα με την κρισιμότητα.
    evidence: Η πολιτική εγκεκριμένη από το ΔΣ και η τελευταία αναθεώρηση δικαιωμάτων πρόσβασης.
    map:
      kya: ["13.α", "13.η"]
      nis2: ["21.2.θ", "21.2.ι"]
      iso: ["A.5.15", "A.5.18", "A.8.2"]
      gdpr: ["32.4", "5.1.στ"]
    mitre: ["M1032", "M1026", "M1018"]

  - id: POL-02
    group: art6
    kind: policy
    title: Πολιτική διαχείρισης αγαθών
    kya: Άρθρο 6 περ. ββ · άρθρο 11 περ. α και β
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Πώς τηρείται ο κατάλογος αγαθών (υλικό, λογισμικό, δεδομένα, υπηρεσίες, cloud και OT), ποιος είναι ιδιοκτήτης κάθε αγαθού και πώς ταξινομούνται με βάση εμπιστευτικότητα, ακεραιότητα και διαθεσιμότητα.
    evidence: Η πολιτική, το σχήμα ταξινόμησης και ο κατάλογος αγαθών.
    map:
      kya: ["11.α", "11.β"]
      nis2: ["21.2.θ"]
      iso: ["A.5.9", "A.5.12"]
      gdpr: ["30.1"]

  - id: POL-03
    group: art6
    kind: policy
    title: Πολιτική ορθής χρήσης αγαθών και δεδομένων
    kya: Άρθρο 6 περ. βγ · άρθρο 11 περ. γ
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Γραπτοί κανόνες και οδηγίες για τη χρήση των αγαθών και των δεδομένων σε όλο τον κύκλο ζωής τους, που τους γνωρίζει και τους αποδέχεται το προσωπικό.
    evidence: Η πολιτική και η αποδοχή της από το προσωπικό (υπογραφή ή καταγραφή ηλεκτρονικής αποδοχής).
    map:
      kya: ["11.γ"]
      nis2: ["21.2.θ"]
      iso: ["A.5.10"]
      gdpr: ["32.4"]
    mitre: ["M1017"]

  - id: POL-04
    group: art6
    kind: policy
    title: Πολιτική αφαιρούμενων μέσων αποθήκευσης
    kya: Άρθρο 6 περ. βδ · άρθρο 11 περ. δ
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Πότε επιτρέπονται τα αφαιρούμενα μέσα, με ποια προστασία (κρυπτογράφηση, έλεγχος για malware) και πώς καταστρέφονται.
    evidence: Η πολιτική και το τεχνικό τεκμήριο της επιβολής της (π.χ. ρύθμιση device control).
    map:
      kya: ["11.δ", "22.β"]
      nis2: ["21.2.θ"]
      iso: ["A.7.10"]
      gdpr: ["32.1.β"]
    mitre: ["M1034"]

  - id: POL-05
    group: art6
    kind: policy
    title: Πολιτική διαχείρισης περιστατικών κυβερνοασφάλειας
    kya: Άρθρο 6 περ. βε · άρθρο 24
    board: true
    scope: all
    priority: critical
    cycle: 12
    what: Ρόλοι, διαδικασίες αναφοράς στις αρχές και πλάνο ανίχνευσης, ανάλυσης, απόκρισης και ανάκαμψης, με τουλάχιστον έναν υπάλληλο που συντονίζει ή επιβλέπει την απόκριση.
    evidence: Η πολιτική, το πλάνο απόκρισης και τα αρχεία των περιστατικών και των ασκήσεων. Ο ορισμός του συντονιστή είναι το PRC-16.
    map:
      kya: ["24.α", "24.β", "24.στ"]
      nis2: ["21.2.β", "23.1"]
      iso: ["A.5.24", "A.5.25", "A.5.26"]
      gdpr: ["33.1", "33.5"]

  - id: POL-06
    group: art6
    kind: policy
    title: Πολιτική ασφάλειας εφοδιαστικής αλυσίδας
    kya: Άρθρο 6 περ. βστ · άρθρο 12
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Πώς επιλέγονται, αξιολογούνται και παρακολουθούνται οι προμηθευτές και οι πάροχοι υπηρεσιών Τ.Π.Ε. σε όλο τον κύκλο ζωής τους, και τι ορίζουν υποχρεωτικά οι συμβάσεις.
    evidence: Η πολιτική, ο κατάλογος προμηθευτών με κρισιμότητα, οι αξιολογήσεις και οι όροι ασφάλειας στις συμβάσεις.
    map:
      kya: ["12.1.α", "12.1.γ", "12.1.ε"]
      nis2: ["21.2.δ", "21.3"]
      iso: ["A.5.19", "A.5.20"]
      gdpr: ["28.1"]
    mitre: ["T1195", "T1199"]
    tool: { url: /axiologisi-promitheyti/, label: "Αξιολόγηση προμηθευτή" }

  - id: POL-07
    group: art6
    kind: policy
    title: Πολιτική ασφάλειας δικτύων
    kya: Άρθρο 6 περ. βζ · άρθρο 19
    board: true
    scope: all
    priority: high
    cycle: 12
    what: "Προστασία δικτύων και δικτυακών συσκευών: firewalls, έλεγχος συσκευών που συνδέονται, segmentation και φιλτράρισμα μεταξύ ζωνών, ασφαλής απομακρυσμένη πρόσβαση και για προμηθευτές, DNS και διαθεσιμότητα των κρίσιμων υπηρεσιών."
    evidence: Η πολιτική, το διάγραμμα δικτύου με τις ζώνες και η τελευταία αναθεώρηση των κανόνων firewall.
    map:
      kya: ["19.α", "19.ια"]
      nis2: ["21.2.α", "21.2.ε"]
      iso: ["A.8.20", "A.8.21", "A.8.22"]
      gdpr: ["32.1.β"]
    mitre: ["M1030", "M1037", "M1035"]

  - id: POL-08
    group: art6
    kind: policy
    title: Πολιτική διενέργειας ελέγχων κυβερνοασφάλειας
    kya: Άρθρο 6 περ. βη · άρθρο 18
    board: true
    scope: all
    priority: high
    cycle: 12
    what: "Πεδίο, συχνότητα και είδος των ελέγχων: εξωτερικά penetration tests τουλάχιστον μία φορά ετησίως, αποκατάσταση και επικύρωση των ευρημάτων, και η ετήσια αυτοαξιολόγηση με τον οδηγό της ΕΑΚ."
    evidence: Η πολιτική, η τελευταία έκθεση penetration test και το πλάνο αποκατάστασης των ευρημάτων.
    map:
      kya: ["18.1.α", "18.1.β", "18.1.γ"]
      nis2: ["21.2.στ"]
      iso: ["A.5.35", "A.5.36"]
      gdpr: ["32.1.δ"]
    mitre: ["M1016"]

  - id: POL-09
    group: art6
    kind: policy
    title: Πολιτική αντιγράφων ασφαλείας
    kya: Άρθρο 6 περ. βθ · άρθρο 25 παρ. 1 περ. δ έως ζ
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Τι, πόσο συχνά και πού κρατιέται ως αντίγραφο, ανάλογα με την κρισιμότητα, ποιος έχει φυσική και λογική πρόσβαση στα αντίγραφα και πώς δοκιμάζεται περιοδικά η επαναφορά.
    evidence: Η πολιτική και η τελευταία καταγεγραμμένη δοκιμή επαναφοράς.
    map:
      kya: ["25.1.δ", "25.1.ε", "25.1.ζ"]
      nis2: ["21.2.γ"]
      iso: ["A.8.13"]
      gdpr: ["32.1.γ"]
    mitre: ["M1053"]

  - id: POL-10
    group: art6
    kind: policy
    title: Πολιτική κρυπτογράφησης δεδομένων και επικοινωνιών
    kya: Άρθρο 6 περ. βι · άρθρο 22
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Κρυπτογράφηση των δεδομένων αυξημένης κρισιμότητας σε αποθήκευση και κατά τη μεταφορά, σύμφωνα με το σχήμα ταξινόμησης, με επιτρεπόμενους αλγορίθμους και πρωτόκολλα και διαχείριση κλειδιών και πιστοποιητικών.
    evidence: Η πολιτική και τα τεχνικά τεκμήρια (π.χ. αναφορά κρυπτογράφησης δίσκων, κατάλογος πιστοποιητικών με λήξεις).
    map:
      kya: ["22.α", "22.δ", "22.ε"]
      nis2: ["21.2.η"]
      iso: ["A.8.24"]
      gdpr: ["32.1.α"]
    mitre: ["M1041"]

  - id: POL-11
    group: art6
    kind: policy
    title: Πολιτική φυσικής και περιβαλλοντικής ασφάλειας
    kya: Άρθρο 6 περ. βια · άρθρο 23
    board: true
    scope: all
    priority: high
    cycle: 12
    what: Φυσικός έλεγχος πρόσβασης στην περίμετρο και στους χώρους των κρίσιμων συστημάτων με ταυτοποίηση και καταγραφή, προστασία από φωτιά, πλημμύρα και εγκληματική δραστηριότητα, και επίβλεψη ρεύματος, νερού, εξαερισμού και κλιματισμού.
    evidence: Η πολιτική, η λίστα εξουσιοδοτημένων για τους κρίσιμους χώρους και τα αρχεία εισόδου.
    map:
      kya: ["23.α", "23.γ", "23.στ"]
      nis2: ["21.1"]
      iso: ["A.7.1", "A.7.2", "A.7.5", "A.7.11"]
      gdpr: ["32.1.β"]

  # ---------- Λοιπή τεκμηρίωση · Διακυβέρνηση και ρόλοι (άρθρα 4, 7, 8 και 9) ----------
  - id: GOV-01
    group: gov
    kind: decision
    title: Πρόγραμμα διαχείρισης κινδύνων κυβερνοασφάλειας και απόφαση έγκρισής του
    kya: Άρθρο 4 περ. α και β (βα έως βε)
    board: true
    scope: all
    priority: critical
    cycle: 12
    what: Το ολοκληρωμένο πρόγραμμα με τα μέτρα της ΚΥΑ, εγκεκριμένο από το ανώτατο όργανο διοίκησης, με πόρους, επίβλεψη της υλοποίησης, ενημέρωση του προσωπικού και εκπαίδευση των μελών της διοίκησης.
    evidence: Πρακτικό ΔΣ με την έγκριση του προγράμματος και του προϋπολογισμού, και περιοδικές αναφορές προς το ΔΣ.
    map:
      kya: ["4.α", "4.β"]
      nis2: ["20.1", "21.1"]
      iso: ["A.5.4"]
      gdpr: ["24.1"]
    clause: Ρήτρα 5.1

  - id: GOV-02
    group: gov
    kind: decision
    title: Ρόλοι, αρμοδιότητες και ορισμός ΥΑΣΠΕ
    kya: Άρθρο 7 περ. α έως γ
    board: true
    scope: all
    priority: critical
    cycle: 12
    what: Ορισμός ρόλων, αρμοδιοτήτων και εξουσιών για την κυβερνοασφάλεια, ορισμός του Υ.Α.Σ.Π.Ε. με απευθείας αναφορά στο ανώτατο όργανο διοίκησης, και αξιολόγηση των ρόλων από το ίδιο το όργανο σε προγραμματισμένα διαστήματα.
    evidence: Απόφαση ορισμού του ΥΑΣΠΕ, οργανόγραμμα ή πίνακας RACI, και πρακτικό της τελευταίας αξιολόγησης των ρόλων.
    map:
      kya: ["7.α", "7.β", "7.γ"]
      nis2: ["20.1"]
      iso: ["A.5.2", "A.5.3"]
      gdpr: ["24.1"]
    clause: Ρήτρα 5.3

  - id: PRC-01
    group: gov
    kind: procedure
    title: Παρακολούθηση της συμμόρφωσης και αναφορά προς τη διοίκηση
    kya: Άρθρο 9
    board: false
    scope: all
    priority: high
    cycle: 12
    what: Πώς παρακολουθείται η συμμόρφωση με τις κανονιστικές υποχρεώσεις, πόσο συχνά αναφέρεται στο ανώτατο όργανο διοίκησης και πώς αποφασίζονται οι διορθωτικές ενέργειες.
    evidence: Η διαδικασία και οι τελευταίες αναφορές προς το ΔΣ με τις αποφάσεις τους.
    map:
      kya: ["9.α", "9.β", "9.γ"]
      nis2: ["21.4"]
      iso: ["A.5.31", "A.5.36"]
      gdpr: ["5.2"]
    clause: Ρήτρες 9.1 και 9.3

  - id: PLN-03
    group: gov
    kind: plan
    title: Πρόγραμμα ανεξάρτητων ελέγχων ασφάλειας πληροφοριών
    kya: Άρθρο 8
    board: false
    scope: essential
    priority: medium
    cycle: 12
    what: Περιοδικοί ανεξάρτητοι έλεγχοι (independent audits) του προγράμματος, με αμερόληπτους ελεγκτές, σε προγραμματισμένα διαστήματα και μετά από σοβαρό περιστατικό ή αλλαγή, και διορθωτικές ενέργειες από το ανώτατο όργανο.
    evidence: Το πρόγραμμα ελέγχων, η τελευταία έκθεση και η απόφαση για τις διορθωτικές ενέργειες.
    map:
      kya: ["8.α", "8.β", "8.γ", "8.δ"]
      nis2: ["21.2.στ"]
      iso: ["A.5.35"]
      gdpr: ["32.1.δ"]
    clause: Ρήτρα 9.2

  # ---------- Λοιπή τεκμηρίωση · Διαχείριση κινδύνων (άρθρο 5) ----------
  - id: RSK-01
    group: risk
    kind: procedure
    title: Πλαίσιο και μεθοδολογία διαχείρισης κινδύνων
    kya: Άρθρο 5 παρ. 1 περ. α και δ
    board: false
    scope: all
    priority: critical
    cycle: 12
    what: Πλαίσιο ευθυγραμμισμένο με τη διαχείριση των επιχειρηματικών κινδύνων, με μεθοδολογία βασισμένη σε διεθνή πρότυπα και πρόβλεψη για τους κινδύνους από τρίτους.
    evidence: Η εγκεκριμένη μεθοδολογία, με κλίμακες πιθανότητας και επίπτωσης και κριτήρια αποδοχής κινδύνου.
    map:
      kya: ["5.1.α", "5.1.δ"]
      nis2: ["21.1", "21.2.α"]
      iso: []
      gdpr: ["32.2"]
    clause: Ρήτρες 6.1.1 και 6.1.2

  - id: RSK-02
    group: risk
    kind: register
    title: Εκτίμηση κινδύνων και μητρώο κινδύνων
    kya: Άρθρο 5 παρ. 1 περ. β και δ (και παρ. 2 για τις βασικές)
    board: false
    scope: all
    priority: critical
    cycle: 12
