# Εργαλείο «Βασικό σύνολο πολιτικών Conditional Access» (/politikes-conditional-access/).
# Κάθε πολιτική: κωδικός, όνομα με σταθερή ονοματολογία, πότε προτείνεται (rule), άδεια, κύμα ενεργοποίησης,
# αντιστοίχιση με ΚΥΑ 1689/2025, Οδηγία NIS2, ISO/IEC 27001:2022 και GDPR, MITRE ATT&CK®, και το JSON της πολιτικής
# στο σχήμα του Microsoft Graph (conditionalAccessPolicy), έτοιμο για «Upload policy file» στο Microsoft Entra admin center.
# Το JavaScript του shortcode προσθέτει: state = Report-only, εξαίρεση της ομάδας break-glass (αν δοθεί),
# εξαίρεση του ρόλου Directory Synchronization Accounts (αν υπάρχει hybrid identity) και τις πλατφόρμες που χρησιμοποιούνται.
# Ρυθμίσεις από τις σελίδες των templates στο Microsoft Learn, ελεγμένες στις 27/10/2026.
# scope: all = όλοι οι χρήστες, admins = ρόλοι διαχείρισης, guests = επισκέπτες, sp = service principals.
# level: p1 = Entra ID P1 (Business Premium, E3), p2 = Entra ID P2, mdca / irm / gsa / wid = πρόσθετη δυνατότητα.

verified: 2026-10-27

