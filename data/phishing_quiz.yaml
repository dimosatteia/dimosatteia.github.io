      <p>Στο πλαίσιο της συμμόρφωσης, όλο το προσωπικό πρέπει να ολοκληρώσει την ετήσια εκπαίδευση για την Οδηγία NIS2. <mark data-c="threat">Η μη ολοκλήρωση μπορεί να οδηγήσει σε πειθαρχικά μέτρα ή διακοπή της πρόσβασης στο δίκτυο.</mark></p>
      <p>Εγγραφείτε από τον σύνδεσμο: <mark data-c="link">https://compliance-webinar-register-now.example/training_id=123456</mark></p>
      <p><mark data-c="time">Προθεσμία: Παρασκευή, τέλος ημέρας.</mark></p>
      <p>IT Security Team</p>
    flags:
      - { k: dom, red: true, t: 'Ήρθε από «mycompany-compliance.example» και όχι από το mycompany.example', w: 'Ένα domain που μοιάζει με το εταιρικό, με μια λέξη ακόμη στο τέλος.' }
      - { k: link, red: true, t: 'Ο σύνδεσμος πάει σε άσχετο site εγγραφών', w: 'Η εταιρική εκπαίδευση γίνεται από γνωστή πλατφόρμα, όχι από ένα «register-now» site.' }
      - { k: threat, red: true, t: 'Απειλή πειθαρχικών μέτρων και διακοπής πρόσβασης', w: 'Μια πραγματική ανακοίνωση εκπαίδευσης δεν ξεκινά με απειλές.' }
      - { k: time, red: true, t: 'Προθεσμία μέχρι την Παρασκευή', w: 'Η προθεσμία πιέζει να γραφτείς πριν ρωτήσεις.' }
      - { k: istrue, red: false, t: 'Η εκπαίδευση για τη NIS2 είναι πράγματι υποχρεωτική', w: 'Σωστό, και ακριβώς αυτό εκμεταλλεύεται ο επιτιθέμενος. Η ίδια η συμμόρφωση γίνεται δόλωμα.' }
      - { k: sign, red: false, t: 'Υπογράφει «IT Security Team»', w: 'Η υπογραφή είναι απλό κείμενο.' }
    actions:
      - { ok: false, t: 'Γράφομαι αμέσως, είναι υποχρεωτικό', w: 'Η σελίδα «εγγραφής» ζητά τον εταιρικό σου κωδικό.' }
      - { ok: true, t: 'Το αναφέρω με το Report και ελέγχω στο intranet ή στο IT αν υπάρχει τέτοια εκπαίδευση', w: 'Σωστά. Ο οργανισμός σου πρέπει να έχει ανακοινώσει εκ των προτέρων από ποιο κανάλι έρχεται η εκπαίδευση.' }
      - { ok: false, t: 'Απαντώ ότι την έχω ήδη κάνει φέτος', w: 'Η απάντηση επιβεβαιώνει ότι διαβάζεις τα μηνύματα και ανοίγει συζήτηση με τον επιτιθέμενο.' }
      - { ok: false, t: 'Το στέλνω στον προϊστάμενό μου να γραφτεί πρώτος', w: 'Μεταφέρεις τον κίνδυνο σε κάποιον με περισσότερα δικαιώματα.' }
