      - { ok: true, t: 'Δεν κατεβάζω τίποτα. Το αναφέρω με το Report και παίρνω το Service Desk στο γνωστό εσωτερικό τηλέφωνο', w: 'Σωστά. Οι ενημερώσεις στη δική σας εταιρεία έρχονται αυτόματα, και το IT θέλει να ξέρει ότι κάποιος το παριστάνει.' }
