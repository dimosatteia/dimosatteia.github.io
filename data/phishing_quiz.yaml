  - id: tax
    kind: email
    label: Φορολογική αρχή
    title: Πρόστιμο και επιστροφή φόρου
    from: 'e-Filing Φορολογική Αρχή &lt;notification@<mark data-c="dom">tax-efiling-gov.example</mark>&gt;'
