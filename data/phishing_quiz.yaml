      - { k: ticket, red: false, t: 'Έχει αριθμό ticket', w: 'Ο αριθμός ticket επινοείται εύκολα. Δεν αποδεικνύει ότι το έστειλε το IT.' }
      - { k: zeroday, red: false, t: 'Αναφέρει zero-day ευπάθεια', w: 'Οι zero-day ευπάθειες υπάρχουν, και γι’ αυτό ο όρος πείθει. Δεν είναι σημάδι από μόνος του.' }
