      - { k: details, red: false, t: 'Έχει σύνδεσμο «Δείτε λεπτομέρειες συνδρομής»', w: 'Ένας σύνδεσμος παραπάνω δεν κάνει το μήνυμα πιο αξιόπιστο.' }
