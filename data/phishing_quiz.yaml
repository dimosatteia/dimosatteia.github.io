      - { ok: false, t: 'Ανοίγω το συνημμένο για να δω το πρόστιμο', w: 'Το .html ανοίγει σελίδα που ζητά κωδικούς Taxisnet ή στοιχεία κάρτας.' }
      - { ok: true, t: 'Το αναφέρω με το Report και ελέγχω στην επίσημη πύλη, γράφοντας μόνος μου τη διεύθυνση', w: 'Σωστά. Αν υπάρχει πραγματική οφειλή, θα τη δεις εκεί.' }
      - { ok: false, t: 'Πληρώνω, είναι μόνο 75 ευρώ', w: 'Ο στόχος είναι τα στοιχεία της κάρτας και οι κωδικοί σου, όχι τα 75 ευρώ.' }
      - { ok: false, t: 'Το στέλνω στο λογιστήριο να το πληρώσει', w: 'Μεταφέρεις τον κίνδυνο. Το λογιστήριο θα χρειαστεί κι αυτό να ελέγξει από την επίσημη πύλη.' }
