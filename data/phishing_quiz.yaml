    time: 'Σήμερα, 12:02'
    body: |
      <p>Αξιότιμε φορολογούμενε,</p>
      <p>Τα αρχεία μας δείχνουν απλήρωτο πρόστιμο 75,50 € από το φορολογικό έτος 2024. <mark data-c="legal">Αν δεν πληρωθεί, θα κινηθούν νομικές διαδικασίες.</mark> <mark data-c="combo">Δείτε επίσης αν δικαιούστε επιστροφή φόρου</mark> στο συνημμένο.</p>
      <p>Τμήμα Συμμόρφωσης</p>
    attach: '<mark data-c="html">Tax_Fine_and_Refund_Details.html</mark>'
    flags:
      - { k: dom, red: true, t: 'Το domain «tax-efiling-gov.example» δεν είναι κρατικό', w: 'Στην Ελλάδα οι δημόσιες υπηρεσίες χρησιμοποιούν domains που τελειώνουν σε gov.gr. Ένα «gov» μέσα στο όνομα δεν αρκεί.' }
      - { k: html, red: true, t: 'Συνημμένο αρχείο .html', w: 'Ένα .html συνημμένο ανοίγει τοπικά μια ψεύτικη σελίδα σύνδεσης και περνά πιο εύκολα από τα φίλτρα συνδέσμων.' }
      - { k: combo, red: true, t: 'Πρόστιμο και επιστροφή φόρου στο ίδιο μήνυμα', w: 'Φόβος και κέρδος μαζί: αν δεν σε πιάσει το ένα, θα σε πιάσει το άλλο.' }
      - { k: legal, red: true, t: 'Απειλή νομικών διαδικασιών', w: 'Οι φορολογικές αρχές δεν ειδοποιούν για νομικές διαδικασίες με ένα email με συνημμένο.' }
      - { k: small, red: false, t: 'Το ποσό είναι μικρό, άρα μοιάζει αληθινό', w: 'Το μικρό ποσό είναι μέρος του δολώματος: πληρώνεται χωρίς πολλή σκέψη.' }
      - { k: year, red: false, t: 'Αναφέρει συγκεκριμένο φορολογικό έτος', w: 'Μια χρονιά προστίθεται εύκολα και δεν αποδεικνύει τίποτα.' }
