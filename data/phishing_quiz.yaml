# Σενάρια του «Κουίζ phishing» (/kouiz-phishing/). Όλα τα ονόματα και οι διευθύνσεις είναι κατασκευασμένα.
# Τα domains τελειώνουν σε .example, που είναι δεσμευμένο για παραδείγματα και δεν ανήκει σε κανέναν.
# Η εικονική εταιρεία είναι η MyCompany (mycompany.example) και εμφανίζονται μόνο ρόλοι, όχι ονόματα.
# Στα body: <mark data-c="κλειδί"> σημαδεύει το σημείο που φωτίζεται όταν αποκαλύπτεται η απάντηση.
updated: 2026-10-16
scenarios:
  - id: bank
    kind: web
    label: Τράπεζα
    title: Περιορισμός λογαριασμού
    from: 'Fidelis Τράπεζα &lt;security@<mark data-c="dom">secure-fidelis-bank.example</mark>&gt;'
    subject: 'Προειδοποίηση ασφαλείας: περιορισμός πρόσβασης στον λογαριασμό σας'
    time: 'Σήμερα, 08:12'
    body: |
      <p>Αγαπητέ πελάτη,</p>
      <p>Εντοπίσαμε ασυνήθιστη δραστηριότητα και περιορίσαμε προσωρινά τον λογαριασμό σας. Για να αποκαταστήσετε την πρόσβαση, <mark data-c="cred">συνδεθείτε παρακάτω και επιβεβαιώστε τα στοιχεία σας</mark>.</p>
      <p><mark data-c="time">Αν δεν το κάνετε μέσα σε 24 ώρες</mark>, <mark data-c="threat">ο λογαριασμός θα κλείσει οριστικά</mark>.</p>
    button: 'Σύνδεση και επαλήθευση'
    url: 'https://<mark data-c="dom">secure-fidelis-bank.example</mark>/login.jsp'
    flags:
      - { k: dom, red: true, t: 'Το domain «secure-fidelis-bank.example» δεν είναι το επίσημο της τράπεζας', w: 'Λέξεις όπως secure, login, verify μπροστά από το όνομα της τράπεζας είναι κλασικό κόλπο. Το επίσημο site το γράφεις μόνος σου ή το ανοίγεις από τα αγαπημένα.' }
      - { k: time, red: true, t: 'Προθεσμία 24 ωρών', w: 'Η πίεση χρόνου υπάρχει για να μη σκεφτείς. Οι τράπεζες δεν κλείνουν λογαριασμούς με ένα email.' }
      - { k: threat, red: true, t: 'Απειλή οριστικού κλεισίματος', w: 'Ο φόβος είναι το δεύτερο εργαλείο του επιτιθέμενου μετά τη βιασύνη.' }
      - { k: cred, red: true, t: 'Ζητά κωδικό μέσα από σύνδεσμο', w: 'Καμία τράπεζα δεν σου ζητά να συνδεθείς από σύνδεσμο σε email.' }
      - { k: logo, red: false, t: 'Έχει το λογότυπο της τράπεζας', w: 'Το λογότυπο αντιγράφεται σε δευτερόλεπτα. Δεν αποδεικνύει τίποτα, ούτε υπέρ ούτε κατά.' }
      - { k: greek, red: false, t: 'Είναι γραμμένο σε σωστά Ελληνικά', w: 'Τα σωστά Ελληνικά δεν είναι πια ένδειξη γνησιότητας. Με εργαλεία AI, τα phishing μηνύματα γράφονται άψογα.' }
    actions:
      - { ok: false, t: 'Πατάω το κουμπί και συνδέομαι για να μη χάσω τον λογαριασμό', w: 'Ο κωδικός σου πάει κατευθείαν στον επιτιθέμενο.' }
      - { ok: false, t: 'Απαντώ στο email και ρωτάω αν είναι αληθινό', w: 'Η απάντηση πάει στον ίδιο τον επιτιθέμενο, που θα σου πει ότι είναι αληθινό.' }
      - { ok: true, t: 'Το αναφέρω με το Report στο Outlook και μπαίνω στην τράπεζα γράφοντας μόνος μου τη διεύθυνση', w: 'Σωστά. Η αναφορά βοηθά το IT να το σβήσει και από τους άλλους, και ο έλεγχος γίνεται από κανάλι που ξέρεις.' }
      - { ok: false, t: 'Το προωθώ στους συναδέλφους για να προσέχουν', w: 'Η προώθηση απλώνει τον κακόβουλο σύνδεσμο. Το Report στέλνει το μήνυμα εκεί που πρέπει.' }
    img: phishing1
    technique: Credential Harvest
    m365: 'Οι Safe Links του Microsoft Defender for Office 365 ελέγχουν τον σύνδεσμο τη στιγμή του κλικ. Το Microsoft Defender SmartScreen στον Edge μπλοκάρει γνωστές σελίδες phishing. Το κουμπί Report στο Outlook στέλνει το μήνυμα στους διαχειριστές.'
    kya: [αα, αδ]

  - id: courier
    kind: sms
    label: Courier
    title: Δέμα που δεν παραδόθηκε
    from: '<mark data-c="num">+30 694 000 0000</mark>'
    subject: ''
    time: '<mark data-c="hour">Σήμερα, 02:27</mark>'
    body: |
      <p>Το δέμα σας #ADF883 δεν παραδόθηκε λόγω λάθους διεύθυνσης. <mark data-c="fee">Ενημερώστε άμεσα για να αποφύγετε χρέωση επιστροφής</mark>:</p>
      <p><mark data-c="short">bit.ly/pkg-delivery-status</mark></p>
    flags:
      - { k: short, red: true, t: 'Σύντομος σύνδεσμος bit.ly', w: 'Ο σύντομος σύνδεσμος κρύβει πού πραγματικά πηγαίνεις. Οι εταιρείες courier στέλνουν σύνδεσμο στο δικό τους domain.' }
      - { k: fee, red: true, t: 'Απειλή χρέωσης αν δεν κάνεις κάτι άμεσα', w: 'Μικρή χρέωση και βιασύνη: ο κλασικός συνδυασμός του smishing.' }
      - { k: num, red: true, t: 'Ήρθε από απλό αριθμό κινητού, χωρίς όνομα εταιρείας', w: 'Οι εταιρείες στέλνουν από όνομα αποστολέα, όχι από τυχαίο κινητό. Ο αποστολέας πάντως πλαστογραφείται κι αυτός, οπότε μην τον εμπιστεύεσαι μόνο αν φαίνεται σωστός.' }
      - { k: hour, red: true, t: 'Ώρα αποστολής 02:27', w: 'Ειδοποιήσεις παράδοσης στις 2 τα ξημερώματα δεν είναι συνηθισμένες.' }
      - { k: track, red: false, t: 'Έχει αριθμό δέματος', w: 'Ο αριθμός είναι επινοημένος. Μοιάζει πειστικός, αλλά δεν αποδεικνύει τίποτα.' }
      - { k: mobile, red: false, t: 'Ήρθε στο κινητό και όχι στο email', w: 'Το κανάλι δεν κάνει ένα μήνυμα ασφαλές ή επικίνδυνο. Το smishing είναι phishing με SMS.' }
    actions:
      - { ok: false, t: 'Πατάω τον σύνδεσμο για να δω τι είναι, χωρίς να συμπληρώσω τίποτα', w: 'Μόνο το άνοιγμα αρκεί για να καταγραφεί ότι ο αριθμός είναι ενεργός, και κάποιες σελίδες εκμεταλλεύονται κενά του browser.' }
      - { ok: true, t: 'Δεν πατάω. Ελέγχω την αποστολή στην εφαρμογή ή στο site της εταιρείας που ανοίγω μόνος μου, και αν είναι εταιρικό κινητό ενημερώνω το IT', w: 'Σωστά. Ο έλεγχος γίνεται από κανάλι που ξέρεις, και το IT μαθαίνει ότι η εκστρατεία στοχεύει και εταιρικά κινητά.' }
      - { ok: false, t: 'Απαντώ «STOP» για να σταματήσουν τα μηνύματα', w: 'Η απάντηση επιβεβαιώνει ότι ο αριθμός είναι ενεργός και φέρνει περισσότερα μηνύματα.' }
      - { ok: false, t: 'Πληρώνω τη χρέωση, είναι λίγα ευρώ', w: 'Δεν είναι τα λίγα ευρώ ο στόχος. Είναι τα στοιχεία της κάρτας σου.' }
    img: phishing2
    technique: 'Δεν υπάρχει προσομοίωση SMS στο Attack simulation training: κάλυψέ το στην εκπαίδευση με παραδείγματα σαν αυτό'
    m365: 'Τα SMS είναι εκτός Microsoft 365 και δεν τα φιλτράρει ο Microsoft Defender for Office 365. Σε εταιρικά κινητά, το Microsoft Defender for Endpoint για iOS και Android με web protection μπλοκάρει γνωστούς κακόβουλους συνδέσμους, και το Microsoft Intune επιβάλλει τη ρύθμιση.'
    kya: [αα, αδ]

  - id: m365
    kind: email
    label: Microsoft 365
    title: Λήξη κωδικού
    from: 'Microsoft 365 &lt;no-reply@<mark data-c="dom">microsoftonline-security-check.example</mark>&gt;'
    subject: 'Ο κωδικός σας λήγει σήμερα'
    time: 'Σήμερα, 09:41'
    body: |
      <p>Ο κωδικός πρόσβασης για το user@mycompany.example <mark data-c="today">λήγει σήμερα</mark>.</p>
      <p><mark data-c="lock">Αν δεν τον ανανεώσετε, ο λογαριασμός θα κλειδωθεί και θα χάσετε την πρόσβαση στα αρχεία σας.</mark></p>
      <p><mark data-c="keep">Κρατήστε τον ίδιο κωδικό</mark> πατώντας το κουμπί.</p>
    button: 'Διατήρηση κωδικού'
    url: 'https://login.<mark data-c="dom">microsoftonline-security-check.example</mark>/'
    flags:
      - { k: dom, red: true, t: 'Το domain «microsoftonline-security-check.example» δεν είναι της Microsoft', w: 'Ο σύνδεσμος ξεκινά με login.microsoftonline για να ξεγελάσει. Αυτό που μετράει είναι το κομμάτι πριν από την κατάληξη, και εδώ είναι άλλο.' }
      - { k: today, red: true, t: '«Λήγει σήμερα»', w: 'Η προθεσμία της ίδιας ημέρας υπάρχει για να μη ρωτήσεις κανέναν.' }
      - { k: lock, red: true, t: 'Απειλή κλειδώματος και απώλειας αρχείων', w: 'Η απώλεια πρόσβασης στα αρχεία είναι ο φόβος που κάνει τους χρήστες να πατήσουν.' }
      - { k: keep, red: true, t: 'Σου προτείνει να «κρατήσεις τον ίδιο κωδικό» με ένα κουμπί', w: 'Αλλαγή ή διατήρηση κωδικού δεν γίνεται ποτέ από σύνδεσμο σε email. Γίνεται μόνο στη γνωστή σελίδα του λογαριασμού σου.' }
      - { k: logo, red: false, t: 'Έχει το λογότυπο της Microsoft', w: 'Το λογότυπο αντιγράφεται εύκολα. Δεν λέει τίποτα για το ποιος έστειλε το μήνυμα.' }
      - { k: email, red: false, t: 'Γράφει σωστά τη δική μου διεύθυνση email', w: 'Ο επιτιθέμενος έχει ήδη τη διεύθυνσή σου, αφού σου έστειλε το μήνυμα. Δεν αποδεικνύει γνησιότητα.' }
    actions:
      - { ok: false, t: 'Βάζω τον κωδικό, έχω MFA οπότε δεν κινδυνεύω', w: 'Οι σύγχρονες σελίδες phishing (adversary-in-the-middle) κλέβουν και τον κωδικό και το session μετά το MFA. Ο κωδικός μιας φοράς ή η ειδοποίηση στο κινητό δεν σε προστατεύουν εδώ.' }
      - { ok: true, t: 'Το αναφέρω με το Report στο Outlook. Αν ανησυχώ, ανοίγω μόνος μου τη σελίδα του λογαριασμού μου ή ρωτάω το IT', w: 'Σωστά. Το IT ξέρει την πολιτική κωδικών της εταιρείας. Πολλές εταιρείες δεν βάζουν καν λήξη κωδικού.' }
      - { ok: false, t: 'Το αγνοώ και το σβήνω', w: 'Καλύτερα από το κλικ, αλλά χωρίς αναφορά το IT δεν μαθαίνει ότι η εκστρατεία έφτασε στο mailbox και δεν προστατεύει τους υπόλοιπους.' }
      - { ok: false, t: 'Πατάω το κουμπί από το κινητό, που είναι πιο ασφαλές', w: 'Η σελίδα phishing δουλεύει το ίδιο στο κινητό. Και η μικρή οθόνη κρύβει ακόμη πιο εύκολα το πραγματικό domain.' }
    img: phishing3
    technique: Credential Harvest
    m365: 'Οι Safe Links και η προστασία από impersonation του Microsoft Defender for Office 365 πιάνουν πολλά τέτοια μηνύματα. Το phishing-resistant MFA (passkeys, FIDO2, Windows Hello for Business) με Conditional Access authentication strengths κάνει τον κλεμμένο κωδικό άχρηστο, και το Token protection δυσκολεύει την κλοπή session.'
    kya: [αα, αβ, αγ]

  - id: payroll
    kind: email
    label: HR
    title: Νέα μισθολογική δομή
    from: 'Τμήμα HR &lt;hr.dept@<mark data-c="dom">company-payroll.example</mark>&gt;'
    subject: '<mark data-c="urgent">Εμπιστευτικό και επείγον</mark>: νέα μισθολογική δομή'
    time: 'Χθες, 17:55'
    body: |
      <p><mark data-c="generic">Αγαπητέ συνάδελφε</mark>,</p>
      <p>Δείτε στο συνημμένο τη νέα μισθολογική δομή της εταιρείας, που ισχύει άμεσα. Η ανασκόπηση είναι εμπιστευτική και επείγουσα. Ελέγξτε ότι τα στοιχεία σας είναι σωστά.</p>
      <p>Με εκτίμηση,<br>HR Payroll Team</p>
    attach: '<mark data-c="docm">2026_Payroll_Structure.docm</mark>'
    flags:
      - { k: dom, red: true, t: 'Ήρθε από «company-payroll.example» και όχι από το mycompany.example', w: 'Το εσωτερικό HR στέλνει από το domain της εταιρείας. Στο Outlook, η ετικέτα «Εξωτερικός αποστολέας» το δείχνει αμέσως.' }
      - { k: docm, red: true, t: 'Συνημμένο .docm', w: 'Το «m» στο τέλος σημαίνει ότι το αρχείο έχει macros, δηλαδή κώδικα. Ένα έγγραφο μισθοδοσίας δεν χρειάζεται macros.' }
      - { k: urgent, red: true, t: '«Εμπιστευτικό και επείγον»', w: 'Το «εμπιστευτικό» σε κάνει να μη ρωτήσεις συνάδελφο. Το «επείγον» σε κάνει να μη σκεφτείς.' }
      - { k: generic, red: true, t: 'Γενική προσφώνηση «Αγαπητέ συνάδελφε»', w: 'Το δικό σου HR ξέρει το όνομά σου. Η γενική προσφώνηση δείχνει μαζική αποστολή.' }
      - { k: sig, red: false, t: 'Έχει υπογραφή τμήματος', w: 'Η υπογραφή είναι απλό κείμενο. Ο καθένας μπορεί να τη γράψει.' }
      - { k: topic, red: false, t: 'Το θέμα αφορά τη μισθοδοσία, κάτι που με ενδιαφέρει', w: 'Το θέμα δεν είναι σημάδι. Είναι το δόλωμα: διαλέγεται ακριβώς επειδή σε ενδιαφέρει.' }
    actions:
      - { ok: false, t: 'Ανοίγω το αρχείο και πατάω «Enable Content» για να δω τα νούμερα', w: 'Αυτό ακριβώς χρειάζεται ο επιτιθέμενος. Τα macros τρέχουν και εγκαθιστούν κακόβουλο λογισμικό.' }
      - { ok: false, t: 'Το ανοίγω στο κινητό, όπου τα macros δεν τρέχουν', w: 'Το κινητό ίσως δεν τρέξει τα macros, αλλά το μήνυμα μένει στο mailbox και κάποιος συνάδελφος θα το ανοίξει στον υπολογιστή.' }
      - { ok: true, t: 'Δεν το ανοίγω. Το αναφέρω με το Report και ρωτάω το HR από το Teams ή στο τηλέφωνο', w: 'Σωστά. Η επιβεβαίωση γίνεται από κανάλι που ξέρεις, όχι απαντώντας στο ίδιο μήνυμα.' }
      - { ok: false, t: 'Απαντώ στο HR και ζητάω PDF αντί για Word', w: 'Η απάντηση πάει στον επιτιθέμενο, που θα σου στείλει ευχαρίστως ένα κακόβουλο PDF.' }
    img: phishing4
    technique: Malware Attachment
    m365: 'Τα Safe Attachments του Microsoft Defender for Office 365 ανοίγουν το συνημμένο σε απομονωμένο περιβάλλον πριν φτάσει. Τα Office μπλοκάρουν εξ ορισμού τα macros σε αρχεία από το διαδίκτυο. Οι κανόνες Attack Surface Reduction του Microsoft Defender for Endpoint εμποδίζουν τα Office να ξεκινούν άλλα προγράμματα.'
    kya: [αα]
    gdpr: true

  - id: ceo
    kind: email
    label: CEO fraud
    title: Επείγουσα μεταφορά χρημάτων
    from: 'CEO, MyCompany &lt;ceo.office@<mark data-c="dom">mycompany-group.example</mark>&gt;'
    subject: 'ΕΠΕΙΓΟΝ: μεταφορά σήμερα'
    time: 'Σήμερα, 11:03'
    body: |
      <p>Καλημέρα,</p>
      <p>Χρειάζομαι να γίνει σήμερα μεταφορά 55.000 € <mark data-c="newacct">στον νέο μας προμηθευτή στο εξωτερικό</mark> για την επέκταση. <mark data-c="secret">Το θέμα είναι εμπιστευτικό και είμαι σε συναντήσεις όλη μέρα</mark>, οπότε βασίζομαι σε σένα.</p>
      <p>IBAN: GB00 APEX 0000 0000 0000 00<br>Δικαιούχος: Apex Global Solutions Ltd.</p>
      <p><mark data-c="bypass">Στείλε μου την επιβεβαίωση μέχρι το τέλος της ημέρας.</mark></p>
      <p>CEO</p>
    flags:
      - { k: dom, red: true, t: 'Το domain είναι «mycompany-group.example» και όχι το mycompany.example', w: 'Ένα domain σχεδόν ίδιο με το δικό σας είναι η βάση του CEO fraud. Στο κινητό, όπου φαίνεται μόνο το όνομα, δεν το βλέπεις καν.' }
      - { k: newacct, red: true, t: 'Νέος λογαριασμός σε προμηθευτή στο εξωτερικό', w: 'Νέος IBAN και νέος προμηθευτής χωρίς διαδικασία: αυτό είναι το σημείο που χάνονται τα χρήματα.' }
      - { k: secret, red: true, t: '«Εμπιστευτικό» και «είμαι σε συναντήσεις»', w: 'Και τα δύο υπάρχουν για να μην μπορέσεις να ρωτήσεις κανέναν, ούτε τον ίδιο τον CEO.' }
      - { k: bypass, red: true, t: 'Παρακάμπτει τη διαδικασία έγκρισης πληρωμών', w: 'Καμία πληρωμή δεν γίνεται επειδή το ζήτησε ένα email, όποιος κι αν φαίνεται να το στέλνει.' }
      - { k: sign, red: false, t: 'Υπογράφει ως CEO', w: 'Η υπογραφή είναι κείμενο. Δεν αποδεικνύει ποιος έστειλε το μήνυμα.' }
      - { k: noLink, red: false, t: 'Δεν έχει σύνδεσμο ούτε συνημμένο, άρα είναι ασφαλές', w: 'Το CEO fraud συνήθως δεν έχει ούτε σύνδεσμο ούτε συνημμένο. Γι’ αυτό περνά τα φίλτρα και γι’ αυτό είναι τόσο επικίνδυνο.' }
    actions:
      - { ok: false, t: 'Κάνω τη μεταφορά, ο CEO είναι σε συναντήσεις και βιάζεται', w: 'Αυτό ακριβώς σχεδίασε ο επιτιθέμενος. Τα χρήματα σπάνια επιστρέφουν.' }
      - { ok: false, t: 'Απαντώ στο email και ζητάω επιβεβαίωση', w: 'Η απάντηση πάει στον επιτιθέμενο, που θα επιβεβαιώσει πρόθυμα.' }
      - { ok: true, t: 'Δεν πληρώνω. Παίρνω τον CEO στο γνωστό του τηλέφωνο ή στο Teams, και το αναφέρω με το Report', w: 'Σωστά. Η επιβεβαίωση από άλλο, γνωστό κανάλι σταματά σχεδόν κάθε CEO fraud.' }
      - { ok: false, t: 'Το προωθώ στο λογιστήριο για να το κάνουν εκείνοι', w: 'Το πρόβλημα απλώς μεταφέρεται. Το λογιστήριο χρειάζεται κι αυτό επιβεβαίωση από γνωστό κανάλι.' }
    img: phishing5
    technique: 'Το CEO fraud δεν έχει σύνδεσμο που να μετριέται με κλικ: δούλεψέ το ως άσκηση με το λογιστήριο και τη διαδικασία πληρωμών'
    m365: 'Η προστασία από user και domain impersonation του Microsoft Defender for Office 365 εντοπίζει domains και ονόματα που μοιάζουν με τα δικά σας. Το first contact safety tip, που υπάρχει σε κάθε mailbox του Microsoft 365, δείχνει ότι δεν έχεις ξαναλάβει email από αυτόν τον αποστολέα. Η πραγματική άμυνα όμως είναι οργανωτική: διπλή έγκριση πληρωμών και επιβεβαίωση κάθε αλλαγής IBAN με τηλέφωνο.'
    kya: [αα, αζ]

  - id: cloud
    kind: web
    label: Cloud
    title: Ύποπτη σύνδεση
    from: 'Cloud Secure Services &lt;alerts@<mark data-c="dom">cloud-secure-services.example</mark>&gt;'
    subject: 'Ύποπτη απόπειρα σύνδεσης στον λογαριασμό σας'
    time: 'Σήμερα, 07:30'
    body: |
      <p>Εντοπίσαμε απόπειρα σύνδεσης <mark data-c="vague">από άγνωστη συσκευή</mark>. Για την προστασία σας, η πρόσβαση περιορίστηκε προσωρινά.</p>
      <p>Επαληθεύστε την ταυτότητά σας τώρα. <mark data-c="time">Αν δεν το κάνετε μέσα σε 12 ώρες, ο λογαριασμός θα ανασταλεί οριστικά.</mark></p>
    button: '<mark data-c="btn">Επαλήθευση ταυτότητας τώρα</mark>'
    url: 'https://<mark data-c="dom">cloud-secure-services.example</mark>/verify/login'
    flags:
