# «Αποκωδικοποιητής ASR rules» (/apokodikopoiisi-asr-rules/)
# Οι κανόνες Attack Surface Reduction του Microsoft Defender, με GUID, όνομα στο Intune, Ελληνική ερμηνεία,
# action types του Advanced Hunting και προτεινόμενη φάση ενεργοποίησης.
# Πηγή: Microsoft Learn, «Attack surface reduction (ASR) rules reference» (ελέγχθηκε 02/11/2026)
#   https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-reference
# Τιμές action: 0 Off, 1 Block, 2 Audit, 5 Not configured, 6 Warn
#   https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-configure
# phase: 1 = Block αμέσως (standard protection rules), 2 = σύντομο Audit, 3 = μεγαλύτερο Audit με πιθανές εξαιρέσεις, server = μόνο σε Exchange servers.
# Η φάση είναι πρόταση του thecybersec.gr, όχι της Microsoft. Οι τρεις κανόνες της φάσης 1 είναι οι «standard protection rules» της Microsoft.

modes:
  "0": [Off, red]
  "1": [Block, green]
  "2": [Audit, amber]
  "5": [Not configured, amber]
  "6": [Warn, blue]

phases:
  "1": "Φάση 1: Block αμέσως"
  "2": "Φάση 2: Audit 1 έως 2 εβδομάδες, μετά Block"
  "3": "Φάση 3: Audit 2 έως 4 εβδομάδες, εξαιρέσεις, μετά Block"
  server: "Μόνο σε Exchange servers"

rules:
  - guid: 56a863a9-875e-4185-98a7-b882c64b5ce5
    name: Block abuse of exploited vulnerable signed drivers (Device)
    el: Αποκλεισμός ευάλωτων υπογεγραμμένων drivers
    what: Δεν αφήνει εφαρμογές να αποθηκεύσουν στον υπολογιστή drivers που είναι υπογεγραμμένοι αλλά γνωστά ευάλωτοι. Με τέτοιους drivers ο επιτιθέμενος φτάνει στον kernel και απενεργοποιεί το antivirus. Δεν σταματά drivers που υπάρχουν ήδη στον υπολογιστή.
    phase: "1"
    warn: true
    ah: [AsrVulnerableSignedDriverAudited, AsrVulnerableSignedDriverBlocked]
    note: Συμπλήρωσέ τον με το Microsoft vulnerable driver blocklist ή το App Control for Business.
  - guid: 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2
    name: Block credential stealing from the Windows local security authority subsystem
    el: Προστασία του LSASS από κλοπή διαπιστευτηρίων
    what: Κλειδώνει τη μνήμη του lsass.exe, ώστε εργαλεία όπως το Mimikatz να μη διαβάζουν κωδικούς και NTLM hashes. Δεν σταματά προγράμματα να τρέχουν, μόνο την πρόσβασή τους στη μνήμη του LSASS.
    phase: "1"
    warn: false
    ah: [AsrLsassCredentialTheftAudited, AsrLsassCredentialTheftBlocked]
    note: Δεν υποστηρίζει Warn. Σε Audit βγάζει πολλά συμβάντα που σχεδόν όλα είναι ακίνδυνα, γι' αυτό η Microsoft λέει ότι μπορείς να πας κατευθείαν σε Block, ξεκινώντας από λίγες συσκευές. Αν έχεις LSA protection ή Credential Guard, ο κανόνας δεν προσθέτει προστασία και το Defender portal τον δείχνει ως μη εφαρμόσιμο.
  - guid: e6db77e5-3df2-4cf1-b95a-636979351e5b
    name: Block persistence through WMI event subscription
    el: Αποκλεισμός μόνιμης παρουσίας μέσω WMI
    what: Δεν αφήνει malware να κρυφτεί στο WMI με event subscriptions, ώστε να ξαναξεκινά μόνο του χωρίς αρχείο στον δίσκο.
    phase: "1"
    warn: true
    ah: [AsrPersistenceThroughWmiAudited, AsrPersistenceThroughWmiBlocked]
    note: Αν χρησιμοποιείς Configuration Manager, δοκίμασέ τον πρώτα σε Audit, γιατί ο client του βασίζεται στο WMI.
  - guid: be9ba2d9-53ea-4cdc-84e5-9b1eeee46550
    name: Block executable content from email client and webmail
    el: Αποκλεισμός εκτελέσιμων από email και webmail
    what: Δεν αφήνει να τρέξουν εκτελέσιμα, scripts και αρχεία zip που άνοιξαν από το Outlook ή από webmail.
    phase: "2"
    warn: true
    ah: [AsrExecutableEmailContentAudited, AsrExecutableEmailContentBlocked]
    note: ""
  - guid: d3e037e1-3eb8-44c8-a917-57927947596d
    name: Block JavaScript or VBScript from launching downloaded executable content
    el: Αποκλεισμός JavaScript και VBScript που τρέχουν κατεβασμένα εκτελέσιμα
    what: Σταματά scripts που κατεβάζουν και τρέχουν άλλο πρόγραμμα, το κλασικό πρώτο βήμα πολλών επιθέσεων.
    phase: "2"
    warn: true
    ah: [AsrScriptExecutableDownloadAudited, AsrScriptExecutableDownloadBlocked]
    note: Σπάνια, κάποια εσωτερική εφαρμογή κατεβάζει installers με script. Το Audit θα σου το δείξει.
  - guid: 5beb7efe-fd9a-4556-801d-275e5ffc04cc
    name: Block execution of potentially obfuscated scripts
    el: Αποκλεισμός scripts που φαίνονται συγκαλυμμένα
    what: Σταματά scripts, και PowerShell, με χαρακτηριστικά συγκάλυψης (obfuscation), που κάνουν τον κώδικα δύσκολο να διαβαστεί.
    phase: "2"
    warn: true
    ah: [AsrObfuscatedScriptAudited, AsrObfuscatedScriptBlocked]
    note: Χρειάζεται cloud-delivered protection.
  - guid: 3b576869-a4ec-4529-8536-b80a7769e899
    name: Block Office applications from creating executable content
    el: Αποκλεισμός δημιουργίας εκτελέσιμων από το Office
    what: Δεν αφήνει το Word, το Excel και το PowerPoint να γράψουν στον δίσκο εκτελέσιμο κώδικα που θα τρέξει αργότερα.
    phase: "2"
    warn: true
    ah: [AsrExecutableOfficeContentAudited, AsrExecutableOfficeContentBlocked]
    note: ""
  - guid: 75668c1f-73b5-4cf0-bb93-3ecf5cb7cc84
    name: Block Office applications from injecting code into other processes
    el: Αποκλεισμός έγχυσης κώδικα από το Office σε άλλες διεργασίες
    what: Σταματά το Office όταν προσπαθεί να βάλει κώδικα μέσα σε άλλη διεργασία, για να κρυφτεί ο κώδικας πίσω από ένα καθαρό πρόγραμμα. Η Microsoft δεν ξέρει νόμιμη χρήση για αυτό.
    phase: "2"
    warn: false
    ah: [AsrOfficeProcessInjectionAudited, AsrOfficeProcessInjectionBlocked]
    note: Δεν υποστηρίζει Warn. Ασύμβατος με BeyondTrust Privilege Guard και Heimdal. Θέλει επανεκκίνηση των εφαρμογών του Office για να εφαρμοστεί.
  - guid: 92e97fa1-2edf-4476-bdd6-9dd0b4dddc7b
    name: Block Win32 API calls from Office macros
    el: Αποκλεισμός κλήσεων Win32 API από macros του Office
    what: Δεν αφήνει macros VBA να καλούν Win32 APIs, έναν τρόπο να τρέξει κακόβουλος κώδικας κατευθείαν στη μνήμη. Οι περισσότεροι οργανισμοί δεν το χρειάζονται, ακόμα κι αν χρησιμοποιούν macros.
    phase: "2"
    warn: true
    ah: [AsrOfficeMacroWin32ApiCallsAudited, AsrOfficeMacroWin32ApiCallsBlocked]
    note: ""
  - guid: 7674ba52-37eb-4a4f-a9a1-f0f9a1619a2c
    name: Block Adobe Reader from creating child processes
    el: Αποκλεισμός νέων διεργασιών από το Adobe Reader
    what: Δεν αφήνει το Adobe Reader να ξεκινήσει άλλα προγράμματα, όπως κάνει ένα κακόβουλο PDF.
    phase: "2"
    warn: true
    ah: [AsrAdobeReaderChildProcessAudited, AsrAdobeReaderChildProcessBlocked]
    note: ""
  - guid: 26190899-1602-49e8-8b27-eb1d0a1ce869
    name: Block Office communication application from creating child processes
    el: Αποκλεισμός νέων διεργασιών από το Outlook
    what: Δεν αφήνει το Outlook να ξεκινήσει άλλα προγράμματα. Προστατεύει και από τις επιθέσεις με κανόνες και φόρμες του Outlook μετά από κλοπή λογαριασμού.
    phase: "2"
    warn: true
    ah: [AsrOfficeCommAppChildProcessAudited, AsrOfficeCommAppChildProcessBlocked]
    note: ""
  - guid: b2b3f03d-6a65-4f7b-a9c7-1c7ef74a9ba4
    name: Block untrusted and unsigned processes that run from USB
    el: Αποκλεισμός ανυπόγραφων προγραμμάτων από USB
    what: Δεν αφήνει να τρέξουν ανυπόγραφα ή άγνωστα εκτελέσιμα από USB και κάρτες SD. Δεν εμποδίζει την αντιγραφή τους στον δίσκο.
    phase: "2"
    warn: true
    ah: [AsrUntrustedUsbProcessAudited, AsrUntrustedUsbProcessBlocked]
    note: Σε περιβάλλον με OT, όπου τεχνικοί φέρνουν εργαλεία σε USB, δες πρώτα στο Audit ποια προγράμματα τρέχουν από USB.
  - guid: 33ddedf1-c6e0-47cb-833e-de6133960387
    name: Block rebooting machine in Safe Mode
    el: Αποκλεισμός επανεκκίνησης σε Safe Mode
    what: Δεν αφήνει εντολές όπως bcdedit και bootcfg να ξεκινήσουν τον υπολογιστή σε Safe Mode, όπου πολλά προγράμματα ασφάλειας δεν τρέχουν. Το ransomware το χρησιμοποιεί για να κρυπτογραφήσει χωρίς εμπόδια.
    phase: "2"
    warn: true
    ah: [AsrSafeModeRebootedAudited, AsrSafeModeRebootBlocked]
    note: Το Safe Mode μένει διαθέσιμο χειροκίνητα από το Windows Recovery Environment.
  - guid: c0033c00-d16d-4114-a5a0-dc9b3a7d2ceb
    name: Block use of copied or impersonated system tools
    el: Αποκλεισμός αντιγραμμένων ή πλαστών εργαλείων συστήματος
    what: Σταματά αντίγραφα εργαλείων των Windows, ή αρχεία με το ίδιο όνομα, όταν τρέχουν έξω από τα System32 και SysWOW64. Ο επιτιθέμενος τα αντιγράφει αλλού για να ξεφύγει από τους ελέγχους.
    phase: "2"
    warn: true
    ah: [AsrAbusedSystemToolAudited, AsrAbusedSystemToolBlocked]
    note: Μπορεί να μπλοκάρει και νόμιμο πρόγραμμα που τρέχει από ασυνήθιστο φάκελο. Το Audit θα σου το δείξει.
  - guid: d4f940ab-401b-4efc-aadc-ad5f3c50688a
    name: Block all Office applications from creating child processes
    el: Αποκλεισμός νέων διεργασιών από όλες τις εφαρμογές του Office
    what: Δεν αφήνει Word, Excel, PowerPoint, OneNote και Access να ξεκινήσουν άλλα προγράμματα, όπως κάνει ένα κακόβουλο macro που ανοίγει PowerShell.
    phase: "3"
    warn: true
    ah: [AsrOfficeChildProcessAudited, AsrOfficeChildProcessBlocked]
    note: Συχνά το χτυπούν νόμιμα add-ins και αρχεία Excel που ανοίγουν cmd ή PowerShell. Μάζεψε τα συμβάντα του Audit και φτιάξε εξαιρέσεις πριν το Block.
  - guid: 01443614-cd74-433a-b99e-2ecdc07bfc25
    name: Block executable files from running unless they meet a prevalence, age, or trusted list criterion
    el: Αποκλεισμός άγνωστων εκτελέσιμων με βάση τη διάδοση, την ηλικία ή λίστα εμπιστοσύνης
    what: Σταματά εκτελέσιμα που είναι σπάνια, πολύ καινούργια και δεν είναι σε λίστα εμπιστοσύνης, με βάση το cloud της Microsoft.
    phase: "3"
    warn: true
    ah: [AsrUntrustedExecutableAudited, AsrUntrustedExecutableBlocked]
    note: Χρειάζεται cloud-delivered protection. Είναι ο κανόνας με τα περισσότερα false positives σε εσωτερικές εφαρμογές και εργαλεία IT.
  - guid: d1e49aac-8f56-4280-b9ba-993a6d77406c
    name: Block process creations originating from PSExec and WMI commands
    el: Αποκλεισμός διεργασιών από PsExec και WMI
    what: Σταματά προγράμματα που ξεκινούν απομακρυσμένα μέσω PsExec ή WMI, έναν από τους πιο συνηθισμένους τρόπους πλευρικής κίνησης στο δίκτυο.
    phase: "3"
    warn: true
    ah: [AsrPsexecWmiChildProcessAudited, AsrPsexecWmiChildProcessBlocked]
    note: Αν χρησιμοποιείς Configuration Manager, μην τον ενεργοποιείς με άλλο τρόπο, γιατί ο client του βασίζεται στο WMI. Μπορεί να επηρεάσει και εργαλεία απομακρυσμένης διαχείρισης.
  - guid: c1db55ab-c21a-4637-bb3f-a12568109d35
    name: Use advanced protection against ransomware
    el: Προηγμένη προστασία από ransomware
    what: Σταματά αρχεία που μοιάζουν με ransomware, με βάση ευρετικούς ελέγχους στον υπολογιστή και στο cloud. Μπλοκάρει και αρχεία που δεν έχουν ακόμα θετική φήμη.
    phase: "3"
    warn: true
    ah: [AsrRansomwareAudited, AsrRansomwareBlocked]
    note: Χρειάζεται cloud-delivered protection. Ένα νέο, άγνωστο αρχείο μπορεί να μπλοκαριστεί για λίγο, μέχρι να αποκτήσει φήμη.
  - guid: a8f5898e-1dc8-49a9-9878-85004b8a61e6
    name: Block Webshell creation for Servers
    el: Αποκλεισμός web shells σε servers
    what: Σταματά τη δημιουργία web shell scripts σε Windows servers με Microsoft Exchange, με τα οποία ο επιτιθέμενος ελέγχει τον server απομακρυσμένα.
    phase: server
    warn: true
    ah: []
    note: Αφορά μόνο Exchange servers. Αν τον διαχειρίζεσαι από το Defender for Endpoint, άφησέ τον Not configured στο Group Policy, αλλιώς οι ρυθμίσεις συγκρούονται.
