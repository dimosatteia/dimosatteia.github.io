- number: 24
  title: Χρήση των ευρωπαϊκών συστημάτων πιστοποίησης της κυβερνοασφάλειας
  requirements:
  - code: '24.1'
    scope: Βασικές και σημαντικές
    requirement: Για την απόδειξη της συμμόρφωσης με το άρθρο 21, τα κράτη μέλη μπορούν να απαιτούν τη χρήση προϊόντων, υπηρεσιών και διαδικασιών ΤΠΕ που έχουν πιστοποιηθεί στο πλαίσιο ευρωπαϊκών συστημάτων πιστοποίησης κυβερνοασφάλειας του κανονισμού (ΕΕ) 2019/881. Ενθαρρύνεται επίσης η χρήση αναγνωρισμένων υπηρεσιών εμπιστοσύνης.
    type: org
    control: Service Trust Portal για τα πιστοποιητικά και τις εκθέσεις ελέγχου των υπηρεσιών της Microsoft. Το Microsoft Purview Compliance Manager δείχνει ποια controls καλύπτει η Microsoft ως πάροχος (Microsoft managed controls).
    evidence: 'Πιστοποιητικά και εκθέσεις ελέγχου της Microsoft από το Service Trust Portal. Compliance Manager: κατάλογος Microsoft managed controls.'
    comment: Το άρθρο αφορά προϊόντα και υπηρεσίες πιστοποιημένα με ευρωπαϊκά συστήματα του κανονισμού (ΕΕ) 2019/881. Το Compliance Manager είναι αυτοαξιολόγηση και δεν αποτελεί πιστοποίηση. Η υποχρέωση ισχύει μόνο αν την επιβάλει το κράτος μέλος ή κατ' εξουσιοδότηση πράξη της Επιτροπής.
    posts:
    - *id006
    - *id015
    - *id007
- number: 25
  title: Τυποποίηση
  requirements:
  - code: '25.1'
    scope: Βασικές και σημαντικές
    requirement: Για τη συγκλίνουσα εφαρμογή του άρθρου 21, ενθαρρύνεται η χρήση ευρωπαϊκών και διεθνώς αποδεκτών προτύπων και τεχνικών προδιαγραφών σχετικών με την ασφάλεια συστημάτων δικτύου και πληροφοριών, χωρίς να επιβάλλεται ή να ευνοείται συγκεκριμένο είδος τεχνολογίας.
    type: mixed
    control: Microsoft Purview Compliance Manager με έτοιμα assessments για διεθνή πρότυπα (π.χ. ISO/IEC 27001, NIST CSF), που αντιστοιχίζουν τις ρυθμίσεις του tenant στα controls κάθε προτύπου. Microsoft Secure Score ως μετρήσιμη εικόνα της εφαρμογής των τεχνικών ρυθμίσεων που αντιστοιχούν σε αυτά τα controls.
    evidence: 'Compliance Manager: βαθμολογία ανά assessment και κατάσταση improvement actions ανά control του προτύπου. Secure Score: βαθμολογία και History.'
    license: Microsoft Purview Compliance Manager premium assessments (ανάλογα με το πρότυπο και την άδεια)
    comment: Το Secure Score δεν είναι πρότυπο και η βαθμολογία του δεν αποδεικνύει συμμόρφωση με κανένα πρότυπο. Το Compliance Manager δείχνει πρόοδο σε αυτοαξιολόγηση. Η πιστοποίηση κατά ISO/IEC 27001 δίνεται μόνο από διαπιστευμένο φορέα.
