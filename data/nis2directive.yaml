  label: Οργανωτικό ή εκτός Microsoft 365
  hint: Δεν υπάρχει ρύθμιση που να το καλύπτει
articles:
- number: 20
  title: Διακυβέρνηση
  requirements:
  - code: '20.1'
    scope: Βασικές και σημαντικές
    requirement: Τα όργανα διοίκησης εγκρίνουν τα μέτρα διαχείρισης κινδύνων κυβερνοασφάλειας του άρθρου 21, εποπτεύουν την εφαρμογή τους και μπορούν να θεωρηθούν υπεύθυνα για παραβάσεις.
    type: mixed
    control: Microsoft Purview Compliance Manager (assessment «NIS 2 Directive») ως μητρώο των μέτρων. Microsoft Secure Score ως μετρήσιμη βάση για την αναφορά προς τη διοίκηση.
    evidence: 'Απόφαση ή πρακτικό του οργάνου διοίκησης. Compliance Manager: βαθμολογία και κατάσταση improvement actions. Secure Score: History.'
    comment: Η έγκριση και η ευθύνη είναι οργανωτικό και νομικό ζήτημα. Η Microsoft δίνει μόνο τα στοιχεία πάνω στα οποία αποφασίζει η διοίκηση.
    kya:
    - 4
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: Τι κάνουν οι CISOs με το Microsoft Secure Score που δεν βλέπεις στα whitepapers
      url: /posts/microsoft-secure-score-grc-programma-ciso/
  - code: '20.2'
    scope: Βασικές και σημαντικές
    requirement: Τα μέλη των οργάνων διοίκησης παρακολουθούν κατάρτιση. Οι οντότητες ενθαρρύνονται να προσφέρουν παρόμοια κατάρτιση στους εργαζομένους τους σε τακτική βάση.
    type: mixed
    control: Attack simulation training στο Microsoft Defender for Office 365 Plan 2, με τα μέλη της διοίκησης ως ξεχωριστή ομάδα-στόχο.
    evidence: Αναφορές του Attack simulation training (ολοκλήρωση εκπαίδευσης ανά χρήστη). Βεβαιώσεις κατάρτισης των μελών της διοίκησης.
    license: Microsoft Defender for Office 365 Plan 2
    comment: Το Attack simulation training καλύπτει phishing και ευαισθητοποίηση. Η κατάρτιση της διοίκησης στην αξιολόγηση κινδύνων θέλει ξεχωριστό πρόγραμμα.
    kya:
    - 4
    - 21
    posts:
    - &id003
      title: 'Localized Mark and Notify στο Microsoft Defender for Office 365: Γιατί ένα notification email στη σωστή γλώσσα είναι θέμα Security Awareness (MC1387578)'
      url: /posts/generally-available/mdo-mark-and-notify-localization/
    - &id004
      title: 'Report a Call & Report a Meeting στο Microsoft Teams: Νέα δυνατότητα αναφοράς ασφαλείας για χρήστες και διαχειριστές'
      url: /posts/new-features/report-a-call-report-a-meeting-teams-security-reporting/
- number: 21
  title: Μέτρα διαχείρισης κινδύνων κυβερνοασφάλειας
  requirements:
  - code: '21.1'
    scope: Βασικές και σημαντικές
    requirement: Κατάλληλα και αναλογικά τεχνικά, επιχειρησιακά και οργανωτικά μέτρα για τη διαχείριση των κινδύνων, με βάση τις πλέον σύγχρονες πρακτικές, το κόστος, την έκθεση σε κινδύνους, το μέγεθος της οντότητας και τις επιπτώσεις των περιστατικών.
    type: mixed
    control: Microsoft Secure Score και Microsoft Security Exposure Management ως εικόνα της τρέχουσας έκθεσης. Microsoft Defender Vulnerability Management ως είσοδος στην εκτίμηση κινδύνων.
    evidence: 'Μητρώο κινδύνων και τεκμηρίωση της αναλογικότητας. Secure Score: βαθμολογία και τάση.'
    comment: Η κρίση για το τι είναι «αναλογικό» ανήκει στην οντότητα. Δεν προκύπτει από καμία βαθμολογία.
    kya:
    - 5
    posts:
    - &id001
      title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
    - &id002
      title: 'Microsoft Secure Score: Πρακτικός Οδηγός για τον ΥΑΣΠΕ NIS2'
      url: /posts/secure-score-defender-praktikos-odigos/
  - code: 21.2.α
    scope: Βασικές και σημαντικές
    requirement: Πολιτικές για την ανάλυση κινδύνου και την ασφάλεια των συστημάτων πληροφοριών.
    type: mixed
    control: Οι πολιτικές είναι έγγραφα. Το Compliance Manager τις συνδέει με improvement actions και το Secure Score δείχνει κατά πόσο εφαρμόζονται τεχνικά.
    evidence: 'Εγκεκριμένες πολιτικές. Compliance Manager: improvement actions με συνημμένα τεκμήρια.'
    kya:
    - 5
    - 6
    posts:
    - *id001
    - *id002
    - title: 'Microsoft Secure Score Part 1: How to Read a Recommendation'
      url: /posts/secure-score-grc-part-1-anatomy/
  - code: 21.2.β
    scope: Βασικές και σημαντικές
    requirement: Χειρισμός περιστατικών.
    type: tech
    control: Incidents queue του Microsoft Defender XDR με συσχέτιση alerts από endpoints, ταυτότητες, email και cloud apps. Automated investigation and response. Advanced hunting. Microsoft Sentinel για πηγές εκτός Microsoft και μεγαλύτερη διατήρηση.
    evidence: 'Defender XDR: ιστορικό incidents με ταξινόμηση, ανάθεση και χρόνους. Action center για τις ενέργειες αποκατάστασης.'
    license: Microsoft Sentinel (χρέωση με βάση τον όγκο δεδομένων)
    comment: Το πλάνο αντιμετώπισης περιστατικών και οι ρόλοι είναι έγγραφο της οντότητας.
    kya:
    - 24
    posts:
    - &id008
      title: 'Microsoft Defender AIR: Πώς το Automated Investigation & Response Αλλάζει το SOC (και τι γίνεται μετά την 1η Σεπτεμβρίου 2026)'
      url: /posts/microsoft-defender-air-automated-investigation-response/
    - &id009
      title: 'Defender XDR: Μία ενέργεια, όλοι οι λογαριασμοί, το unified response actions για ταυτότητες έρχεται τον Οκτώβριο, τι φέρνει το MC1461704'
      url: /posts/new-features/defender-xdr-unified-response-actions-identity-accounts/
    - &id010
      title: 'Live Webinar: Μάθε το Microsoft Defender XDR σε 60 λεπτά'
      url: /posts/microsoft-defender-xdr-full-tutorial-ciso/
  - code: 21.2.γ
    scope: Βασικές και σημαντικές
    requirement: Επιχειρησιακή συνέχεια, όπως διαχείριση αντιγράφων ασφαλείας και αποκατάσταση έπειτα από καταστροφή, και διαχείριση κρίσεων.
    type: mixed
    control: Microsoft 365 Backup για Exchange Online, SharePoint και OneDrive. Azure Backup και Azure Site Recovery για διακομιστές. Το retention και το versioning δεν αποτελούν αντίγραφο ασφαλείας.
    evidence: Αναφορές επιτυχών backup και δοκιμών επαναφοράς. Εγκεκριμένο σχέδιο επιχειρησιακής συνέχειας.
    license: Microsoft 365 Backup (χρέωση με βάση τη χρήση), Azure Backup, Azure Site Recovery
    comment: Το σχέδιο επιχειρησιακής συνέχειας και η διαχείριση κρίσεων δεν καλύπτονται από προϊόντα Microsoft.
    kya:
    - 25
  - code: 21.2.δ
    scope: Βασικές και σημαντικές
    requirement: Ασφάλεια της αλυσίδας εφοδιασμού, μαζί με τις σχέσεις της οντότητας με τους άμεσους προμηθευτές ή παρόχους υπηρεσιών της.
    type: mixed
    control: Cloud Discovery και risk score ανά εφαρμογή στο Microsoft Defender for Cloud Apps. Cross-tenant access settings, Conditional Access για external users και access reviews για guest accounts στο Entra ID.
    evidence: 'Defender for Cloud Apps: κατάλογος cloud εφαρμογών σε χρήση. Entra ID: ρυθμίσεις cross-tenant και αποτελέσματα access reviews.'
    license: Microsoft Entra ID P2 ή Microsoft Entra ID Governance (access reviews)
    comment: Οι συμβάσεις και η αξιολόγηση των προμηθευτών είναι οργανωτικά μέτρα.
    kya:
    - 12
    posts:
    - title: 'Live Webinar: Μάθε το Microsoft Defender XDR σε 60 λεπτά'
      url: /posts/microsoft-defender-xdr-full-tutorial-ciso/
    - &id006
      title: 'Allowed Agent Types στο Microsoft 365: Γιατί το «Only Certified External Publishers» είναι η μόνη λογική επιλογή'
      url: /posts/allowed-agent-types-only-certified-external-publishers/
    - &id007
      title: 'Global Secure Access MCP Firewall: Πώς βάζεις Zero Trust σε κάτι που δεν μπορούσες καν να δεις μέχρι χθες'
      url: /posts/gsa-mcp-firewall/
  - code: 21.2.ε
    scope: Βασικές και σημαντικές
    requirement: Ασφάλεια στην απόκτηση, ανάπτυξη και συντήρηση συστημάτων δικτύου και πληροφοριών, μαζί με τον χειρισμό και τη γνωστοποίηση ευπαθειών.
    type: mixed
    control: Microsoft Defender Vulnerability Management για εντοπισμό και ιεράρχηση ευπαθειών, με remediation requests προς το Intune. Update rings και security baselines στο Intune.
    evidence: 'Defender Vulnerability Management: exposure score, Weaknesses και κατάσταση remediation. Intune: αναφορές συμμόρφωσης ενημερώσεων.'
    license: Microsoft Defender for Cloud, GitHub Advanced Security (μόνο αν αναπτύσσετε λογισμικό)
    comment: Η ασφαλής ανάπτυξη λογισμικού δεν καλύπτεται από το Microsoft 365.
    kya:
    - 14
    - 15
    - 17
    posts:
    - title: 'Preview: Ο Vulnerability Remediation Agent στο Microsoft Intune'
      url: /posts/previews/vulnerability-remediation-agent-intune/
    - &id011
      title: 'Microsoft Entra Connect: Η προθεσμία της 30ής Σεπτεμβρίου 2026 που δεν είναι ένα ακόμα advisory'
      url: /posts/entra-connect-mandatory-upgrade-2026/
    - &id005
      title: 'Microsoft Entra Tenant Governance: Το «GA» που δεν είναι πλήρως GA, και γιατί αυτό έχει σημασία για το compliance σου'
      url: /posts/entra-tenant-governance-ga/
  - code: 21.2.στ
    scope: Βασικές και σημαντικές
    requirement: Πολιτικές και διαδικασίες για την αξιολόγηση της αποτελεσματικότητας των μέτρων διαχείρισης κινδύνων κυβερνοασφάλειας.
    type: mixed
    control: Secure Score (History και σύγκριση) και Compliance Manager ως συνεχής μέτρηση. Attack simulation training για τη μέτρηση της ανθρώπινης πλευράς.
    evidence: Εξαγωγές Secure Score και Compliance Manager ανά περίοδο. Εκθέσεις εσωτερικών και εξωτερικών ελέγχων.
    comment: Οι δοκιμές παρείσδυσης και οι ανεξάρτητοι έλεγχοι γίνονται από εξειδικευμένο ελεγκτή.
    kya:
    - 8
    - 9
    - 18
    posts:
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
  - code: 21.2.ζ
    scope: Βασικές και σημαντικές
    requirement: Βασικές πρακτικές κυβερνοϋγιεινής και κατάρτιση στην κυβερνοασφάλεια.
    type: mixed
    control: Security baselines, compliance policies και update rings στο Intune. Recommendations του Secure Score. Attack simulation training στο Microsoft Defender for Office 365 Plan 2.
    evidence: 'Intune: αναφορές συμμόρφωσης συσκευών. Secure Score: κατάσταση recommendations. Αναφορές εκπαίδευσης.'
    license: Microsoft Defender for Office 365 Plan 2
    kya:
    - 14
    - 21
    posts:
    - *id003
    - *id004
    - *id005
  - code: 21.2.η
    scope: Βασικές και σημαντικές
    requirement: Πολιτικές και διαδικασίες για τη χρήση κρυπτογραφίας και, κατά περίπτωση, κρυπτογράφησης.
    type: mixed
    control: BitLocker μέσω Intune. Sensitivity labels με κρυπτογράφηση και Message Encryption στο Microsoft Purview. TLS στις υπηρεσίες του Microsoft 365.
    evidence: 'Εγκεκριμένη πολιτική κρυπτογραφίας. Intune: encryption report. Purview: labels και πολιτικές δημοσίευσης.'
    comment: Οι διακομιστές και οι βάσεις δεδομένων άλλων κατασκευαστών δεν καλύπτονται από προϊόντα Microsoft.
    kya:
    - 22
    posts:
    - title: 'Secure Score AI-Readiness: Το TPM, το VBS, το HVCI και το LAPS σου δεν ήταν ποτέ απλά «τσεκαρίσματα», τι φέρνει το MC1466750'
      url: /posts/new-features/secure-score-ai-readiness-tpm-vbs-hvci-laps/
    - title: 'Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου'
      url: /posts/purview-autolabeling-500k-scale-increase/
    - title: 'Global Secure Access Μέρος 2: Το Microsoft traffic profile, η προεπιλεγμένη πύλη για Microsoft 365'
      url: /posts/global-secure-access/global-secure-access-meros-2-microsoft-traffic-profile/
  - code: 21.2.θ
    scope: Βασικές και σημαντικές
    requirement: Ασφάλεια ανθρώπινων πόρων, πολιτικές ελέγχου πρόσβασης και διαχείριση πάγιων στοιχείων.
    type: mixed
    control: Conditional Access, Privileged Identity Management και access reviews στο Entra ID. Device inventory στο Microsoft Defender for Endpoint και στο Intune, software inventory στο Defender Vulnerability Management.
    evidence: 'Entra ID: πολιτικές Conditional Access, αναθέσεις ρόλων και αποτελέσματα access reviews. Εξαγωγή device inventory.'
    license: Microsoft Entra ID P2 (Privileged Identity Management, access reviews)
    comment: Η ασφάλεια ανθρώπινων πόρων (έλεγχοι πρόσληψης, πειθαρχική διαδικασία) δεν καλύπτεται από ρύθμιση.
    kya:
    - 10
    - 11
    - 13
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: 'Microsoft Secure Score Part 1: How to Read a Recommendation'
      url: /posts/secure-score-grc-part-1-anatomy/
    - title: 'Live Webinar: Μάθε το Microsoft Defender XDR σε 60 λεπτά'
      url: /posts/microsoft-defender-xdr-full-tutorial-ciso/
  - code: 21.2.ι
    scope: Βασικές και σημαντικές
    requirement: Χρήση ελέγχου ταυτότητας πολλών παραγόντων ή συνεχούς ελέγχου ταυτότητας, ασφαλών φωνητικών επικοινωνιών, επικοινωνιών βίντεο και κειμένου και ασφαλών συστημάτων επικοινωνίας έκτακτης ανάγκης εντός της οντότητας, κατά περίπτωση.
    type: tech
    control: Conditional Access με «Require authentication strength» και passkeys. Continuous Access Evaluation στο Entra ID. Microsoft Teams για κρυπτογραφημένη φωνή, βίντεο και κείμενο.
    evidence: 'Entra ID: πολιτικές Conditional Access και Authentication methods activity. Sign-in logs με το αποτέλεσμα του MFA.'
    comment: Η επικοινωνία έκτακτης ανάγκης θέλει κανάλι που δεν εξαρτάται από το tenant. Αν το Entra ID ή το Teams δεν είναι διαθέσιμα, το Teams δεν μπορεί να είναι το εφεδρικό σας κανάλι.
    kya:
    - 13
    posts:
    - title: 'Τέλος στα SMS/Voice MFA: Η Microsoft κάνει τα Passkeys default στο Entra ID'
      url: /posts/passkeys-by-default-telos-sms-voice-mfa/
    - title: 'Global Secure Access Μέρος 5: Conditional Access σε βάθος, τρία παραδείγματα πολιτικών που δουλεύουν'
      url: /posts/global-secure-access/global-secure-access-meros-5-conditional-access/
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
  - code: '21.3'
    scope: Βασικές και σημαντικές
    requirement: Στην αξιολόγηση της αλυσίδας εφοδιασμού λαμβάνονται υπόψη οι ευπάθειες κάθε άμεσου προμηθευτή, η συνολική ποιότητα των προϊόντων και οι πρακτικές κυβερνοασφάλειας των προμηθευτών, μαζί με τις διαδικασίες ασφαλούς ανάπτυξης.
    type: mixed
    control: Risk score ανά cloud εφαρμογή στο Defender for Cloud Apps (πιστοποιήσεις, συμμόρφωση). Service Trust Portal για τις εκθέσεις ελέγχου της ίδιας της Microsoft ως προμηθευτή σας.
    evidence: Φάκελος αξιολόγησης ανά προμηθευτή. Εκθέσεις SOC 2 και ISO 27001 της Microsoft από το Service Trust Portal.
    comment: Για προμηθευτές που δεν είναι cloud υπηρεσίες δεν υπάρχει εργαλείο Microsoft. Η αξιολόγηση γίνεται με ερωτηματολόγια και συμβατικούς όρους.
    kya:
    - 12
    posts:
    - *id006
    - title: 'Live Webinar: Μάθε το Microsoft Defender XDR σε 60 λεπτά'
      url: /posts/microsoft-defender-xdr-full-tutorial-ciso/
    - *id007
  - code: '21.4'
    scope: Βασικές και σημαντικές
    requirement: Όταν η οντότητα διαπιστώνει ότι δεν συμμορφώνεται με τα μέτρα, λαμβάνει χωρίς αδικαιολόγητη καθυστέρηση όλα τα αναγκαία διορθωτικά μέτρα.
    type: mixed
    control: Recommendations του Secure Score με κατάσταση και action plan. Remediation requests στο Defender Vulnerability Management. Improvement actions στο Compliance Manager με υπεύθυνο και ημερομηνία.
    evidence: Ιστορικό αλλαγών κατάστασης στα recommendations και στα improvement actions, ως απόδειξη ότι τα ευρήματα κλείνουν.
    kya:
    - 9
    - 18
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
- number: 23
  title: Υποχρεώσεις υποβολής αναφορών
  requirements:
  - code: '23.1'
    scope: Βασικές και σημαντικές
    requirement: Κοινοποίηση στο CSIRT ή στην αρμόδια αρχή, χωρίς αδικαιολόγητη καθυστέρηση, κάθε περιστατικού με σημαντικό αντίκτυπο στην παροχή των υπηρεσιών. Όπου αρμόζει, ενημέρωση και των αποδεκτών των υπηρεσιών.
    type: mixed
    control: Ο εντοπισμός και η ταξινόμηση γίνονται στο incidents queue του Microsoft Defender XDR (severity, classification, επηρεαζόμενα assets). Email notifications για incidents υψηλής σοβαρότητας.
    evidence: 'Defender XDR: εγγραφή του incident με χρόνο πρώτης δραστηριότητας και χρόνο δημιουργίας. Αντίγραφο της κοινοποίησης.'
    comment: Η υποβολή γίνεται από την οντότητα προς το CSIRT ή την αρμόδια αρχή. Κανένα προϊόν Microsoft δεν την κάνει για εσάς.
    kya:
    - 24
    posts:
    - *id008
    - *id009
    - *id010
  - code: '23.2'
    scope: Βασικές και σημαντικές
    requirement: Ενημέρωση, χωρίς αδικαιολόγητη καθυστέρηση, των αποδεκτών των υπηρεσιών που ενδέχεται να επηρεαστούν από σημαντική κυβερνοαπειλή, για τα μέτρα που μπορούν να λάβουν.
    type: mixed
    control: Threat analytics στο Microsoft Defender XDR για το αν μια ενεργή απειλή αφορά το περιβάλλον σας και ποια assets εκθέτει.
    evidence: 'Threat analytics: αναφορά με τα εκτεθειμένα assets. Αντίγραφο της ενημέρωσης προς τους αποδέκτες.'
    comment: Η ενημέρωση των πελατών είναι οργανωτική διαδικασία.
    kya:
    - 24
    posts:
    - title: 'Preview: Ο Vulnerability Remediation Agent στο Microsoft Intune'
      url: /posts/previews/vulnerability-remediation-agent-intune/
    - *id011
  - code: 23.4.α
    scope: Βασικές και σημαντικές
    requirement: Έγκαιρη προειδοποίηση εντός 24 ωρών από τη στιγμή που η οντότητα αντιλήφθηκε το σημαντικό περιστατικό, με ένδειξη αν υπάρχει υποψία παράνομης ή κακόβουλης ενέργειας ή διασυνοριακού αντικτύπου.
    type: mixed
    control: Το incident στο Defender XDR δίνει τον χρόνο εντοπισμού, από τον οποίο μετρά το 24ωρο, και το attack story για την πρώτη εκτίμηση κακόβουλης ενέργειας.
    evidence: 'Defender XDR: χρονικές σημάνσεις του incident. Αντίγραφο της έγκαιρης προειδοποίησης με ώρα υποβολής.'
    comment: Η υποβολή γίνεται από την οντότητα προς το CSIRT ή την αρμόδια αρχή. Κανένα προϊόν Microsoft δεν την κάνει για εσάς.
    kya:
    - 24
    posts:
    - *id008
