# Αντιστοίχιση Οδηγίας (ΕΕ) 2022/2555 (NIS2), άρθρα 20, 21 και 23 -> Microsoft -> ΚΥΑ 1689/2025 -> άρθρα thecybersec.gr
# Παράγεται από script. Η σελίδα /nis2/ διαβάζει αυτό το αρχείο. kya: άρθρα της ΚΥΑ 1689/2025 που εξειδικεύουν την απαίτηση.
source:
  act: Οδηγία (ΕΕ) 2022/2555 (NIS2)
  title: Μέτρα για υψηλό κοινό επίπεδο κυβερνοασφάλειας σε ολόκληρη την Ένωση
  fek: ΕΕ L 333 της 27.12.2022
  url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:32022L2555
  of: της Οδηγίας
updated: '2026-10-02'
types:
- key: tech
  label: Τεχνικό
  hint: Υλοποιείται κυρίως με ρύθμιση
- key: mixed
  label: Μικτό
  hint: Έγγραφο ή διαδικασία, με τεχνική επιβολή ή τεκμήριο από τη Microsoft
