# data/versions.yaml
# Σελίδα «Εκδόσεις» (/ekdoseis/). Κάθε προϊόν: η νεότερη έκδοση ΠΡΩΤΗ.
# date: yyyy-mm-dd (για ταξινόμηση). Κενό όταν η Microsoft δεν δίνει ημερομηνία.
# delivery: auto (αυτόματη ενημέρωση) | wu-restart (Windows Update, με restart) | hotpatch (Windows Update, χωρίς restart) | manual (μόνο χειροκίνητη λήψη) | mixed (λήψη, auto-upgrade μόνο σε επιλεγμένες εκδόσεις) | gallery (PowerShell Gallery) | portal (νέα έκδοση στο admin center)
# date: πλήρης (yyyy-mm-dd), μόνο μήνας (yyyy-mm) ή κενό
# Last verified: 12/11/2026

categories:
  - id: agents
    name: "Agents, sensors και connectors"
  - id: clients
    name: "Clients"
  - id: platform
    name: "Platform και engine updates"
  - id: powershell
    name: "PowerShell modules"
  - id: windows
    name: "Windows updates"
  - id: baselines
    name: "Security baselines"

products:

  - id: private-network-connector
    category: agents
    name: "Microsoft Entra private network connector"
    source: "https://learn.microsoft.com/en-us/entra/global-secure-access/reference-version-history"
    releases:
      - version: "1.5.5130.0"
        date: "2026-11-09"
        delivery: manual
        summary: >-
          Ιστορικό 24 ωρών για CPU και μνήμη, καλύτερη αναφορά υγείας, υποστήριξη DNS suffix
          ανά interface, rotation στα trace files, TCP keepalive και ενισχυμένη προστασία των
          τοπικών logs. Δεν έρχεται με auto-update: το κατεβάζεις από το Microsoft Entra admin center.
      - version: "1.5.4892.0"
        date: "2026-06-08"
        delivery: manual
        summary: >-
          Νέο diagnostics tool στο system tray, logs στο Windows Event Viewer και διόρθωση
          σε WebSocket leaks που μπορούσαν να εξαντλήσουν τα ports.

  - id: mdi-sensor
    category: agents
    name: "Microsoft Defender for Identity sensor"
    source: "https://learn.microsoft.com/en-us/defender-for-identity/whats-new"
    releases:
      - version: "2.255.19347.63719"
        date: "2026-08"          # η Microsoft δίνει μόνο μήνα
        delivery: auto
        summary: >-
          Βελτιώσεις ασφάλειας.
      - version: "2.255.19295.47272"
        date: "2026-07"
        delivery: auto
        summary: >-
          Υποστήριξη νέου Event Tracing for Windows (ETW) provider και άλλες βελτιώσεις.

  - id: entra-connect-sync
    category: agents
    name: "Microsoft Entra Connect Sync"
    source: "https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/reference-connect-version-history"
    releases:
      - version: "2.6.92.0"
        date: "2026-09-23"
        delivery: manual
        summary: >-
          Hotfix με security fixes. Διορθώνει την αποτυχία εγγραφής του Pass-through
          Authentication agent που είχε η 2.6.91.0. Η Microsoft προτείνει αναβάθμιση το
          συντομότερο. Προσοχή: έως 07/04/2027 χρειάζεσαι 2.6.84.0 ή νεότερη με
          application-based authentication, αλλιώς σταματά ο συγχρονισμός.
      - version: "2.6.91.0"
        date: "2026-09-16"
        delivery: manual
        summary: >-
          Guided migration από Connect Sync σε Cloud Sync, phishing-resistant authentication
          (passkeys, FIDO2) στον wizard ως προεπιλογή, νέα Microsoft Graph permissions και
          διορθώσεις ευπαθειών σε third-party βιβλιοθήκες.

  - id: entra-cloud-sync
    category: agents
    name: "Microsoft Entra Cloud Sync (provisioning agent)"
    source: "https://learn.microsoft.com/en-us/entra/identity/hybrid/cloud-sync/reference-version-history"
    releases:
      - version: "1.1.2507.0"
        date: "2026-10-08"
        delivery: mixed
        summary: >-
          Διορθώνει την αποτυχία εγκατάστασης (σφάλμα 0x80070643) σε Windows Server με τοπική
          γλώσσα, όπως Polish, German και Dutch.
      - version: "1.1.2505.0"
        date: "2026-09-21"
        delivery: mixed
        summary: >-
          Δεν απαιτεί πλέον Domain Admin όταν δίνεις δικό σου gMSA, αφαιρέθηκε το cmdlet
          Repair-AADCloudSyncToolsAccount και υπάρχει πρόσθετο hardening στον συγχρονισμό.

  - id: gsa-client-windows
    category: clients
    name: "Global Secure Access client για Windows"
    source: "https://learn.microsoft.com/en-us/entra/global-secure-access/reference-windows-client-release-history"
    releases:
      - version: "2.34.222"
        date: ""                 # η Microsoft δεν δίνει ημερομηνία
        delivery: manual
        summary: >-
          Web sign-in για Windows, sign-in frequency του Conditional Access για εφαρμογές
          Private Access (σταδιακή διάθεση) και το «Prefer local network» περιορίζεται σε
          ιδιωτικές περιοχές IP. Από τον Νοέμβριο 2026 ο client αναβαθμίζεται και μέσω
          Windows Update (από 2.31.125 για x64, 2.32.294 για Arm).
      - version: "2.32.294"
        date: "2026-08-26"
        delivery: manual
        summary: >-
          Νέα επιλογή «Prefer local network» όταν το τοπικό subnet επικαλύπτεται με private
          εφαρμογές, ταχύτερη δημιουργία tunnels και .NET Runtime 10.0.9.

  - id: mdav-platform
    category: platform
    name: "Microsoft Defender Antivirus (platform και engine)"
    source: "https://learn.microsoft.com/en-us/defender-endpoint/microsoft-defender-endpoint-releases#microsoft-defender-antivirus-releases"
    releases:
      - version: "Platform 4.18.26100.4 / Engine 1.1.26100.4"
        date: "2026-10-27"
        delivery: auto
        summary: >-
          Μικρότερη χρήση CPU μετά από full scan, οι συσκευές με Defender for Endpoint
          security settings management αναγνωρίζονται ως managed και ολοκληρώθηκε η διάθεση
          του Clipboard Protection.
      - version: "Platform 4.18.26090.9 / Engine 1.1.26090.9"
        date: "2026-10-12"
        delivery: auto
        summary: >-
          Αυτόματη ανανέωση του protection engine όταν αλλάζει το license tier της συσκευής.

  - id: graph-powershell
    category: powershell
    name: "Microsoft Graph PowerShell SDK"
    source: "https://www.powershellgallery.com/packages/Microsoft.Graph"
    releases:
      - version: "2.41.2"
        date: "2026-10-14"
        delivery: gallery
        summary: >-
          Ενημέρωσε με Update-Module Microsoft.Graph.
      - version: "2.41.1"
        date: "2026-10-05"
        delivery: gallery
        summary: ""

  - id: entra-powershell
    category: powershell
    name: "Microsoft Entra PowerShell"
    source: "https://www.powershellgallery.com/packages/Microsoft.Entra"
    releases:
      - version: "1.3.0"
        date: "2026-05-18"
        delivery: gallery
        summary: >-
          Ενημέρωσε με Update-Module Microsoft.Entra.

  - id: exo-powershell
    category: powershell
    name: "Exchange Online PowerShell (ExchangeOnlineManagement)"
    source: "https://www.powershellgallery.com/packages/ExchangeOnlineManagement"
    releases:
      - version: "3.11.1"
        date: "2026-11-11"
        delivery: gallery
        summary: >-
          Ενημέρωσε με Update-Module ExchangeOnlineManagement.
      - version: "3.10.1"
        date: "2026-07-24"
        delivery: gallery
        summary: ""

  - id: windows11-lcu
    category: windows
    name: "Windows 11 24H2, 25H2, 26H2: μηνιαίο security update"
    source: "https://support.microsoft.com/en-us/servicing/os/windows-11/2026/09/windows-11-version-26h2-update-history"
    releases:
      - version: "KB5132061 (builds 26300.9974, 26200.9974, 26100.9974)"
        date: "2026-11-10"
        delivery: wu-restart
        summary: >-
          Το security update του Patch Tuesday Νοεμβρίου. Ενεργοποιεί από προεπιλογή το NTLM
          message signing για μη ανώνυμες συνδέσεις. Κάνει αυστηρότερο τον έλεγχο UTF-8 στην
          υπογραφή PowerShell scripts: αν ένα υπογεγραμμένο script αποτύχει, το αποθηκεύεις ως
          UTF-8 με BOM και το υπογράφεις ξανά. Στην 24H2 αφορά μόνο Enterprise και Education.
      - version: "KB5127648 (builds 26300.9711, 26200.9711, 26100.9711)"
        date: "2026-10-13"
        delivery: wu-restart
        summary: >-
          Αλλάζει την προεπιλογή του NTLMv1 SSO σε Enforce, που μπορεί να επηρεάσει Wi-Fi,
          Ethernet και VPN με MS-CHAPv2 σε συσκευές χωρίς Credential Guard. Ήταν το τελευταίο
          μηνιαίο security update για 24H2 Home και Pro.

  - id: windows11-hotpatch
    category: windows
    name: "Windows 11: Hotpatch (Windows Autopatch)"
    source: "https://learn.microsoft.com/windows/release-health/windows11-release-information#windows-11-hotpatch-calendar"
    releases:
      - version: "KB5132043 (builds 26300.9911, 26200.9911, 26100.9911)"
        date: "2026-11-10"
        delivery: hotpatch
        summary: >-
          Τα security fixes του Νοεμβρίου χωρίς restart, για 24H2, 25H2 και 26H2. Χρειάζεται
          εγκατεστημένο το baseline KB5127648 του Οκτωβρίου. Έρχεται μόνο από Windows Update,
          όχι από WSUS ή το Microsoft Update Catalog. Ο Δεκέμβριος είναι επίσης μήνας hotpatch.
      - version: "KB5127648 (baseline)"
        date: "2026-10-13"
        delivery: wu-restart
        summary: >-
          Το baseline του τριμήνου, με restart. Πάνω σε αυτό εφαρμόζονται τα hotpatch του
          Νοεμβρίου και του Δεκεμβρίου.

