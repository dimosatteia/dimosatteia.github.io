# «Τι λέει αυτό το token;» (/ti-leei-auto-to-token/)
# Ελληνικές ερμηνείες για τα claims των tokens του Microsoft Entra ID, και πίνακες για ρόλους, εφαρμογές και δικαιώματα.
# Πηγές (ελέγχθηκαν 02/11/2026):
#   Access token claims reference: https://learn.microsoft.com/en-us/entra/identity-platform/access-token-claims-reference
#   ID token claims reference:     https://learn.microsoft.com/en-us/entra/identity-platform/id-token-claims-reference
#   Linkable identifiers:          https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-authentication-track-linkable-identifiers
#   Built-in roles (Template ID):  https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/permissions-reference
#   First-party apps:              https://learn.microsoft.com/en-us/power-platform/admin/apps-to-allow
#   Token lifetime και CAE:        https://learn.microsoft.com/en-us/entra/identity-platform/access-tokens#token-lifetime

# Ομάδες στον πίνακα των claims, με τη σειρά που εμφανίζονται
groups:
  who: Ποιος
  app: Ποια εφαρμογή και για ποιον πόρο
  auth: Πώς ταυτοποιήθηκε
  perm: Τι δικαιώματα έχει
  time: Πότε ισχύει
  link: Για τη διερεύνηση στα logs
  meta: Τεχνικά στοιχεία

# Header του JWT
header:
  typ: "Ο τύπος του token. Στο Entra ID είναι πάντα JWT."
  alg: "Ο αλγόριθμος της υπογραφής, συνήθως RS256."
  kid: "Ποιο κλειδί του Entra ID υπέγραψε το token. Με αυτό ο πόρος βρίσκει το δημόσιο κλειδί για τον έλεγχο της υπογραφής."
  x5t: "Ίδιο με το kid. Υπάρχει μόνο στα v1.0 tokens, για συμβατότητα."
  nonce: "Υπάρχει στα tokens για το Microsoft Graph. Σημαίνει ότι την υπογραφή την ελέγχει μόνο το Graph: δεν την επαληθεύεις εσύ, και δεν πρέπει."

# Payload: claim -> [ομάδα, ερμηνεία]
claims:
  name: [who, "Το εμφανιζόμενο όνομα του χρήστη. Μόνο για προβολή, γιατί αλλάζει."]
  given_name: [who, "Το μικρό όνομα του χρήστη."]
  family_name: [who, "Το επώνυμο του χρήστη."]
  upn: [who, "Το όνομα σύνδεσης του χρήστη (User Principal Name). Υπάρχει στα v1.0 tokens."]
  unique_name: [who, "Το όνομα σύνδεσης του χρήστη στα v1.0 tokens. Μόνο για προβολή."]
  preferred_username: [who, "Το όνομα σύνδεσης του χρήστη στα v2.0 tokens. Μόνο για προβολή, γιατί αλλάζει."]
  email: [who, "Η διεύθυνση email του χρήστη, αν υπάρχει."]
  oid: [who, "Το Object ID του χρήστη ή του service principal στο tenant. Δεν αλλάζει ποτέ. Με αυτό ψάχνεις τον λογαριασμό στο Entra ID και στα logs (UserId)."]
  sub: [who, "Αναγνωριστικό του χρήστη, μοναδικό ανά εφαρμογή. Ο ίδιος χρήστης έχει άλλο sub σε άλλη εφαρμογή. Για διερεύνηση χρησιμοποίησε το oid."]
  tid: [who, "Το Tenant ID του οργανισμού όπου έγινε η σύνδεση."]
  idp: [who, "Ποιος ταυτοποίησε τον χρήστη. Αν διαφέρει από το iss, ο χρήστης είναι guest από άλλο tenant ή προσωπικός λογαριασμός Microsoft."]
  acct: [who, "Τύπος λογαριασμού: 0 σημαίνει μέλος του tenant, 1 σημαίνει guest."]
  onprem_sid: [who, "Το SID του χρήστη στο on-premises Active Directory. Υπάρχει όταν ο λογαριασμός συγχρονίζεται από το AD."]
  ipaddr: [who, "Η διεύθυνση IP από την οποία ταυτοποιήθηκε ο χρήστης. Σύγκρινέ τη με τις IP του οργανισμού σου."]
  ctry: [who, "Η χώρα του χρήστη, όπως την ξέρει το Entra ID."]
  tenant_ctry: [who, "Η χώρα του tenant."]
  tenant_region_scope: [who, "Η περιοχή του tenant, π.χ. EU."]
  in_corp: [who, "Αν η σύνδεση έγινε από το εταιρικό δίκτυο, όπως το δηλώνει ο federation server."]

  aud: [app, "Για ποιον πόρο εκδόθηκε το token (audience): ποιο API θα το δεχτεί. Ένα token για το Microsoft Graph δεν περνά στο Exchange Online, και το αντίστροφο."]
  appid: [app, "Ποια εφαρμογή ζήτησε το token (client). Υπάρχει στα v1.0 tokens."]
  azp: [app, "Ποια εφαρμογή ζήτησε το token (client). Υπάρχει στα v2.0 tokens."]
  app_displayname: [app, "Το όνομα της εφαρμογής που ζήτησε το token."]
  appidacr: [app, "Πώς ταυτοποιήθηκε η εφαρμογή: 0 χωρίς μυστικό (public client, π.χ. εφαρμογή σε υπολογιστή ή κινητό), 1 με client secret, 2 με πιστοποιητικό."]
  azpacr: [app, "Πώς ταυτοποιήθηκε η εφαρμογή: 0 χωρίς μυστικό (public client), 1 με client secret, 2 με πιστοποιητικό."]
  idtyp: [app, "Τι είδους token είναι: user σημαίνει ότι η εφαρμογή ενεργεί για λογαριασμό χρήστη, app σημαίνει ότι ενεργεί η ίδια, χωρίς χρήστη."]

  amr: [auth, "Με ποιες μεθόδους ταυτοποιήθηκε ο χρήστης στη σύνδεση από την οποία προέρχεται το token."]
  acr: [auth, "Στα v1.0 tokens: 1 σημαίνει ότι η ταυτοποίηση καλύπτει το ISO/IEC 29115, 0 ότι δεν το καλύπτει."]
  acrs: [auth, "Τα Authentication Context (c1 έως c99) που ικανοποίησε ο χρήστης. Τα ορίζεις στο Conditional Access για ενέργειες που θέλουν επιπλέον έλεγχο."]
  deviceid: [auth, "Το Device ID της συσκευής στο Entra ID. Υπάρχει όταν η συσκευή είναι registered ή joined. Αν λείπει, το Entra ID δεν ήξερε από ποια συσκευή έγινε η σύνδεση."]
  xms_cc: [auth, "Η τιμή cp1 σημαίνει ότι η εφαρμογή ξέρει να χειριστεί claims challenge, άρα υποστηρίζει Continuous Access Evaluation (CAE)."]
  pwd_exp: [auth, "Πότε λήγει ο κωδικός του χρήστη."]
  pwd_url: [auth, "Πού αλλάζει ο χρήστης τον κωδικό του."]

  scp: [perm, "Τα δικαιώματα (delegated scopes) που πήρε η εφαρμογή για λογαριασμό του χρήστη. Η εφαρμογή δεν μπορεί να κάνει περισσότερα από όσα επιτρέπονται και στον ίδιο τον χρήστη."]
  roles: [perm, "Σε token εφαρμογής χωρίς χρήστη: τα application permissions, δηλαδή δικαιώματα σε επίπεδο οργανισμού. Σε token χρήστη: οι ρόλοι του χρήστη στη συγκεκριμένη εφαρμογή."]
  wids: [perm, "Οι ρόλοι του Entra ID που είχε ενεργούς ο χρήστης όταν εκδόθηκε το token. Οι επιλέξιμοι (eligible) ρόλοι του PIM εμφανίζονται μόνο αφού ενεργοποιηθούν."]
  groups: [perm, "Τα Object ID των ομάδων του χρήστη. Αν οι ομάδες είναι πάνω από 200, το Entra ID δεν τις βάζει στο token."]
  hasgroups: [perm, "Ο χρήστης ανήκει σε πολλές ομάδες, οπότε η εφαρμογή πρέπει να τις ζητήσει από το Microsoft Graph."]
  _claim_names: [perm, "Οι ομάδες του χρήστη δεν χώρεσαν στο token (group overage). Η εφαρμογή τις παίρνει από το Microsoft Graph."]
  _claim_sources: [perm, "Πού βρίσκει η εφαρμογή τις ομάδες που δεν χώρεσαν στο token."]

  iat: [time, "Πότε εκδόθηκε το token."]
  nbf: [time, "Από πότε ισχύει το token."]
  exp: [time, "Πότε λήγει το token. Μέχρι τότε, όποιος έχει το token μπορεί να το χρησιμοποιήσει, εκτός αν ο πόρος υποστηρίζει CAE και το ακυρώσει νωρίτερα."]
  auth_time: [time, "Πότε έγινε η ταυτοποίηση του χρήστη."]

  uti: [link, "Μοναδικό αναγνωριστικό του token. Στα sign-in logs είναι το Unique token identifier, στα Microsoft Graph activity logs το SignInActivityId. Με αυτό βρίσκεις τι έκανε αυτό το συγκεκριμένο token."]
  sid: [link, "Το αναγνωριστικό της συνεδρίας (Session ID). Όλα τα tokens που προήλθαν από την ίδια αρχική σύνδεση έχουν το ίδιο sid. Με αυτό βρίσκεις όλη τη δραστηριότητα της συνεδρίας."]

  iss: [meta, "Ποιος εξέδωσε το token. Περιέχει το Tenant ID. Αν τελειώνει σε /v2.0, το token είναι v2.0."]
  ver: [meta, "Η έκδοση του token, 1.0 ή 2.0."]
  aio: [meta, "Εσωτερικό claim του Entra ID. Δεν έχει σημασία για τη διερεύνηση."]
  rh: [meta, "Εσωτερικό claim του Entra ID. Δεν έχει σημασία για τη διερεύνηση."]
  nonce: [meta, "Τιμή που έστειλε η εφαρμογή στη σύνδεση. Υπάρχει στα ID tokens."]
  at_hash: [meta, "Hash του access token που εκδόθηκε μαζί. Υπάρχει στα ID tokens."]
  c_hash: [meta, "Hash του authorization code. Υπάρχει στα ID tokens."]
  xms_ftd: [meta, "Εσωτερικό claim του Entra ID. Δεν έχει σημασία για τη διερεύνηση."]
  xms_idrel: [meta, "Εσωτερικό claim του Entra ID. Δεν έχει σημασία για τη διερεύνηση."]
  xms_st: [meta, "Εσωτερικό claim του Entra ID. Δεν έχει σημασία για τη διερεύνηση."]
  xms_tcdt: [meta, "Πότε δημιουργήθηκε το tenant."]
  signin_state: [meta, "Πρόσθετες πληροφορίες για τη σύνδεση, π.χ. kmsi όταν ο χρήστης επέλεξε «Παραμονή σε σύνδεση», ή dvc_mngd και dvc_cmp για συσκευή υπό διαχείριση και συμβατή."]

# Τιμές του amr
amr:
  pwd: "Κωδικός πρόσβασης (ή client secret, για εφαρμογή)"
  rsa: "Απόδειξη με κλειδί RSA, π.χ. Microsoft Authenticator, Windows Hello for Business ή πιστοποιητικό"
  otp: "Κωδικός μίας χρήσης με email ή SMS"
  fed: "Ταυτοποίηση από federation, π.χ. AD FS ή άλλο IdP"
  wia: "Windows Integrated Authentication"
  mfa: "Πολυπαραγοντική ταυτοποίηση (MFA)"
  ngcmfa: "Ισοδύναμο με MFA, για εγγραφή προηγμένων διαπιστευτηρίων"
  wiaormfa: "Windows ή διαπιστευτήριο MFA"
  none: "Η ταυτοποίηση δεν ολοκληρώθηκε"

