# type: tech | mixed | org
source:
  act: ΚΥΑ 1689/2025
  title: Εθνικό Πλαίσιο Απαιτήσεων Κυβερνοασφάλειας Βασικών και Σημαντικών Οντοτήτων
  fek: ΦΕΚ Β΄ 2186/6.5.2025
  url: https://cyber.gov.gr/wp-content/uploads/2025/05/20250202186.pdf
updated: '2026-10-04'
types:
