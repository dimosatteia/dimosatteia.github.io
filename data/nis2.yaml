articles:
- number: 4
  title: Υποχρεώσεις και ευθύνη των ανωτάτων οργάνων διοίκησης
  requirements:
  - code: 4.α
    scope: Βασικές και σημαντικές
    requirement: Ολοκληρωμένο πρόγραμμα διαχείρισης κινδύνων κυβερνοασφάλειας, με ευθύνη του ανώτατου οργάνου διοίκησης.
    type: mixed
    control: Microsoft Purview Compliance Manager (assessment «NIS2 Directive (EU) 2022/2555») ως μητρώο του προγράμματος. Microsoft Secure Score ως μετρήσιμη τεχνική βάση.
    evidence: 'Απόφαση/πρακτικό ΔΣ για το πρόγραμμα. Compliance Manager: βαθμολογία και κατάσταση improvement actions.'
    license: Premium regulation του Compliance Manager για το NIS 2 (αγοράζεται ξεχωριστά, ή ως ένα από τα τρία δωρεάν premium regulations με Microsoft 365 E5)
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: Τι κάνουν οι CISOs με το Microsoft Secure Score που δεν βλέπεις στα whitepapers
      url: /posts/microsoft-secure-score-grc-programma-ciso/
  - code: 4.β
    scope: Βασικές και σημαντικές
    requirement: Το ανώτατο όργανο εγκρίνει και επιβλέπει το πρόγραμμα, διαθέτει πόρους, ενημερώνει το προσωπικό, λογοδοτεί και παρακολουθεί εκπαίδευση.
    type: mixed
    control: Αναφορά προς το ΔΣ με Secure Score και Compliance Manager. Attack simulation training και για τα μέλη της διοίκησης (περ. βε).
    evidence: Πρακτικά ΔΣ, εγκεκριμένος προϋπολογισμός, βεβαιώσεις εκπαίδευσης μελών ΔΣ.
    license: Microsoft Defender for Office 365 Plan 2 (Attack simulation training)
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: Τι κάνουν οι CISOs με το Microsoft Secure Score που δεν βλέπεις στα whitepapers
      url: /posts/microsoft-secure-score-grc-programma-ciso/
- number: 5
  title: Πλαίσιο διαχείρισης κινδύνων
  requirements:
  - code: 5.1.α
    scope: Βασικές και σημαντικές
    requirement: Πλαίσιο διαχείρισης κινδύνων κυβερνοασφάλειας, ευθυγραμμισμένο με τη διαχείριση επιχειρηματικών κινδύνων, με πρόβλεψη για τρίτα μέρη.
    type: org
    control: Δεν καλύπτεται από ρύθμιση. Το Microsoft 365 δίνει μόνο δεδομένα εισόδου (Secure Score, Exposure Management).
    evidence: Εγκεκριμένη μεθοδολογία διαχείρισης κινδύνων.
    license: Microsoft Defender for Endpoint Plan 2 (Microsoft 365 E5 ή αντίστοιχο)
  - code: 5.1.β
    scope: Βασικές και σημαντικές
    requirement: Περιοδική εκτίμηση κινδύνων (risk assessment) με μεθοδολογία βασισμένη σε διεθνή πρότυπα.
    type: mixed
    control: Microsoft Secure Score και Microsoft Defender Vulnerability Management ως τεχνική είσοδος στην εκτίμηση κινδύνων.
    evidence: 'Μητρώο κινδύνων. Secure Score: History και τάση βαθμολογίας.'
    license: Microsoft Defender for Endpoint Plan 2 ή Microsoft Defender Vulnerability Management standalone
    posts:
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
    - title: 'Microsoft Secure Score: Πρακτικός Οδηγός για τον ΥΑΣΠΕ NIS2'
      url: /posts/secure-score-defender-praktikos-odigos/
  - code: 5.1.γ
    scope: Βασικές και σημαντικές
    requirement: Πλάνο αντιμετώπισης κινδύνων (risk treatment plan) με κριτήρια προτεραιοποίησης.
    type: mixed
    control: Κατάσταση ανά recommendation στο Secure Score (To address, Planned, Risk accepted, Resolved through third party, Resolved through alternate mitigation) ως το τεχνικό σκέλος του πλάνου.
    evidence: 'Secure Score: Recommended actions με status και σημειώσεις. Εγκεκριμένο risk treatment plan.'
    posts:
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
    - title: 'Microsoft Secure Score Part 1: How to Read a Recommendation'
      url: /posts/secure-score-grc-part-1-anatomy/
  - code: 5.1.δ
    scope: Βασικές και σημαντικές
    requirement: Αξιολόγηση και επικαιροποίηση εκτίμησης και πλάνου σε προγραμματισμένα διαστήματα και μετά από σοβαρά περιστατικά ή αλλαγές.
    type: mixed
    control: Secure Score History και Compliance Manager για την τεκμηρίωση της περιοδικής επανεξέτασης.
    evidence: Ημερολόγιο αναθεωρήσεων, εκδόσεις μητρώου κινδύνων.
    posts:
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
  - code: '5.2'
    scope: Μόνο βασικές
    requirement: Εμπεριστατωμένη εκτίμηση κινδύνων με cyber threat intelligence και πλήρη αξιολόγηση ευπαθειών.
    type: mixed
    control: Threat analytics στο Microsoft Defender XDR για threat intelligence. Microsoft Defender Vulnerability Management για την αξιολόγηση ευπαθειών.
    evidence: 'Defender portal: Threat analytics, Vulnerability management (Weaknesses, Recommendations).'
    license: Microsoft Defender for Endpoint Plan 2 (περιλαμβάνεται στο Microsoft 365 E5). Εναλλακτικά Microsoft Defender Vulnerability Management standalone για την αξιολόγηση ευπαθειών.
    posts:
    - title: 'Preview: Ο Vulnerability Remediation Agent στο Microsoft Intune'
      url: /posts/previews/vulnerability-remediation-agent-intune/
    - title: Η Οικογένεια Προϊόντων του Microsoft Defender με πρακτικό Οδηγό για νέους επαγγελματίες ασφάλειας & ΥΑΣΠΕ
      url: /posts/microsoft-defender-oikogeneia-praktikos-odigos/
- number: 6
  title: Πολιτικές και διαδικασίες ασφάλειας πληροφοριών
  requirements:
  - code: 6.α
    scope: Βασικές και σημαντικές
    requirement: Γραπτή γενική πολιτική ασφάλειας πληροφοριών, εγκεκριμένη από το ανώτατο όργανο διοίκησης.
    type: org
    control: Δεν καλύπτεται από ρύθμιση. SharePoint Online για ελεγχόμενη διανομή και ιστορικό εκδόσεων του εγγράφου.
    evidence: Εγκεκριμένη πολιτική με αριθμό έκδοσης και ημερομηνία.
  - code: 6.β
    scope: Βασικές και σημαντικές
    requirement: Έντεκα ελάχιστες θεματικές πολιτικές (πρόσβαση, αγαθά, ορθή χρήση, αφαιρούμενα μέσα, περιστατικά, εφοδιαστική αλυσίδα, δίκτυα, έλεγχοι, αντίγραφα ασφαλείας, κρυπτογράφηση, φυσική ασφάλεια).
    type: org
    control: Οι πολιτικές είναι έγγραφα. Η τεχνική εφαρμογή κάθε πολιτικής αντιστοιχίζεται στα άρθρα 11, 12, 13, 18, 19, 22, 23, 24 και 25 αυτού του πίνακα.
    evidence: Οι έντεκα εγκεκριμένες θεματικές πολιτικές.
  - code: 6.γ
    scope: Βασικές και σημαντικές
    requirement: Αξιολόγηση και επικαιροποίηση των πολιτικών σε προγραμματισμένα διαστήματα και μετά από σοβαρά περιστατικά ή αλλαγές.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Ιστορικό αναθεωρήσεων πολιτικών.
- number: 7
  title: Ρόλοι, αρμοδιότητες και εξουσίες
  requirements:
  - code: 7.α
    scope: Βασικές και σημαντικές
    requirement: Ορισμός αρμοδιοτήτων και εξουσιών κυβερνοασφάλειας σε ρόλους, και ορισμός Υ.Α.Σ.Π.Ε.
    type: mixed
    control: Microsoft Entra ID roles (π.χ. Security Administrator, Security Reader, Compliance Administrator) ως τεχνική αποτύπωση των ρόλων.
    evidence: 'Απόφαση ορισμού Υ.Α.Σ.Π.Ε. Entra admin center: Roles and administrators (assignments).'
    posts:
    - title: 'Microsoft Secure Score: Πρακτικός Οδηγός για τον ΥΑΣΠΕ NIS2'
      url: /posts/secure-score-defender-praktikos-odigos/
  - code: 7.β
    scope: Βασικές και σημαντικές
    requirement: Ο Υ.Α.Σ.Π.Ε. αναφέρεται απευθείας στο ανώτατο όργανο διοίκησης.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Οργανόγραμμα, γραμμή αναφοράς, αναφορές Υ.Α.Σ.Π.Ε. προς το ΔΣ.
  - code: 7.γ
    scope: Βασικές και σημαντικές
    requirement: Περιοδική αξιολόγηση και επικαιροποίηση ρόλων, αρμοδιοτήτων και εξουσιών.
    type: mixed
    control: Access reviews για τις αναθέσεις ρόλων (Microsoft Entra ID Governance).
    evidence: Αποτελέσματα access reviews, πρακτικά αναθεώρησης ρόλων.
    license: Microsoft Entra ID Governance ή Microsoft Entra ID P2
- number: 8
  title: Ανεξάρτητος έλεγχος ασφάλειας πληροφοριών
  requirements:
  - code: 8.α
    scope: Μόνο βασικές
    requirement: Περιοδικοί ανεξάρτητοι έλεγχοι (independent audits) του προγράμματος ασφάλειας πληροφοριών.
    type: mixed
    control: Πρόσβαση μόνο για ανάγνωση στον ελεγκτή (Global Reader, Security Reader) και dashboard τεκμηρίων από Secure Score μέσω Microsoft Graph και Power BI.
    evidence: Εκθέσεις ελέγχου. Power BI dashboard με ιστορικό Secure Score.
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
  - code: 8.β
    scope: Μόνο βασικές
    requirement: Διασφάλιση αμεροληψίας των ελεγκτών.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Δήλωση ανεξαρτησίας ελεγκτή.
  - code: 8.γ
    scope: Μόνο βασικές
    requirement: Διορθωτικές ενέργειες από το ανώτατο όργανο όταν ο έλεγχος δείξει ανεπάρκεια.
    type: mixed
    control: Παρακολούθηση των τεχνικών διορθωτικών ενεργειών ως recommendations στο Secure Score και improvement actions στο Compliance Manager.
    evidence: Πλάνο διορθωτικών ενεργειών με κατάσταση και ημερομηνίες.
    posts:
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
  - code: 8.δ
    scope: Μόνο βασικές
    requirement: Έλεγχοι σε προγραμματισμένα διαστήματα και μετά από σοβαρά περιστατικά ή αλλαγές.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Πρόγραμμα ελέγχων.
- number: 9
  title: Διαδικασίες παρακολούθησης της συμμόρφωσης
  requirements:
  - code: 9.α
    scope: Βασικές και σημαντικές
    requirement: Διαδικασίες παρακολούθησης της συμμόρφωσης με τις κανονιστικές υποχρεώσεις και περιοδική αναφορά στο ανώτατο όργανο.
    type: mixed
    control: Microsoft Purview Compliance Manager με τα assessments «NIS2 Directive (EU) 2022/2555» και «ISO/IEC 27001:2022», συνδεδεμένα με το Secure Score.
    evidence: 'Compliance Manager: assessment score και εξαγωγή αναφοράς. Αναφορά προς το ΔΣ.'
    license: Premium regulations του Compliance Manager για NIS 2 και ISO/IEC 27001:2022 (αγοράζονται ξεχωριστά, ή ως δύο από τα τρία δωρεάν premium regulations με Microsoft 365 E5)
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
  - code: 9.β
    scope: Βασικές και σημαντικές
    requirement: Διορθωτικές ενέργειες σε περίπτωση μη συμμόρφωσης.
    type: mixed
    control: Ανάθεση improvement actions σε υπευθύνους στο Compliance Manager.
    evidence: Κατάσταση improvement actions με υπεύθυνο και ημερομηνία.
    posts:
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
  - code: 9.γ
    scope: Βασικές και σημαντικές
    requirement: Παρακολούθηση σε προγραμματισμένα διαστήματα και όταν αλλάζει το κανονιστικό πλαίσιο ή οι λειτουργίες.
    type: mixed
    control: Το Compliance Manager ειδοποιεί όταν η Microsoft αναθεωρεί ένα template, ώστε να ενημερωθεί το assessment.
    evidence: Ημερολόγιο αναθεωρήσεων συμμόρφωσης.
    posts:
    - title: 'Microsoft Secure Score Part 3: Daily Operations & ISO 27001'
      url: /posts/secure-score-grc-part-3-operations/
- number: 10
  title: Ασφάλεια ανθρώπινου δυναμικού
  requirements:
  - code: 10.1.α
    scope: Βασικές και σημαντικές
    requirement: Έλεγχοι καταλληλότητας του υποψήφιου προσωπικού.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Διαδικασία HR, αρχεία προσλήψεων.
  - code: 10.1.β
    scope: Βασικές και σημαντικές
    requirement: Ευθύνες και καθήκοντα που παραμένουν μετά τη λήξη ή αλλαγή της απασχόλησης.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Όροι σύμβασης, ρήτρες εμπιστευτικότητας.
  - code: 10.1.γ
    scope: Βασικές και σημαντικές
    requirement: Διαδικασίες πειθαρχικού ελέγχου για παραβίαση των πολιτικών ασφάλειας.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Πειθαρχική διαδικασία.
  - code: '10.2'
    scope: Μόνο βασικές
    requirement: Επαλήθευση ιστορικού (background checks) για προσωπικό με ρόλους κυβερνοασφάλειας.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Αρχεία ελέγχου ιστορικού.
- number: 11
  title: Διαχείριση υλικού και λογισμικού
  requirements:
  - code: 11.α
    scope: Βασικές και σημαντικές
    requirement: Ακριβής και ενημερωμένος κατάλογος αγαθών (υλικό, λογισμικό, συστήματα, δεδομένα, υπηρεσίες, cloud και OT), με ιδιοκτήτη ανά αγαθό.
    type: mixed
    control: Device inventory στο Microsoft Defender for Endpoint και στο Microsoft Intune. Software inventory στο Defender Vulnerability Management. Cloud Discovery στο Microsoft Defender for Cloud Apps για τις cloud υπηρεσίες. Τα αγαθά OT δεν καλύπτονται από το Microsoft 365. Καλύπτονται από το Microsoft Defender for IoT, που είναι ξεχωριστό προϊόν.
    evidence: 'Defender portal: Assets, Devices. Intune: Devices. Εξαγωγές καταλόγου.'
    license: Microsoft Defender for Endpoint Plan 2 ή Microsoft Defender Vulnerability Management standalone (software inventory, πλήρες device inventory). Microsoft Defender for IoT (για τα αγαθά OT).
    comment: Ο ορισμός ιδιοκτήτη (owner) ανά αγαθό δεν καλύπτεται από προϊόντα Microsoft. Τηρείται σε ξεχωριστό μητρώο αγαθών.
    posts:
    - title: 'Live Webinar: Μάθε το Microsoft Defender XDR σε 60 λεπτά'
      url: /posts/microsoft-defender-xdr-full-tutorial-ciso/
    - title: Η Οικογένεια Προϊόντων του Microsoft Defender με πρακτικό Οδηγό για νέους επαγγελματίες ασφάλειας & ΥΑΣΠΕ
      url: /posts/microsoft-defender-oikogeneia-praktikos-odigos/
    - title: 'Microsoft Defender Part 2: The Four Core XDR Workloads, Up Close'
      url: /posts/defender-demystified-series/defender-demystified-part-2-four-workloads/
    - title: 'Microsoft Defender for Endpoint: Τι είναι, τι κάνει και πώς να το αναπτύξετε στην πράξη'
      url: /posts/microsoft-defender-up-close-series/microsoft-defender-for-endpoint-deep-dive/
  - code: 11.β
    scope: Βασικές και σημαντικές
    requirement: Ταξινόμηση δεδομένων και αγαθών σε επίπεδα, με βάση εμπιστευτικότητα, ακεραιότητα και διαθεσιμότητα.
    type: tech
    control: Sensitivity labels στο Microsoft Purview Information Protection και auto-labeling. Critical asset management στο Microsoft Security Exposure Management για την κρισιμότητα συσκευών και ταυτοτήτων.
    evidence: 'Purview portal: Information protection, Labels και Label policies. Content explorer.'
    license: Microsoft 365 E5 ή Microsoft Purview Suite (auto-labeling και Content explorer). Microsoft Defender for Endpoint Plan 2 (Microsoft 365 E5 ή αντίστοιχο)
    posts:
    - title: 'Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου'
      url: /posts/purview-autolabeling-500k-scale-increase/
  - code: 11.γ
    scope: Βασικές και σημαντικές
    requirement: Γραπτή πολιτική και οδηγίες ορθής χρήσης αγαθών και δεδομένων σε όλο τον κύκλο ζωής.
    type: mixed
    control: Microsoft Purview Data Loss Prevention και retention policies (Data Lifecycle Management) για την τεχνική επιβολή. Retire και Wipe στο Intune για την ασφαλή απομάκρυνση.
    evidence: 'Εγκεκριμένη πολιτική. Purview: DLP policies και retention policies.'
    posts:
    - title: 'Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου'
      url: /posts/purview-autolabeling-500k-scale-increase/
  - code: 11.δ
    scope: Βασικές και σημαντικές
    requirement: Γραπτή πολιτική για την ασφαλή διαχείριση αφαιρούμενων μέσων αποθήκευσης.
    type: mixed
    control: Device control (removable storage access control) στο Defender for Endpoint μέσω Intune. BitLocker To Go για κρυπτογράφηση αφαιρούμενων μέσων.
    evidence: 'Εγκεκριμένη πολιτική. Intune: Endpoint security, Attack surface reduction, Device control.'
    planned: 'Άρθρο για το device control: έρχεται.'
- number: 12
  title: Διαχείριση κινδύνων από τις σχέσεις με προμηθευτές και παρόχους υπηρεσιών Τ.Π.Ε.
  requirements:
  - code: 12.1.α
    scope: Βασικές και σημαντικές
    requirement: Πολιτική και διαδικασίες για τις σχέσεις με προμηθευτές και παρόχους υπηρεσιών Τ.Π.Ε.
    type: org
    control: Δεν καλύπτεται από ρύθμιση.
    evidence: Εγκεκριμένη πολιτική ασφάλειας εφοδιαστικής αλυσίδας.
  - code: 12.1.β
    scope: Βασικές και σημαντικές
    requirement: Ενημερωμένος κατάλογος άμεσων προμηθευτών και παρόχων, με σημεία επαφής, προϊόντα/υπηρεσίες και ταξινόμηση κρισιμότητας.
    type: mixed
    control: Cloud Discovery και cloud app catalog στο Defender for Cloud Apps για να εντοπιστούν οι cloud πάροχοι που χρησιμοποιούνται πραγματικά. Enterprise applications στο Entra ID για τις εφαρμογές τρίτων με πρόσβαση στο tenant.
    evidence: 'Μητρώο προμηθευτών. Defender portal: Cloud apps, Cloud discovery, Discovered apps.'
    posts:
    - title: 'Live Webinar: Μάθε το Microsoft Defender XDR σε 60 λεπτά'
      url: /posts/microsoft-defender-xdr-full-tutorial-ciso/
  - code: 12.1.γ
    scope: Βασικές και σημαντικές
    requirement: 'Διαδικασίες διαχείρισης κινδύνων προμηθευτών σε όλο τον κύκλο ζωής: κριτήρια αξιολόγησης και απαιτήσεις κυβερνοασφάλειας για παρόχους και προϊόντα.'
    type: mixed
    control: Risk score ανά cloud εφαρμογή στο Defender for Cloud Apps (πιστοποιήσεις, συμμόρφωση) ως κριτήριο αξιολόγησης. Ρύθμιση Allowed Agent Types «Only certified external publishers». Service Trust Portal για τις εκθέσεις ελέγχου της ίδιας της Microsoft.
