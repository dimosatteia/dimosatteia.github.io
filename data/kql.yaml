  - id: mass-download
    title: Μαζικά downloads από SharePoint και OneDrive
    summary: Χρήστες που κατέβασαν ασυνήθιστα πολλά αρχεία από SharePoint ή OneDrive μέσα σε μία ώρα, με sites, συσκευή και IP.
    why: Τα πολλά downloads σε λίγο χρόνο είναι το συνηθισμένο αποτύπωμα διαρροής δεδομένων, είτε από παραβιασμένο λογαριασμό είτε από υπάλληλο που αποχωρεί. Το όριο το προσαρμόζεις στον οργανισμό σου, και το εύρημα το συγκρίνεις με το HR για αποχωρήσεις. Το query μετρά μόνο τα downloads από browser ή εφαρμογή και όχι τον συγχρονισμό του OneDrive client, γιατί ο συγχρονισμός σε νέο υπολογιστή κατεβάζει χιλιάδες αρχεία και θα έπνιγε το αποτέλεσμα. Όταν το DistinctFiles είναι κοντά στο Downloads, ο χρήστης κατέβασε πολλά διαφορετικά αρχεία. Αν στη στήλη Clients δεις εργαλεία όπως rclone, python ή PowerShell αντί για browser ή Office, το εύρημα είναι σοβαρό.
    pillar: cloud
    product: SharePoint και OneDrive
    table: CloudAppEvents
    license: Microsoft Defender for Cloud Apps με ενεργό τον connector του Microsoft 365 (Microsoft 365 E5 ή E5 Security)
    tested: 2026-10-13
    verified: 2026-10-14
    evidence: /images/kql/mass-download.webp
    evidenceNote: Αποτέλεσμα σε πραγματικό tenant. Με το όριο των 100 downloads την ώρα το αποτέλεσμα ήταν κενό, οπότε για τη δοκιμή το Threshold κατέβηκε στο 30. Βρέθηκαν τρεις περιπτώσεις με 34 έως 47 downloads σε μία ώρα, όλες από την Ελλάδα, από το Microsoft Office και από προσωπικά OneDrive, δηλαδή κανονική εργασία και όχι διαρροή. Στη σελίδα το query μένει με όριο 100. Οι χρήστες, οι IP, τα sites και τα ονόματα αρχείων έχουν αφαιρεθεί.
    map:
      kya: ["11.δ", "24.ε"]
      nis2: ["21.2.θ"]
      iso: ["A.8.12", "A.8.16"]
      gdpr: ["5.1.στ", "32.1.β"]
    posts:
      - title: "Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου"
        url: /posts/purview-autolabeling-500k-scale-increase/
    query: |-
      // Μαζικά downloads από SharePoint και OneDrive ανά χρήστη και ώρα, τελευταίες 7 ημέρες
      // ΚΥΑ 1689/2025: 11.δ, 24.ε
      let Lookback = 7d;
      let Threshold = 100;        // από πόσα downloads μέσα σε μία ώρα και πάνω
      CloudAppEvents
      | where Timestamp > ago(Lookback)
      | where ActionType == "FileDownloaded"
      | where Application in ("Microsoft SharePoint Online", "Microsoft OneDrive for Business")
      | extend User = tostring(RawEventData.UserId),
               Site = tostring(RawEventData.SiteUrl),
               FileName = tostring(RawEventData.SourceFileName),
               UserAgent = tostring(RawEventData.UserAgent)
      | where isnotempty(User) and User !has "app@sharepoint"
      | summarize
          Downloads = count(),
          DistinctFiles = dcount(FileName),
          Sites = make_set(Site, 10),
          IPs = make_set(IPAddress, 10),
          Countries = make_set(CountryCode, 5),
          Clients = make_set(UserAgent, 5),
          SampleFiles = make_set(FileName, 10)
          by User, Hour = bin(Timestamp, 1h)
      | where Downloads >= Threshold
      | order by Downloads desc


  - id: local-admin-add
    title: Προσθήκες στο local Administrators group
    summary: Ποιος λογαριασμός προστέθηκε στο τοπικό group Administrators σε ποια συσκευή, από ποιον και πότε, τις τελευταίες 30 ημέρες.
    why: Τα τοπικά δικαιώματα admin είναι ο πιο συνηθισμένος δρόμος για να κλείσει κάποιος το antivirus, να εγκαταστήσει λογισμικό ή να κινηθεί πλάγια. Κάθε προσθήκη που δεν πέρασε από τη διαδικασία σου (LAPS, Intune Account protection) θέλει εξήγηση. Το query αναγνωρίζει το group από το SID του (S-1-5-32-544) και όχι από το όνομα, οπότε πιάνει και τα Ελληνικά Windows, όπου λέγεται «Διαχειριστές». Αν η στήλη AddedBy δείχνει το SYSTEM με process όπως omadmclient.exe ή svchost.exe, η αλλαγή έγινε συνήθως από πολιτική του Intune ή GPO. Αν δείχνει κανονικό λογαριασμό με net.exe ή powershell.exe, έγινε με το χέρι. Όταν η στήλη AddedAccount εμφανίζει μόνο SID, πρόκειται συνήθως για λογαριασμό ή group του domain.
    pillar: endpoint
    product: Defender for Endpoint
    table: DeviceEvents
    license: Microsoft Defender for Endpoint Plan 2 (Microsoft 365 E5 ή E5 Security)
    tested: 2026-10-13
    verified: 2026-10-14
    evidence: /images/kql/local-admin-add.webp
    evidenceNote: Αποτέλεσμα σε πραγματικό tenant. Δύο προσθήκες στο τοπικό group Administrators, στις 9 και στις 12 Οκτωβρίου, και στις δύο περιπτώσεις με λογαριασμό που εμφανίζεται ως SID, δηλαδή λογαριασμό ή group του domain. Κάθε τέτοια προσθήκη ελέγχεται απέναντι σε εγκεκριμένο αίτημα. Οι συσκευές, τα SID και οι λογαριασμοί έχουν αφαιρεθεί.
    map:
      kya: ["13.δ", "24.γ"]
      nis2: ["21.2.θ"]
      iso: ["A.8.2", "A.8.15"]
      gdpr: ["32.1.β"]
    posts:
      - title: "Microsoft Defender for Endpoint: Τι είναι, τι κάνει και πώς να το αναπτύξετε στην πράξη"
        url: /posts/microsoft-defender-up-close-series/microsoft-defender-for-endpoint-deep-dive/
    query: |-
      // Προσθήκες λογαριασμών στο τοπικό group Administrators, τελευταίες 30 ημέρες
      // ΚΥΑ 1689/2025: 13.δ, 24.γ
      let Lookback = 30d;
      DeviceEvents
      | where Timestamp > ago(Lookback)
      | where ActionType == "UserAccountAddedToLocalGroup"
      | extend AF = parse_json(AdditionalFields)
      | extend GroupName = tostring(AF.GroupName), GroupSid = tostring(AF.GroupSid)
      // S-1-5-32-544 είναι το Administrators σε κάθε γλώσσα των Windows (π.χ. «Διαχειριστές»)
      | where GroupSid == "S-1-5-32-544"
      | extend AddedAccount = iff(isnotempty(AccountName), strcat(AccountDomain, "\\", AccountName), AccountSid),
               AddedBy = strcat(InitiatingProcessAccountDomain, "\\", InitiatingProcessAccountName)
      | project Timestamp, DeviceName, GroupName, AddedAccount, AccountSid, AddedBy,
                InitiatingProcessFileName, InitiatingProcessCommandLine
      | order by Timestamp desc


