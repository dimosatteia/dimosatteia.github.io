  - id: av-disabled
    title: Συσκευές με ανενεργή προστασία του Defender Antivirus
    summary: Συσκευές όπου το real-time protection, το tamper protection ή η cloud-delivered protection του Microsoft Defender Antivirus δεν είναι ενεργά.
    why: Μια συσκευή χωρίς real-time protection είναι ουσιαστικά απροστάτευτη, ακόμα κι αν φαίνεται onboarded. Το query δεν βασίζεται σε κωδικούς ρυθμίσεων. Παίρνει τα ονόματα των ελέγχων από τον πίνακα DeviceTvmSecureConfigurationAssessmentKB, οπότε πιάνει κάθε έλεγχο του antivirus που αξιολογεί το Defender Vulnerability Management. Η στήλη MaxImpact βάζει πρώτες τις συσκευές με τον σοβαρότερο έλεγχο. Το tamper protection εμποδίζει τον επιτιθέμενο να κλείσει την προστασία. Το αποτέλεσμα είναι λίστα εργασιών για το Intune και τεκμήριο για τον έλεγχο.
    pillar: endpoint
    product: Defender for Endpoint
    table: DeviceTvmSecureConfigurationAssessment, DeviceTvmSecureConfigurationAssessmentKB
    license: Microsoft Defender for Endpoint Plan 2 (Microsoft 365 E5 ή E5 Security)
    tested: 2026-10-13
    verified: 2026-10-14
    evidence: /images/kql/av-disabled.webp
    evidenceNote: Αποτέλεσμα σε πραγματικό tenant. Τρεις συσκευές με ελέγχους του antivirus που αποτυγχάνουν. Σε έναν σταθμό εργασίας Windows είναι κλειστό το real-time protection, με impact 10, που είναι το σοβαρό εύρημα και θέλει άμεση διόρθωση. Σε δύο Windows Server αποτυγχάνει μόνο το email scanning, με impact 9. Τα ονόματα των συσκευών έχουν αφαιρεθεί.
    map:
      kya: ["20.α", "14.β"]
      nis2: ["21.2.ε"]
      iso: ["A.8.7", "A.8.9"]
      gdpr: ["32.1.β"]
    posts:
      - title: "Microsoft Defender for Endpoint: Τι είναι, τι κάνει και πώς να το αναπτύξετε στην πράξη"
        url: /posts/microsoft-defender-up-close-series/microsoft-defender-for-endpoint-deep-dive/
    query: |-
      // Συσκευές με ανενεργή ή μη συμμορφούμενη προστασία του Microsoft Defender Antivirus
      // ΚΥΑ 1689/2025: 20.α, 14.β
      // Τα security configurations του Defender Vulnerability Management που αφορούν το antivirus,
      // όπως real-time protection, cloud-delivered protection, tamper protection, PUA και ενημερώσεις
      let AvConfigs = DeviceTvmSecureConfigurationAssessmentKB
          | where ConfigurationSubcategory =~ "Antivirus"
              or ConfigurationName has_any ("Microsoft Defender Antivirus", "Tamper Protection",
                                            "real-time protection", "cloud-delivered protection")
          | project ConfigurationId, ConfigurationName, ConfigurationImpact;
      DeviceTvmSecureConfigurationAssessment
      | where IsApplicable == 1 and IsCompliant == 0
      | join kind=inner AvConfigs on ConfigurationId
      | summarize
          FailedChecks = dcount(ConfigurationId),
          MaxImpact = max(ConfigurationImpact),
          Checks = make_set(ConfigurationName, 20),
          ConfigIds = make_set(ConfigurationId, 20),
          LastAssessed = max(Timestamp)
          by DeviceId, DeviceName, OSPlatform
      | order by MaxImpact desc, FailedChecks desc


  - id: exploitable-cves
    title: Critical ευπάθειες με δημόσια διαθέσιμο exploit που μένουν ανοιχτές
    summary: Ευπάθειες με σοβαρότητα Critical και δημόσια διαθέσιμο exploit, ανά λογισμικό και έκδοση, με τον αριθμό των συσκευών που επηρεάζονται.
    why: Από εκατοντάδες CVEs, αυτά με δημόσια διαθέσιμο exploit είναι αυτά που ένας επιτιθέμενος μπορεί να χρησιμοποιήσει άμεσα. Κάθε γραμμή είναι ένα λογισμικό σε συγκεκριμένη έκδοση, άρα μία ενέργεια patching, και η στήλη DaysSincePublished μετρά τις ημέρες από τη δημοσίευση του παλαιότερου CVE. Οι πίνακες δείχνουν την τρέχουσα κατάσταση, γι' αυτό το query δεν έχει φίλτρο χρόνου. Η λίστα δείχνει από πού ξεκινά το patching, και όσο μικραίνει με τον χρόνο τεκμηριώνει ότι οι ενημερώσεις ασφαλείας εφαρμόζονται σε εύλογο χρόνο.
    pillar: endpoint
    product: Defender Vulnerability Management
    table: DeviceTvmSoftwareVulnerabilities, DeviceTvmSoftwareVulnerabilitiesKB
    license: Microsoft Defender for Endpoint Plan 2 (περιλαμβάνεται στα Microsoft 365 E5 και E5 Security) ή Defender Vulnerability Management Standalone
    tested: 2026-10-12
    verified: 2026-10-14
    evidence: /images/kql/exploitable-cves.webp
    evidenceNote: Αποτέλεσμα σε πραγματικό tenant. Δέκα συνδυασμοί λογισμικού και έκδοσης με Critical ευπάθεια και δημόσια διαθέσιμο exploit, ο καθένας σε μία συσκευή, με CVSS από 9.1 έως 9.8. Οι παλαιότερες είναι ευπάθειες του Apache HTTP Server που έχουν δημοσιευτεί πάνω από 1.800 ημέρες, ενώ βρέθηκαν και Windows 11, Edge και MikroTik RouterOS. Η στήλη RecommendedUpdate είναι συμπληρωμένη μόνο για τα Windows 11, οπότε για τα υπόλοιπα η ενημέρωση αναζητείται στον κατασκευαστή. Οι εκδόσεις και τα ονόματα των συσκευών έχουν αφαιρεθεί.
    map:
      kya: ["17.α", "17.γ", "17.στ"]
      nis2: ["21.2.ε"]
      iso: ["A.8.8"]
      gdpr: ["32.1.β", "32.1.δ"]
    posts:
      - title: "Preview: Ο Vulnerability Remediation Agent στο Microsoft Intune"
        url: /posts/previews/vulnerability-remediation-agent-intune/
    query: |-
      // Critical ευπάθειες με δημόσια διαθέσιμο exploit που μένουν ανοιχτές, ανά λογισμικό
      // ΚΥΑ 1689/2025: 17.α, 17.γ, 17.στ
      let ExploitableCritical = DeviceTvmSoftwareVulnerabilitiesKB
          | where VulnerabilitySeverityLevel == "Critical" and IsExploitAvailable == true
          | project CveId, CvssScore = todouble(CvssScore), PublishedDate;
      DeviceTvmSoftwareVulnerabilities
      | join kind=inner ExploitableCritical on CveId
      | summarize
          Devices = dcount(DeviceId),
          CVEs = dcount(CveId),
          MaxCvss = max(CvssScore),
          OldestCve = min(PublishedDate),
          CveList = make_set(CveId, 10),
          SampleDevices = make_set(DeviceName, 5),
          RecommendedUpdate = make_set_if(RecommendedSecurityUpdate, isnotempty(RecommendedSecurityUpdate), 3)
          by SoftwareVendor, SoftwareName, SoftwareVersion
      | extend DaysSincePublished = datetime_diff('day', now(), OldestCve)
      | order by Devices desc, MaxCvss desc

