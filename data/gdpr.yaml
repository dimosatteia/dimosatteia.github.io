  - code: '33.2'
    scope: Υπεύθυνος και εκτελών
    requirement: Ο εκτελών ενημερώνει τον υπεύθυνο χωρίς αδικαιολόγητη καθυστέρηση μόλις αντιληφθεί παραβίαση δεδομένων προσωπικού χαρακτήρα.
    type: mixed
    control: Για τις online υπηρεσίες της Microsoft, η ειδοποίηση για περιστατικά ασφάλειας ορίζεται στο Data Protection Addendum (DPA) και γίνεται προς τους διαχειριστές του tenant. Service health και Message center στο Microsoft 365 admin center για τις ανακοινώσεις της υπηρεσίας.
    evidence: Επικαιροποιημένα στοιχεία επικοινωνίας στο Microsoft 365 admin center. Συμβάσεις με τους υπόλοιπους εκτελούντες με όρο ειδοποίησης.
    verified: 2026-10-14
    comment: Κρατήστε επικαιροποιημένα τα στοιχεία επικοινωνίας των διαχειριστών, αλλιώς η ειδοποίηση της Microsoft δεν φτάνει σε κανέναν.
    kya:
