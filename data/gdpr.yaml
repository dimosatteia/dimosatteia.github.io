  - code: '32.4'
    scope: Υπεύθυνος και εκτελών
    requirement: Ο υπεύθυνος και ο εκτελών λαμβάνουν μέτρα ώστε κάθε φυσικό πρόσωπο που ενεργεί υπό την εποπτεία τους και έχει πρόσβαση σε δεδομένα προσωπικού χαρακτήρα να τα επεξεργάζεται μόνο κατ' εντολή του υπευθύνου επεξεργασίας, εκτός αν υποχρεούται από το δίκαιο της Ένωσης ή του κράτους μέλους.
    type: mixed
    control: Access reviews στο Microsoft Entra ID για τον περιοδικό έλεγχο του ποιος έχει πρόσβαση. Microsoft Purview Audit για τις ενέργειες των χρηστών. Microsoft Purview Insider Risk Management για ασυνήθιστη χρήση δεδομένων.
    evidence: 'Entra: αποτελέσματα access reviews. Purview: Audit search. Δηλώσεις εμπιστευτικότητας των εργαζομένων.'
    verified: 2026-10-16
    license: Microsoft Entra ID P2 ή Microsoft Entra ID Governance για access reviews. Microsoft 365 E5 για Insider Risk Management
    comment: Οι εντολές και οι δεσμεύσεις εμπιστευτικότητας είναι έγγραφα και διαδικασίες. Το Insider Risk Management χρειάζεται ενημέρωση των εργαζομένων και έλεγχο αναλογικότητας, γιατί είναι κι αυτό επεξεργασία δεδομένων.
