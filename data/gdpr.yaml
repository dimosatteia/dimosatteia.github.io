# Αντιστοίχιση Κανονισμού (ΕΕ) 2016/679 (GDPR) -> Microsoft -> ΚΥΑ 1689/2025 και ISO/IEC 27001 -> άρθρα thecybersec.gr
# Παράγεται από script. Η σελίδα /gdpr/ διαβάζει αυτό το αρχείο. requirement: δική μας σύντομη απόδοση, όχι το κείμενο του Κανονισμού.
# kya: άρθρα της ΚΥΑ 1689/2025 με θεματική αντιστοιχία. iso: controls του ISO/IEC 27001:2022 Annex A.
source:
  act: Κανονισμός (ΕΕ) 2016/679 (GDPR)
  title: Γενικός Κανονισμός για την Προστασία Δεδομένων
  fek: ΕΕ L 119 της 4.5.2016
  url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:32016R0679
  of: του Κανονισμού
  items: υποχρεώσεις
  item: υποχρέωση
  groups: άρθρα
  disclaimer: Η αντιστοίχιση είναι επαγγελματική ερμηνεία και όχι νομική συμβουλή. Μια ρύθμιση υποστηρίζει μια υποχρέωση, δεν αποδεικνύει από μόνη της συμμόρφωση. Οι περιγραφές είναι σύντομες αποδόσεις για το ακριβές κείμενο ισχύει ο [Κανονισμός (ΕΕ) 2016/679](https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:32016R0679). Στην Ελλάδα εφαρμόζεται μαζί με τον ν. 4624/2019, και η εποπτική αρχή είναι η [Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα](https://www.dpa.gr/).
updated: '2026-10-18'
types:
- key: tech
  label: Τεχνικό
  hint: Υλοποιείται κυρίως με ρύθμιση
- key: mixed
  label: Μικτό
  hint: Έγγραφο ή διαδικασία, με τεχνική επιβολή ή τεκμήριο από τη Microsoft
- key: org
  label: Οργανωτικό ή εκτός Microsoft 365
  hint: Δεν υπάρχει ρύθμιση που να το καλύπτει
articles:
- number: 5
  title: Αρχές που διέπουν την επεξεργασία δεδομένων προσωπικού χαρακτήρα
  requirements:
  - code: 5.1.γ
    scope: Υπεύθυνος επεξεργασίας
    requirement: '«Ελαχιστοποίηση των δεδομένων»: τα δεδομένα είναι κατάλληλα, συναφή και περιορίζονται σε ό,τι είναι αναγκαίο για τους σκοπούς της επεξεργασίας.'
    type: mixed
    control: Content explorer και Activity explorer του Microsoft Purview για να φανεί πού βρίσκονται δεδομένα προσωπικού χαρακτήρα (sensitive information types, trainable classifiers). Microsoft Purview Data Security Posture Management για τα σημεία με υπερβολική συγκέντρωση ή έκθεση δεδομένων.
    evidence: 'Purview: Content explorer (κατανομή sensitive information types ανά τοποθεσία). Τεκμηρίωση της απόφασης για το ποια δεδομένα χρειάζονται ανά σκοπό.'
    verified: 2026-10-14
    license: Microsoft 365 E5 ή Microsoft Purview Suite (πρώην Microsoft 365 E5 Compliance) για Content explorer, Activity explorer και Data Security Posture Management. Στο Microsoft 365 E3 τα δεδομένα συλλέγονται, αλλά οι οθόνες του Content explorer και του Activity explorer δεν είναι διαθέσιμες
    comment: Το ποια δεδομένα είναι «αναγκαία» το κρίνει ο υπεύθυνος επεξεργασίας. Το Purview δείχνει τι υπάρχει, δεν αποφασίζει τι πρέπει να φύγει.
    kya:
    - 11
    iso:
    - A.5.12
    - A.5.34
    posts:
    - title: 'Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου'
      url: /posts/purview-autolabeling-500k-scale-increase/
  - code: 5.1.ε
    scope: Υπεύθυνος επεξεργασίας
    requirement: '«Περιορισμός της περιόδου αποθήκευσης»: τα δεδομένα διατηρούνται σε μορφή που επιτρέπει την ταυτοποίηση μόνο όσο χρειάζεται για τον σκοπό της επεξεργασίας.'
    type: mixed
    control: 'Microsoft Purview Data Lifecycle Management: retention policies και retention labels με ενέργεια διαγραφής στο τέλος της περιόδου, για Exchange, SharePoint, OneDrive και Teams. Disposition review στο Microsoft Purview Records Management για τα αρχεία που θέλουν έγκριση πριν διαγραφούν.'
    evidence: 'Purview: Data Lifecycle Management, λίστα retention policies και labels με διάρκεια και ενέργεια. Records Management: ιστορικό disposition.'
    verified: 2026-10-14
    license: Οι retention policies υπάρχουν στο Microsoft 365 E3. Η αυτόματη εφαρμογή retention labels και το disposition review θέλουν Microsoft 365 E5 ή Microsoft Purview Suite (πρώην Microsoft 365 E5 Compliance)
    comment: Τους χρόνους διατήρησης ορίζει ο υπεύθυνος με βάση τον σκοπό και τις νόμιμες υποχρεώσεις, π.χ. φορολογικές ή εργατικές. Μια retention policy που κρατά τα πάντα για πάντα έρχεται σε αντίθεση με αυτή την αρχή.
    kya:
    - 11
    iso:
    - A.5.33
    - A.8.10
  - code: 5.1.στ
    scope: Υπεύθυνος επεξεργασίας
    requirement: '«Ακεραιότητα και εμπιστευτικότητα»: η επεξεργασία εξασφαλίζει κατάλληλη ασφάλεια των δεδομένων με τεχνικά και οργανωτικά μέτρα, ώστε να προστατεύονται από μη εξουσιοδοτημένη ή παράνομη επεξεργασία και από τυχαία απώλεια, καταστροφή ή φθορά.'
    type: tech
    control: Conditional Access και MFA στο Microsoft Entra ID για την πρόσβαση. Sensitivity labels με κρυπτογράφηση και Data Loss Prevention στο Microsoft Purview για τα ίδια τα δεδομένα. Microsoft Defender XDR για τον εντοπισμό επιθέσεων σε ταυτότητες, endpoints, email και cloud apps.
    evidence: 'Entra: πολιτικές Conditional Access. Purview: χρήση sensitivity labels και DLP alerts. Microsoft Secure Score: βαθμολογία και History.'
    verified: 2026-10-14
    license: Microsoft Entra ID P1 για Conditional Access. Microsoft 365 E5 για DLP στα endpoints, αυτόματο labeling και Microsoft Defender XDR
    comment: Η αρχή καλύπτει και τα οργανωτικά μέτρα, π.χ. εξουσιοδοτήσεις και εκπαίδευση. Οι λεπτομέρειες των τεχνικών μέτρων βρίσκονται στο άρθρο 32.
    kya:
    - 13
    - 22
    iso:
    - A.5.15
    - A.8.12
    - A.8.24
    posts:
    - title: 'Τέλος στα SMS/Voice MFA: Η Microsoft κάνει τα Passkeys default στο Entra ID'
      url: /posts/passkeys-by-default-telos-sms-voice-mfa/
    - title: 'Microsoft Defender for Office 365: Από τις preset policies στην προχωρημένη παραμετροποίηση'
      url: /posts/microsoft-defender-up-close-series/microsoft-defender-for-office-365-deep-dive/
    - title: 'Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου'
      url: /posts/purview-autolabeling-500k-scale-increase/
    - title: 'Preview: AI agent runtime protection, το Defender for Endpoint σταματά το prompt injection στους τοπικούς AI agents'
      url: /posts/previews/defender-endpoint-ai-agent-runtime-protection-intune/
    - title: 'Microsoft Entra Conditional Access Μέρος 1: Τι είναι, πώς αποφασίζει και γιατί είναι ο πυρήνας του Zero Trust'
      url: /posts/conditional-access-series/conditional-access-meros-1-themeliodeis-ennoies/
      page: /posts/Conditional-Access-Series/conditional-access-meros-1-themeliodeis-ennoies
  - code: '5.2'
    scope: Υπεύθυνος επεξεργασίας
    requirement: '«Λογοδοσία»: ο υπεύθυνος επεξεργασίας φέρει την ευθύνη και είναι σε θέση να αποδείξει τη συμμόρφωση με τις αρχές της παραγράφου 1.'
    type: mixed
    control: Microsoft Purview Compliance Manager με το assessment «EU GDPR (General Data Protection Regulation)» ως μητρώο μέτρων και τεκμηρίων. Microsoft Purview Audit για το ιστορικό ενεργειών χρηστών και διαχειριστών.
    evidence: 'Compliance Manager: βαθμολογία του assessment και improvement actions με συνημμένα τεκμήρια. Purview: Audit search.'
    verified: 2026-10-16
    license: Το regulation «EU GDPR (General Data Protection Regulation)» είναι premium στο Compliance Manager. Με Microsoft 365 E5 επιλέγονται τρία premium regulations χωρίς χρέωση
    comment: 'Το Compliance Manager είναι αυτοαξιολόγηση και η βαθμολογία του δεν αποδεικνύει συμμόρφωση. Η λογοδοσία στηρίζεται στα έγγραφα του υπευθύνου: αρχείο δραστηριοτήτων, πολιτικές, εκτιμήσεις αντικτύπου.'
    kya:
    - 9
    iso:
    - A.5.31
    - A.5.36
    posts:
    - title: Microsoft Secure Score ως εργαλείο GRC για ISO 27001 & NIS2
      url: /posts/secure-score-grc-part-0-intro/
    - title: 'Εργαλείο: Εκπαίδευση προσωπικού, είναι τεκμηριωμένη για τον ελεγκτή;'
      url: /tekmiriosi-ekpaideysis/
      page: /tekmiriosi-ekpaideysis
    - title: 'Εργαλείο: Μητρώο υποχρεωτικών πολιτικών της ΚΥΑ 1689/2025'
      url: /mitroo-politikon/
      page: /mitroo-politikon
- number: 6
  title: Νομιμότητα της επεξεργασίας
  requirements:
  - code: '6.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: 'Η επεξεργασία είναι σύννομη μόνο αν ισχύει τουλάχιστον μία από τις νομικές βάσεις: συγκατάθεση, σύμβαση, έννομη υποχρέωση, ζωτικό συμφέρον, δημόσιο συμφέρον ή έννομο συμφέρον.'
    type: org
    control: Δεν υπάρχει ρύθμιση της Microsoft που να καθορίζει ή να τεκμηριώνει τη νομική βάση.
    evidence: Αρχείο δραστηριοτήτων επεξεργασίας με τη νομική βάση ανά επεξεργασία. Τεκμηρίωση στάθμισης όπου η βάση είναι το έννομο συμφέρον.
    comment: Νομικό ζήτημα. Καλύπτεται με το αρχείο δραστηριοτήτων του άρθρου 30.
    iso:
    - A.5.31
    - A.5.34
- number: 9
  title: Επεξεργασία ειδικών κατηγοριών δεδομένων προσωπικού χαρακτήρα
  requirements:
  - code: '9.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Απαγορεύεται η επεξεργασία ειδικών κατηγοριών δεδομένων (π.χ. δεδομένα υγείας, βιομετρικά για ταυτοποίηση, φυλετική ή εθνοτική καταγωγή, πολιτικά φρονήματα, θρησκευτικές πεποιθήσεις, συμμετοχή σε συνδικαλιστική οργάνωση), εκτός αν ισχύει μία από τις εξαιρέσεις της παραγράφου 2.
    type: mixed
    control: Sensitive information types και trainable classifiers του Microsoft Purview για τον εντοπισμό τέτοιων δεδομένων σε email και αρχεία. Sensitivity label με κρυπτογράφηση για όσα εντοπίζονται, και DLP policy που μπλοκάρει την αποστολή τους εκτός οργανισμού.
    evidence: 'Purview: Content explorer για τις αντίστοιχες κατηγορίες. DLP policies και alerts. Εφαρμογή labels στα σχετικά αρχεία.'
    verified: 2026-10-14
    license: Microsoft 365 E5 ή Microsoft Purview Suite (πρώην Microsoft 365 E5 Compliance) για trainable classifiers, αυτόματο labeling και Content explorer
    comment: Το αν ισχύει εξαίρεση της παραγράφου 2 είναι νομικό ζήτημα. Οι classifiers δεν αναγνωρίζουν όλες τις ειδικές κατηγορίες, π.χ. τα πολιτικά φρονήματα, και χρειάζονται έλεγχο για ψευδώς θετικά.
    kya:
    - 11
    iso:
    - A.5.12
    - A.5.34
    posts:
    - title: 'Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου'
      url: /posts/purview-autolabeling-500k-scale-increase/
- number: 12
  title: Διαφανής ενημέρωση, ανακοίνωση και ρυθμίσεις για την άσκηση των δικαιωμάτων του υποκειμένου των δεδομένων
  requirements:
  - code: '12.3'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Ο υπεύθυνος απαντά στο αίτημα του υποκειμένου χωρίς καθυστέρηση και το αργότερο μέσα σε έναν μήνα από την παραλαβή του. Η προθεσμία παρατείνεται κατά δύο ακόμη μήνες για σύνθετα ή πολλά αιτήματα, με ενημέρωση του υποκειμένου μέσα στον πρώτο μήνα.
    type: mixed
    control: Microsoft Purview eDiscovery (Premium) για τη διαχείριση των αιτημάτων ως cases, με ημερομηνίες, αναζητήσεις και ιστορικό. Από τις 9 Μαΐου 2026 τα αιτήματα του Microsoft Priva Subject Rights Requests υποστηρίζονται μέσω του eDiscovery (Premium).
    evidence: 'Μητρώο αιτημάτων με ημερομηνία παραλαβής και απάντησης. eDiscovery: cases ανά αίτημα με ιστορικό ενεργειών.'
    verified: 2026-10-14
    license: Microsoft Purview eDiscovery (Premium) στο Microsoft 365 E5 ή αντίστοιχο add-on. Η αναζήτηση και η εξαγωγή περιεχομένου υπάρχουν και στο Microsoft 365 E3
    comment: Η παρακολούθηση της προθεσμίας και η επικοινωνία με το υποκείμενο είναι διαδικασία του υπευθύνου. Τα δεδομένα εκτός Microsoft 365, π.χ. σε ERP ή CRM, θέλουν ξεχωριστή αναζήτηση.
    iso:
    - A.5.34
- number: 15
  title: Δικαίωμα πρόσβασης του υποκειμένου των δεδομένων
  requirements:
  - code: '15.3'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Ο υπεύθυνος παρέχει αντίγραφο των δεδομένων που υποβάλλονται σε επεξεργασία. Αν το αίτημα υποβληθεί ηλεκτρονικά, το αντίγραφο δίνεται σε κοινώς χρησιμοποιούμενη ηλεκτρονική μορφή, εκτός αν ζητηθεί διαφορετικά.
    type: mixed
    control: Αναζήτηση στο Microsoft Purview eDiscovery με τα στοιχεία του υποκειμένου (όνομα, email, αριθμοί ταυτοποίησης) σε Exchange, SharePoint, OneDrive και Teams, και εξαγωγή των αποτελεσμάτων. Στο eDiscovery (Premium), review set για έλεγχο και απόκρυψη (redaction) πριν την παράδοση.
    evidence: 'eDiscovery: case με τα κριτήρια αναζήτησης, το πλήθος αποτελεσμάτων και την εξαγωγή.'
    verified: 2026-10-14
    license: Microsoft Purview eDiscovery (Premium) στο Microsoft 365 E5 ή αντίστοιχο add-on. Η αναζήτηση και η εξαγωγή περιεχομένου υπάρχουν και στο Microsoft 365 E3
    comment: Σύμφωνα με την παράγραφο 4, το αντίγραφο δεν πρέπει να θίγει τα δικαιώματα τρίτων, οπότε χρειάζεται έλεγχος πριν δοθεί. Τα δεδομένα σε εφαρμογές εκτός Microsoft 365 δεν καλύπτονται.
    iso:
    - A.5.34
- number: 16
  title: Δικαίωμα διόρθωσης
  requirements:
  - code: '16'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Το υποκείμενο έχει δικαίωμα να ζητήσει τη διόρθωση ανακριβών δεδομένων που το αφορούν χωρίς αδικαιολόγητη καθυστέρηση, και τη συμπλήρωση ελλιπών δεδομένων.
    type: org
    control: Η διόρθωση γίνεται στο σύστημα όπου τηρούνται τα δεδομένα. Το Microsoft Purview eDiscovery βοηθά μόνο στον εντοπισμό του πού υπάρχουν στο Microsoft 365.
    evidence: Μητρώο αιτημάτων με την ενέργεια διόρθωσης και την ημερομηνία.
    verified: 2026-10-14
    comment: Για τα στοιχεία των εργαζομένων στο Microsoft Entra ID, η διόρθωση γίνεται συνήθως στο σύστημα HR που τα τροφοδοτεί, αλλιώς ο επόμενος συγχρονισμός τα επαναφέρει.
    iso:
    - A.5.34
- number: 17
  title: Δικαίωμα διαγραφής («δικαίωμα στη λήθη»)
  requirements:
  - code: '17.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Το υποκείμενο έχει δικαίωμα να ζητήσει τη διαγραφή δεδομένων που το αφορούν χωρίς αδικαιολόγητη καθυστέρηση, και ο υπεύθυνος υποχρεούται να τα διαγράψει όταν ισχύει ένας από τους λόγους του άρθρου, π.χ. τα δεδομένα δεν είναι πλέον απαραίτητα ή η συγκατάθεση ανακλήθηκε.
    type: mixed
    control: Εντοπισμός με το Microsoft Purview eDiscovery και διαγραφή των μηνυμάτων με search and purge. Στο SharePoint και στο OneDrive η διαγραφή γίνεται στα αρχεία.
    evidence: 'eDiscovery: case με την αναζήτηση και την ενέργεια purge. Purview Audit για τις διαγραφές.'
    verified: 2026-10-14
    license: Microsoft Purview eDiscovery (Premium) στο Microsoft 365 E5 ή αντίστοιχο add-on. Η αναζήτηση και η εξαγωγή περιεχομένου υπάρχουν και στο Microsoft 365 E3
    comment: Retention policies και holds κρατούν αντίγραφα ακόμη και μετά τη διαγραφή από τον χρήστη (Recoverable Items, Preservation Hold library). Ελέγξτε αν ισχύει εξαίρεση της παραγράφου 3, π.χ. νόμιμη υποχρέωση διατήρησης, πριν τη διαγραφή.
    iso:
    - A.8.10
    - A.5.34
- number: 18
  title: Δικαίωμα περιορισμού της επεξεργασίας
  requirements:
  - code: '18.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Το υποκείμενο έχει δικαίωμα να ζητήσει τον περιορισμό της επεξεργασίας σε συγκεκριμένες περιπτώσεις, π.χ. όσο ελέγχεται η ακρίβεια των δεδομένων. Τα περιορισμένα δεδομένα, πέρα από την αποθήκευση, υποβάλλονται σε επεξεργασία μόνο υπό τις προϋποθέσεις της παραγράφου 2.
    type: mixed
    control: Μεταφορά των σχετικών αρχείων σε SharePoint site με περιορισμένη πρόσβαση ή εφαρμογή sensitivity label με κρυπτογράφηση μόνο για εξουσιοδοτημένα πρόσωπα. eDiscovery hold ώστε να μη διαγραφούν όσο ισχύει ο περιορισμός.
    evidence: 'Μητρώο αιτημάτων. SharePoint: δικαιώματα του site. Purview: εφαρμογή label ή hold.'
    verified: 2026-10-14
    license: Microsoft 365 E3 για sensitivity labels με χειροκίνητη εφαρμογή και για holds
    comment: Ο περιορισμός πρέπει να σημειώνεται και στα συστήματα εκτός Microsoft 365 που περιέχουν τα ίδια δεδομένα.
    iso:
    - A.8.3
    - A.5.34
- number: 20
  title: Δικαίωμα στη φορητότητα των δεδομένων
  requirements:
  - code: '20.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Το υποκείμενο έχει δικαίωμα να λαμβάνει τα δεδομένα που έχει παράσχει σε δομημένο, κοινώς χρησιμοποιούμενο και αναγνώσιμο από μηχανήματα μορφότυπο, και να τα διαβιβάζει σε άλλον υπεύθυνο, όταν η επεξεργασία βασίζεται σε συγκατάθεση ή σύμβαση και γίνεται με αυτοματοποιημένα μέσα.
    type: mixed
    control: Εξαγωγή από το Microsoft Purview eDiscovery για δεδομένα στο Microsoft 365, σε αρχεία στην αρχική τους μορφή ή PST για το email.
    evidence: 'eDiscovery: εξαγωγή ανά αίτημα. Μητρώο αιτημάτων.'
    verified: 2026-10-14
    license: Microsoft Purview eDiscovery (Premium) στο Microsoft 365 E5 ή αντίστοιχο add-on. Η αναζήτηση και η εξαγωγή περιεχομένου υπάρχουν και στο Microsoft 365 E3
    comment: Το δικαίωμα αφορά κυρίως δεδομένα σε εφαρμογές (π.χ. CRM, e-shop), όπου η εξαγωγή γίνεται από την ίδια την εφαρμογή σε CSV ή JSON. Το Microsoft 365 καλύπτει μικρό μέρος.
    iso:
    - A.5.34
- number: 21
  title: Δικαίωμα εναντίωσης
  requirements:
  - code: '21.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Το υποκείμενο έχει δικαίωμα να αντιταχθεί οποτεδήποτε, για λόγους που σχετίζονται με την ιδιαίτερη κατάστασή του, στην επεξεργασία που βασίζεται σε δημόσιο ή έννομο συμφέρον, περιλαμβανομένης της κατάρτισης προφίλ. Ο υπεύθυνος σταματά την επεξεργασία, εκτός αν αποδείξει επιτακτικούς και νόμιμους λόγους που υπερισχύουν των δικαιωμάτων του υποκειμένου ή αν η επεξεργασία χρειάζεται για νομικές αξιώσεις.
    type: org
    control: Δεν υπάρχει ρύθμιση της Microsoft που να καλύπτει το δικαίωμα εναντίωσης.
    evidence: Μητρώο αιτημάτων με την απόφαση και την αιτιολογία.
