    type: mixed
    control: Microsoft Purview Data Security Posture Management για τους κινδύνους στα δεδομένα. Microsoft Purview Insider Risk Management για κινδύνους από χρήστες με νόμιμη πρόσβαση. Microsoft Security Exposure Management για την εικόνα έκθεσης των συστημάτων.
    evidence: Μητρώο κινδύνων με τις επεξεργασίες δεδομένων προσωπικού χαρακτήρα. Αναφορές του Data Security Posture Management.
