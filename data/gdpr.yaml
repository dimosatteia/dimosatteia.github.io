- number: 33
  title: Γνωστοποίηση παραβίασης δεδομένων προσωπικού χαρακτήρα στην εποπτική αρχή
  requirements:
  - code: '33.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Σε περίπτωση παραβίασης, ο υπεύθυνος τη γνωστοποιεί στην αρμόδια εποπτική αρχή χωρίς αδικαιολόγητη καθυστέρηση και, όπου είναι εφικτό, μέσα σε 72 ώρες από τη στιγμή που αποκτά γνώση, εκτός αν η παραβίαση δεν ενδέχεται να θέσει σε κίνδυνο τα δικαιώματα των φυσικών προσώπων. Η καθυστέρηση πέρα από τις 72 ώρες αιτιολογείται.
    type: mixed
    control: Incidents του Microsoft Defender XDR, που καταγράφουν πότε ξεκίνησε η δραστηριότητα και πότε εντοπίστηκε, για τον υπολογισμό των 72 ωρών. Τα alerts του Microsoft Purview DLP εμφανίζονται στην ίδια ουρά incidents.
    evidence: 'Defender XDR: incident με χρονολόγιο, ανάθεση και ταξινόμηση. Γνωστοποίηση προς την Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα με ημερομηνία και ώρα.'
    verified: 2026-10-18
    license: Microsoft 365 E5 ή αντίστοιχο για Microsoft Defender XDR
    comment: Στην Ελλάδα η γνωστοποίηση γίνεται στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα. Για τις βασικές και σημαντικές οντότητες, το ίδιο περιστατικό μπορεί να θέλει και αναφορά βάσει του ν. 5160/2024, με διαφορετικές προθεσμίες και αποδέκτη.
