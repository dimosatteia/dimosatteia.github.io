    - 15
    iso:
    - A.5.34
    - A.8.26
    posts:
    - title: 'Purview Auto-labeling: Από 100.000 σε 500.000 αρχεία την ημέρα, τι αλλάζει πραγματικά για το labeling backlog σου'
      url: /posts/purview-autolabeling-500k-scale-increase/
  - code: '25.2'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Ο υπεύθυνος διασφαλίζει ότι, εξ ορισμού, υποβάλλονται σε επεξεργασία μόνο τα δεδομένα που είναι αναγκαία για κάθε συγκεκριμένο σκοπό, και ότι τα δεδομένα δεν γίνονται προσβάσιμα σε αόριστο αριθμό προσώπων χωρίς την παρέμβαση του υποκειμένου.
    type: tech
    control: Προεπιλεγμένος τύπος συνδέσμου κοινής χρήσης «Specific people» και περιορισμός της εξωτερικής κοινής χρήσης στο SharePoint και στο OneDrive. Προεπιλεγμένη sensitivity label. Αποκλεισμός της αυτόματης προώθησης email εκτός οργανισμού στο Exchange Online. Ρυθμίσεις guest access στο Microsoft Teams.
    evidence: 'SharePoint admin center: Sharing. Purview: label policy με default label. Microsoft Defender: outbound spam policy (Automatic forwarding rules). Teams admin center: Guest access.'
    verified: 2026-10-14
    comment: Το «Anyone» link (σύνδεσμος που ανοίγει χωρίς sign-in) είναι το αντίθετο της προστασίας εξ ορισμού. Αν το χρειάζεστε, βάλτε ημερομηνία λήξης και περιορίστε το σε συγκεκριμένα sites.
