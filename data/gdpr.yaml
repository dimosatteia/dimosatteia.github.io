- number: 34
  title: Ανακοίνωση παραβίασης δεδομένων προσωπικού χαρακτήρα στο υποκείμενο των δεδομένων
  requirements:
  - code: '34.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Όταν η παραβίαση ενδέχεται να θέσει σε υψηλό κίνδυνο τα δικαιώματα και τις ελευθερίες των φυσικών προσώπων, ο υπεύθυνος την ανακοινώνει στο υποκείμενο χωρίς αδικαιολόγητη καθυστέρηση.
    type: org
    control: Η ανακοίνωση είναι διαδικασία του υπευθύνου. Το Microsoft Purview eDiscovery βοηθά να βρεθούν τα υποκείμενα που αφορά η παραβίαση.
    evidence: Κείμενο της ανακοίνωσης, λίστα παραληπτών και ημερομηνία.
    verified: 2026-10-14
    comment: Η ανακοίνωση περιέχει τουλάχιστον τα στοιχεία των σημείων β, γ και δ του άρθρου 33 παράγραφος 3.
    kya:
    - 24
    iso:
    - A.5.26
  - code: 34.3.α
    scope: Υπεύθυνος επεξεργασίας
    requirement: Η ανακοίνωση στο υποκείμενο δεν απαιτείται αν ο υπεύθυνος είχε εφαρμόσει κατάλληλα τεχνικά και οργανωτικά μέτρα προστασίας στα επηρεαζόμενα δεδομένα, ιδίως μέτρα που τα καθιστούν μη κατανοητά σε όποιον δεν έχει άδεια πρόσβασης, όπως η κρυπτογράφηση.
    type: tech
    control: BitLocker στις συσκευές μέσω Microsoft Intune, ώστε ένα χαμένο ή κλεμμένο laptop να μη δίνει πρόσβαση στα δεδομένα. Sensitivity labels με κρυπτογράφηση, ώστε ένα αρχείο που διέρρευσε να μην ανοίγει εκτός οργανισμού.
    evidence: 'Intune: encryption report για τη συγκεκριμένη συσκευή τη στιγμή της απώλειας. Purview: label με κρυπτογράφηση στο αρχείο που διέρρευσε.'
    verified: 2026-10-14
    license: Microsoft Intune Plan 1 και sensitivity labels στο Microsoft 365 E3
    comment: Η εξαίρεση ισχύει μόνο αν τα κλειδιά δεν έχουν διαρρεύσει. Η απόδειξη ότι η συσκευή ήταν κρυπτογραφημένη πριν την απώλεια είναι αυτό που μετράει, γι' αυτό κρατήστε την αναφορά του Intune.
    kya:
    - 22
    iso:
    - A.8.24
- number: 35
  title: Εκτίμηση αντικτύπου σχετικά με την προστασία δεδομένων
  requirements:
  - code: '35.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Όταν μια επεξεργασία, ιδίως με νέες τεχνολογίες, ενδέχεται να επιφέρει υψηλό κίνδυνο για τα δικαιώματα των φυσικών προσώπων, ο υπεύθυνος διενεργεί εκτίμηση αντικτύπου πριν από την επεξεργασία.
    type: org
    control: Η εκτίμηση αντικτύπου είναι έγγραφο του υπευθύνου. Το Service Trust Portal της Microsoft διαθέτει τεκμηρίωση για την εκτίμηση αντικτύπου στις υπηρεσίες της, που χρησιμεύει ως είσοδος.
    evidence: Εκθέσεις εκτίμησης αντικτύπου με ημερομηνία, γνώμη του υπευθύνου προστασίας δεδομένων όπου υπάρχει, και απόφαση.
    verified: 2026-10-14
    comment: Χρειάζεται συχνά πριν την ενεργοποίηση νέων λειτουργιών που επεξεργάζονται δεδομένα εργαζομένων, π.χ. Insider Risk Management ή εργαλεία AI.
    kya:
    - 5
    iso:
    - A.5.34
- number: 37
  title: Ορισμός του υπευθύνου προστασίας δεδομένων
  requirements:
  - code: '37.1'
    scope: Υπεύθυνος και εκτελών
    requirement: Ο υπεύθυνος και ο εκτελών ορίζουν υπεύθυνο προστασίας δεδομένων όταν η επεξεργασία γίνεται από δημόσια αρχή, ή όταν οι βασικές τους δραστηριότητες περιλαμβάνουν τακτική και συστηματική παρακολούθηση σε μεγάλη κλίμακα ή επεξεργασία σε μεγάλη κλίμακα ειδικών κατηγοριών ή δεδομένων για ποινικές καταδίκες και αδικήματα.
    type: org
    control: Δεν υπάρχει ρύθμιση της Microsoft. Αν ορίσετε υπεύθυνο προστασίας δεδομένων, δώστε του πρόσβαση μόνο ανάγνωσης στα εργαλεία του Microsoft Purview που χρειάζεται, π.χ. Compliance Manager.
    evidence: Απόφαση ορισμού και γνωστοποίηση των στοιχείων του στην εποπτική αρχή.
    comment: Οργανωτικό και νομικό ζήτημα.
    kya:
    - 7
    iso:
    - A.5.2
    - A.5.34
- number: 44
  title: Γενικές αρχές για διαβιβάσεις
  requirements:
  - code: '44'
    scope: Υπεύθυνος και εκτελών
    requirement: Κάθε διαβίβαση δεδομένων προς τρίτη χώρα ή διεθνή οργανισμό γίνεται μόνο αν τηρούνται οι προϋποθέσεις του Κεφαλαίου V, ώστε να μην υπονομεύεται το επίπεδο προστασίας που εγγυάται ο Κανονισμός.
    type: mixed
    control: EU Data Boundary της Microsoft για την αποθήκευση και την επεξεργασία των δεδομένων των online υπηρεσιών εντός ΕΕ. Data location στο Microsoft 365 admin center για τη χώρα αποθήκευσης. Cloud Discovery του Microsoft Defender for Cloud Apps για εφαρμογές που αποθηκεύουν δεδομένα εκτός ΕΕ.
    evidence: 'Microsoft 365 admin center: Settings, Org settings, Organization profile, Data location. Defender for Cloud Apps: αναφορές Cloud Discovery.'
    verified: 2026-10-14
    license: Για Ελληνικούς tenants στη γεωγραφία European Union το Advanced Data Residency δεν εφαρμόζεται, γιατί η Ελλάδα δεν περιλαμβάνεται στις Local Region Geographies. Microsoft Defender for Cloud Apps (Microsoft 365 E5 ή αντίστοιχο)
    comment: Το EU Data Boundary έχει τεκμηριωμένες εξαιρέσεις, π.χ. για ορισμένες λειτουργίες ασφάλειας και υποστήριξης. Διαβάστε τες πριν δηλώσετε ότι «τίποτα δεν φεύγει από την ΕΕ».
    kya:
    - 12
    iso:
    - A.5.14
    - A.5.23
    posts:
    - title: 'Microsoft Defender for Cloud Apps: Μια πρακτική περιήγηση στο CASB'
      url: /posts/microsoft-defender-up-close-series/microsoft-defender-for-cloud-apps-deep-dive/
      page: /posts/Microsoft-Defender-Up-Close-Series/microsoft-defender-for-cloud-apps-deep-dive
- number: 46
  title: Διαβιβάσεις που υπόκεινται σε κατάλληλες εγγυήσεις
  requirements:
  - code: 46.2.γ
    scope: Υπεύθυνος και εκτελών
    requirement: Χωρίς απόφαση επάρκειας, η διαβίβαση επιτρέπεται με κατάλληλες εγγυήσεις, όπως οι τυποποιημένες ρήτρες προστασίας δεδομένων που εκδίδει η Επιτροπή, και εφόσον υπάρχουν εκτελεστά δικαιώματα και αποτελεσματικά ένδικα μέσα για τα υποκείμενα.
    type: mixed
    control: Το Data Protection Addendum (DPA) της Microsoft ενσωματώνει τις τυποποιημένες ρήτρες της Επιτροπής για τις διαβιβάσεις που κάνει η Microsoft. Data Loss Prevention του Microsoft Purview για τον έλεγχο της αποστολής δεδομένων σε εξωτερικούς παραλήπτες.
    evidence: 'Τρέχουσα έκδοση του DPA. Κατάλογος διαβιβάσεων με τη νομική βάση της καθεμίας. Purview: DLP policies.'
    verified: 2026-10-14
    comment: Για τις ΗΠΑ ισχύει επίσης η απόφαση επάρκειας (ΕΕ) 2023/1795 για το EU-U.S. Data Privacy Framework (άρθρο 45), μόνο για αποδέκτες πιστοποιημένους σε αυτό. Η απόφαση εκκρεμεί σε αναίρεση στο Δικαστήριο της ΕΕ, οπότε κρατήστε τις τυποποιημένες ρήτρες ως δεύτερη βάση. Οι διαβιβάσεις σε άλλους παρόχους θέλουν δική τους αξιολόγηση.
    kya:
    - 12
    iso:
    - A.5.14
    - A.5.20
