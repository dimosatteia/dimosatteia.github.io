      page: /posts/Microsoft-Defender-Up-Close-Series/microsoft-defender-for-cloud-apps-deep-dive
  - code: '28.2'
    scope: Υπεύθυνος και εκτελών
    requirement: Ο εκτελών δεν προσλαμβάνει άλλον εκτελούντα χωρίς προηγούμενη γραπτή άδεια του υπευθύνου. Με γενική άδεια, ενημερώνει τον υπεύθυνο για κάθε αλλαγή ώστε να μπορεί να αντιταχθεί.
    type: mixed
    control: Η Microsoft δημοσιεύει τη λίστα των υπεργολάβων επεξεργασίας (subprocessors) των online υπηρεσιών της στο Service Trust Portal και ενημερώνει για νέους υπεργολάβους όπως ορίζει το Data Protection Addendum (DPA).
    evidence: 'Service Trust Portal: τρέχουσα λίστα subprocessors και εγγραφή στις ειδοποιήσεις για αλλαγές.'
    verified: 2026-10-14
    comment: Για άλλους παρόχους, η απαίτηση καλύπτεται με τη σύμβαση και με την παρακολούθηση των αλλαγών τους. Δεν υπάρχει ρύθμιση στο Microsoft 365 που να το κάνει.
    kya:
    - 12
    iso:
    - A.5.20
    - A.5.21
  - code: '28.3'
    scope: Υπεύθυνος και εκτελών
    requirement: Η επεξεργασία από τον εκτελούντα διέπεται από σύμβαση ή άλλη νομική πράξη που ορίζει το αντικείμενο, τη διάρκεια, τη φύση και τον σκοπό της επεξεργασίας, τα είδη των δεδομένων και τις υποχρεώσεις του εκτελούντος, π.χ. εντολές, εμπιστευτικότητα, μέτρα ασφάλειας, συνδρομή και διαγραφή ή επιστροφή των δεδομένων.
    type: mixed
    control: Για τις online υπηρεσίες της Microsoft, οι όροι του άρθρου 28 περιλαμβάνονται στο Microsoft Products and Services Data Protection Addendum (DPA), που ισχύει μέσω της σύμβασης αδειοδότησης.
    evidence: Τρέχουσα έκδοση του DPA από το Microsoft Licensing (Product Terms). Συμβάσεις επεξεργασίας με τους υπόλοιπους εκτελούντες.
    verified: 2026-10-14
    comment: Το DPA καλύπτει μόνο τη Microsoft. Χρειάζεται σύμβαση με κάθε άλλον εκτελούντα, π.χ. πάροχο μισθοδοσίας, CRM ή IT support.
    kya:
    - 12
    iso:
    - A.5.20
