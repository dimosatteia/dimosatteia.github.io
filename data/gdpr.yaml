  - code: '33.3'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Η γνωστοποίηση περιγράφει τουλάχιστον τη φύση της παραβίασης, με τις κατηγορίες και τον κατά προσέγγιση αριθμό των υποκειμένων και των αρχείων, τα στοιχεία επικοινωνίας του υπευθύνου προστασίας δεδομένων ή άλλου σημείου επικοινωνίας, τις πιθανές συνέπειες και τα μέτρα που ελήφθησαν ή προτείνονται.
    type: mixed
