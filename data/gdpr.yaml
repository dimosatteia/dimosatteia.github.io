- number: 28
  title: Εκτελών την επεξεργασία
  requirements:
  - code: '28.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Ο υπεύθυνος χρησιμοποιεί μόνο εκτελούντες που παρέχουν επαρκείς διαβεβαιώσεις ότι εφαρμόζουν κατάλληλα τεχνικά και οργανωτικά μέτρα, ώστε η επεξεργασία να πληροί τις απαιτήσεις του Κανονισμού.
    type: mixed
    control: 'Για τη Microsoft ως εκτελούσα: εκθέσεις ελέγχου και πιστοποιητικά (π.χ. ISO/IEC 27001, ISO/IEC 27018, ISO/IEC 27701, SOC 2) στο Service Trust Portal. Για τις υπόλοιπες cloud εφαρμογές: Cloud app catalog του Microsoft Defender for Cloud Apps, με τα στοιχεία ασφάλειας και συμμόρφωσης κάθε εφαρμογής, και Cloud Discovery για όσες χρησιμοποιούνται χωρίς έγκριση.'
    evidence: 'Πιστοποιητικά της Microsoft από το Service Trust Portal. Defender for Cloud Apps: risk score και στοιχεία συμμόρφωσης των εφαρμογών, λίστα sanctioned και unsanctioned apps.'
    verified: 2026-10-14
    license: Microsoft Defender for Cloud Apps (Microsoft 365 E5 ή αντίστοιχο)
    comment: Η αξιολόγηση των εκτελούντων είναι διαδικασία του υπευθύνου. Τα στοιχεία του Cloud app catalog είναι ένδειξη και όχι διαβεβαίωση του παρόχου.
    kya:
