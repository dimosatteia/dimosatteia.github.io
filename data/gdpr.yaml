- number: 25
  title: Προστασία των δεδομένων ήδη από το σχεδιασμό και εξ ορισμού
  requirements:
  - code: '25.1'
    scope: Υπεύθυνος επεξεργασίας
    requirement: Ο υπεύθυνος εφαρμόζει, τόσο κατά τον καθορισμό των μέσων επεξεργασίας όσο και κατά την ίδια την επεξεργασία, κατάλληλα τεχνικά και οργανωτικά μέτρα, όπως η ψευδωνυμοποίηση, για την εφαρμογή των αρχών προστασίας δεδομένων και την ενσωμάτωση των αναγκαίων εγγυήσεων.
    type: mixed
    control: Sensitivity labels για Teams, Microsoft 365 Groups και SharePoint sites, ώστε τα δικαιώματα και η εξωτερική κοινή χρήση να ορίζονται κατά τη δημιουργία. DLP policies από την πρώτη μέρα σε κάθε νέο χώρο εργασίας.
    evidence: 'Purview: sensitivity labels με ρυθμίσεις για containers. Τεκμηρίωση του σχεδιασμού για νέες επεξεργασίες ή εφαρμογές.'
    verified: 2026-10-14
    license: Microsoft 365 E3 για sensitivity labels σε containers. Microsoft 365 E5 για αυτόματο labeling
    comment: Η ψευδωνυμοποίηση δεν είναι λειτουργία του Microsoft 365 και γίνεται στις εφαρμογές ή στις βάσεις δεδομένων. Ο σχεδιασμός νέων εφαρμογών είναι διαδικασία ανάπτυξης.
    kya:
